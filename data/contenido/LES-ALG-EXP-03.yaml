# =====================================================================
# LES-ALG-EXP-03 — Términos semejantes y suma de polinomios
# Cubre ALG-EXP-TERM, ALG-EXP-ADI
# =====================================================================
# Arista directa TERM -> ADI. TERM pide ALG-EXP-LENG (LES-ALG-EXP-01) y
# NUM-ENT-MUL (LES-NUM-ENT-03). LES-ALG-EXP-02 (VAL) va por otra rama:
# esta clase no valoriza.
#
# Alcance (propuesto, sin control 1):
#   TERM entra   término, coeficiente y parte literal; reconocer términos
#                semejantes (misma parte literal, mismos exponentes; ab y
#                ba son semejantes); reducir expresiones con coeficientes
#                enteros; coeficiente 1 y −1 implícitos; contexto que se
#                traduce (LENG) y después se reduce.
#        fuera   multiplicar monomios (ALG-EXP-MUL, ALG-EXP-POT);
#                valorizar (ALG-EXP-VAL); coeficientes fraccionarios
#                (NUM-FRA); grado de un polinomio como concepto.
#   ADI  entra   sumar y restar polinomios; suprimir paréntesis con + y
#                con − adelante; opuesto de un polinomio; P − Q con P y Q
#                dados; corchetes de dos niveles; contexto de dinero,
#                personas y edades.
#        fuera   un número distinto de ±1 delante del paréntesis,
#                3(x + 2) (ALG-EXP-MUL); perímetros con expresiones
#                (GEO-PER-POL no es ancestro).
#   notación  x² y x³ aparecen como notación, igual que en LES-ALG-EXP-01
#        (decisión de Ben entonces): ningún ítem calcula una potencia.
#
# Niveles:
#   1  una reducción directa, reconocer semejantes, un paréntesis
#   2  cuatro o más términos, varias letras, P ± Q, contexto de un paso
#   3  I/II/III, desarrollos para elegir, afirmaciones generales,
#      contexto de varios pasos
# ---------------------------------------------------------------------

unit: ALG-EXP

lesson:
  code: LES-ALG-EXP-03
  title: Términos semejantes y suma de polinomios
  position: 3
  nodes:
    - node: ALG-EXP-TERM
      anchor: terminos-semejantes
    - node: ALG-EXP-ADI
      anchor: adicion-y-sustraccion-de-polinomios


# ---------------------------------------------------------------------
# ITEMS
# ---------------------------------------------------------------------

items:

  # ===== ALG-EXP-TERM · nivel 1 ================================

  # A JUXTA: lee 5x como 5 + x y 3x como 3 + x
  # B EXPSUMA: suma los exponentes: x¹ + x¹ = x²
  # D MULTIPLICA: multiplica 5x · 3x
  - code: M1-EXP-046
    node: ALG-EXP-TERM
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuál es el resultado de reducir $5x + 3x$?"
    options:
      - {label: A, body: "$8 + 2x$", misconception: EXP-LENG-JUXTA}
      - {label: B, body: "$8x^2$", misconception: EXP-TERM-EXPSUMA}
      - {label: C, body: "$8x$", correct: true}
      - {label: D, body: "$15x^2$", misconception: EXP-TERM-MULTIPLICA}

  # B COEFUNO: la a sola vale 0
  # C JUNTA: suma todos los coeficientes y junta las letras
  # D EXPSUMA: 7a + a = 8a²
  - code: M1-EXP-047
    node: ALG-EXP-TERM
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuál es el resultado de reducir $7a + 2b + a$?"
    options:
      - {label: A, body: "$8a + 2b$", correct: true}
      - {label: B, body: "$7a + 2b$", misconception: EXP-TERM-COEFUNO}
      - {label: C, body: "$10ab$", misconception: EXP-TERM-JUNTA}
      - {label: D, body: "$8a^2 + 2b$", misconception: EXP-TERM-EXPSUMA}

  # A JUNTA: mismo coeficiente: le parecen semejantes
  # B POTMUL: confunde el cuadrado con el doble
  # C GRADO: misma letra: le parecen semejantes
  - code: M1-EXP-048
    node: ALG-EXP-TERM
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuál de los siguientes pares de términos son semejantes?"
    options:
      - {label: A, body: "$5a$ y $5b$", misconception: EXP-TERM-JUNTA}
      - {label: B, body: "$x^2$ y $2x$", misconception: EXP-LENG-POTMUL}
      - {label: C, body: "$3x^2$ y $3x$", misconception: EXP-TERM-GRADO}
      - {label: D, body: "$4x^2y$ y $-7x^2y$", correct: true}

  # 9m − m = 8m; queda 8m + 2m²
  # A COEFUNO: la m sola vale 0
  # C CANCELA: al restar, la m se va: 9m − m = 9
  # D GRADO: junta m con m²: 9 − 1 + 2 = 10
  - code: M1-EXP-049
    node: ALG-EXP-TERM
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuál es el resultado de reducir $9m - m + 2m^2$?"
    options:
      - {label: A, body: "$9m + 2m^2$", misconception: EXP-TERM-COEFUNO}
      - {label: B, body: "$8m + 2m^2$", correct: true}
      - {label: C, body: "$9 + 2m^2$", misconception: EXP-TERM-CANCELA}
      - {label: D, body: "$10m^2$", misconception: EXP-TERM-GRADO}

  # −6y + 2y = −4y
  # A MAGNOP: ve «+», suma tamaños 6 + 2 con el signo del negativo
  # B GRADO: junta y con y²: −6 + 2 + 1
  # C COEFUNO: el y² sin número vale 0
  - code: M1-EXP-050
    node: ALG-EXP-TERM
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuál es el resultado de reducir $-6y + 2y + y^2$?"
    options:
      - {label: A, body: "$-8y + y^2$", misconception: ENT-ADI-MAGNOP}
      - {label: B, body: "$-3y^2$", misconception: EXP-TERM-GRADO}
      - {label: C, body: "$-4y$", misconception: EXP-TERM-COEFUNO}
      - {label: D, body: "$-4y + y^2$", correct: true}

  # A REGLAMUL: menos con menos da más
  # C MULTIPLICA: multiplica (−3p)(−5p)
  # D MAGNOP: ve «−», resta tamaños 5 − 3 con el signo del negativo
  - code: M1-EXP-051
    node: ALG-EXP-TERM
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuál es el resultado de reducir $-3p - 5p$?"
    options:
      - {label: A, body: "$8p$", misconception: ENT-ADI-REGLAMUL}
      - {label: B, body: "$-8p$", correct: true}
      - {label: C, body: "$15p^2$", misconception: EXP-TERM-MULTIPLICA}
      - {label: D, body: "$-2p$", misconception: ENT-ADI-MAGNOP}

  # 4x + 2x = 6x; 3 − 1 = 2
  # A JUNTA: 4 + 3 + 2 − 1 = 8, todo con x
  # B EXPSUMA: 4x + 2x = 6x²
  # D SIGNOSUELTO: junta 3 y 1 sin el menos del 1
  - code: M1-EXP-052
    node: ALG-EXP-TERM
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuál es el resultado de reducir $4x + 3 + 2x - 1$?"
    options:
      - {label: A, body: "$8x$", misconception: EXP-TERM-JUNTA}
      - {label: B, body: "$6x^2 + 2$", misconception: EXP-TERM-EXPSUMA}
      - {label: C, body: "$6x + 2$", correct: true}
      - {label: D, body: "$6x + 4$", misconception: EXP-TERM-SIGNOSUELTO}

  # B MULTIPLICA: multiplica 2ab · 3ba
  # C EXPSUMA: suma los exponentes de cada letra
  # D JUXTA: lee 2ab como 2 + a + b
  - code: M1-EXP-053
    node: ALG-EXP-TERM
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuál es el resultado de reducir $2ab + 3ba$?"
    options:
      - {label: A, body: "$5ab$", correct: true}
      - {label: B, body: "$6a^2b^2$", misconception: EXP-TERM-MULTIPLICA}
      - {label: C, body: "$5a^2b^2$", misconception: EXP-TERM-EXPSUMA}
      - {label: D, body: "$5 + 2a + 2b$", misconception: EXP-LENG-JUXTA}

  # ===== ALG-EXP-TERM · nivel 2 ================================

  # x + 3x + (3x − 5) = 7x − 5
  # B JUNTA: 7x − 5 = 2x
  # C COEFUNO: la x de Sofía vale 0: 3x + 3x − 5
  # D ADITIVO: triple = x + 3: x + (x + 3) + (x + 3 − 5)
  - code: M1-EXP-054
    node: ALG-EXP-TERM
    pool: curated
    difficulty: 2
    source: propio
    stem: >-
      Sofía tiene $x$ láminas, Tomás tiene el triple que Sofía y Luis tiene
      $5$ menos que Tomás. ¿Qué expresión representa la cantidad de láminas
      que tienen entre los tres?
    options:
      - {label: A, body: "$7x - 5$", correct: true}
      - {label: B, body: "$2x$", misconception: EXP-TERM-JUNTA}
      - {label: C, body: "$6x - 5$", misconception: EXP-TERM-COEFUNO}
      - {label: D, body: "$3x + 1$", misconception: EXP-LENG-ADITIVO}

  # 4x − 3x = x; −2y + 5y = 3y
  # A SIGNOSUELTO: junta 4x con 3x sin su menos
  # B JUNTA: 4 − 2 − 3 + 5 = 4 y junta las letras
  # C CANCELA: 4x − 3x = 1: la x se va
  - code: M1-EXP-055
    node: ALG-EXP-TERM
    pool: curated
    difficulty: 2
    source: propio
    stem: "¿Cuál es el resultado de reducir $4x - 2y - 3x + 5y$?"
    options:
      - {label: A, body: "$7x + 3y$", misconception: EXP-TERM-SIGNOSUELTO}
      - {label: B, body: "$4xy$", misconception: EXP-TERM-JUNTA}
      - {label: C, body: "$1 + 3y$", misconception: EXP-TERM-CANCELA}
      - {label: D, body: "$x + 3y$", correct: true}

  # 3x² − x² = 2x²; 5x + 2x = 7x
  # A EXPSUMA: suma exponentes: 3x² − x² = 2x⁴, 5x + 2x = 7x²
  # C GRADO: junta x² con x: 3 + 5 − 1 + 2
  # D COEFUNO: el −x² vale 0
  - code: M1-EXP-056
    node: ALG-EXP-TERM
    pool: curated
    difficulty: 2
    source: propio
    stem: "¿Cuál es el resultado de reducir $3x^2 + 5x - x^2 + 2x$?"
    options:
      - {label: A, body: "$2x^4 + 7x^2$", misconception: EXP-TERM-EXPSUMA}
      - {label: B, body: "$2x^2 + 7x$", correct: true}
      - {label: C, body: "$9x^2$", misconception: EXP-TERM-GRADO}
      - {label: D, body: "$3x^2 + 7x$", misconception: EXP-TERM-COEFUNO}

  # 5ab + 3ab = 8ab; −2a − 7a = −9a
  # A REGLAMUL: −2a − 7a: menos con menos da más
  # B EXPSUMA: suma los exponentes al juntar
  # D JUNTA: 8ab − 9a: 8 − 9 = −1 con ab
  - code: M1-EXP-057
    node: ALG-EXP-TERM
    pool: curated
    difficulty: 2
    source: propio
    stem: "¿Cuál es el resultado de reducir $5ab - 2a + 3ab - 7a$?"
    options:
      - {label: A, body: "$8ab + 9a$", misconception: ENT-ADI-REGLAMUL}
      - {label: B, body: "$8a^2b^2 - 9a^2$", misconception: EXP-TERM-EXPSUMA}
      - {label: C, body: "$8ab - 9a$", correct: true}
      - {label: D, body: "$-ab$", misconception: EXP-TERM-JUNTA}

  # Ana 3p + 2q; Beto 2p + 5q; total 5p + 7q
  # A EXPSUMA: 3p + 2p = 5p²
  # B JUNTA: 3 + 2 + 2 + 5 = 12 y junta las letras
  # C ADITIVO: 3 cuadernos a p pesos = 3 + p
  - code: M1-EXP-058
    node: ALG-EXP-TERM
    pool: curated
    difficulty: 2
    source: propio
    stem: >-
      En una librería cada cuaderno cuesta $p$ pesos y cada lápiz $q$ pesos.
      Ana compra $3$ cuadernos y $2$ lápices, y Beto compra $2$ cuadernos y
      $5$ lápices. ¿Qué expresión representa lo que gastan entre los dos?
    options:
      - {label: A, body: "$5p^2 + 7q^2$", misconception: EXP-TERM-EXPSUMA}
      - {label: B, body: "$12pq$", misconception: EXP-TERM-JUNTA}
      - {label: C, body: "$12 + 2p + 2q$", misconception: EXP-LENG-ADITIVO}
      - {label: D, body: "$5p + 7q$", correct: true}

  # 6xy − 2yx = 4xy; queda 4xy + x
  # A JUNTA: 6 − 2 + 1 = 5 y junta todo en xy
  # B COEFUNO: la x sola vale 0
  # D EXPSUMA: suma los exponentes al restar semejantes
  - code: M1-EXP-059
    node: ALG-EXP-TERM
    pool: curated
    difficulty: 2
    source: propio
    stem: "¿Cuál es el resultado de reducir $6xy - 2yx + x$?"
    options:
      - {label: A, body: "$5xy$", misconception: EXP-TERM-JUNTA}
      - {label: B, body: "$4xy$", misconception: EXP-TERM-COEFUNO}
      - {label: C, body: "$4xy + x$", correct: true}
      - {label: D, body: "$4x^2y^2 + x$", misconception: EXP-TERM-EXPSUMA}

  # A COEFUNO: la w sola vale 0
  # C EXPSUMA: suma los exponentes
  # D CANCELA: la letra se va al restar
  - code: M1-EXP-060
    node: ALG-EXP-TERM
    pool: curated
    difficulty: 2
    source: propio
    stem: "¿Cuál de las siguientes igualdades es verdadera?"
    options:
      - {label: A, body: "$4w + w = 4w$", misconception: EXP-TERM-COEFUNO}
      - {label: B, body: "$8n - 7n = n$", correct: true}
      - {label: C, body: "$2z + 2z = 4z^2$", misconception: EXP-TERM-EXPSUMA}
      - {label: D, body: "$6k - 5k = 1$", misconception: EXP-TERM-CANCELA}

  # B POTMUL: confunde sumar tres veces con elevar al cubo
  # C JUNTA: junta todo en un solo término
  # D MULTIPLICA: 3a · 2b
  - code: M1-EXP-061
    node: ALG-EXP-TERM
    pool: curated
    difficulty: 2
    source: propio
    stem: "¿Cuál expresión es equivalente a $a + a + a + b + b$?"
    options:
      - {label: A, body: "$3a + 2b$", correct: true}
      - {label: B, body: "$a^3 + b^2$", misconception: EXP-LENG-POTMUL}
      - {label: C, body: "$5ab$", misconception: EXP-TERM-JUNTA}
      - {label: D, body: "$6ab$", misconception: EXP-TERM-MULTIPLICA}

  # ===== ALG-EXP-TERM · nivel 3 ================================

  # A EXPSUMA: rechaza I: cree que da 5x²; y rechaza II y III
  # B CANCELA: acepta III: la b se va al restar
  # C GRADO: acepta II: misma letra
  - code: M1-EXP-062
    node: ALG-EXP-TERM
    pool: curated
    difficulty: 3
    source: propio
    stem: |-
      Considera las siguientes igualdades:

      I. $3x + 2x = 5x$

      II. $4a^2 + 3a = 7a^2$

      III. $6b - b = 6$

      ¿Cuál o cuáles son verdaderas?
    options:
      - {label: A, body: "Ninguna de ellas", misconception: EXP-TERM-EXPSUMA}
      - {label: B, body: "Solo I y III", misconception: EXP-TERM-CANCELA}
      - {label: C, body: "Solo I y II", misconception: EXP-TERM-GRADO}
      - {label: D, body: "Solo I", correct: true}

  # v + 2v + (2v − 30) = 5v − 30
  # B JUNTA: 5v − 30: 5 − 30 = −25 con v
  # C ORDENRESTA: «30 menos que el martes» = 30 − 2v: v + 2v + 30 − 2v
  # D COEFUNO: la v del lunes vale 0
  - code: M1-EXP-063
    node: ALG-EXP-TERM
    pool: curated
    difficulty: 3
    source: propio
    stem: >-
      Un sitio web tuvo $v$ visitas el lunes. El martes tuvo el doble de
      visitas que el lunes, y el miércoles tuvo $30$ visitas menos que el
      martes. ¿Qué expresión representa el total de visitas de los tres
      días?
    options:
      - {label: A, body: "$5v - 30$", correct: true}
      - {label: B, body: "$-25v$", misconception: EXP-TERM-JUNTA}
      - {label: C, body: "$v + 30$", misconception: EXP-LENG-ORDENRESTA}
      - {label: D, body: "$4v - 30$", misconception: EXP-TERM-COEFUNO}

  # semejantes ⇒ n = 2; 3x²y − 2x²y = x²y
  # A SIGNOSUELTO: suma 3 y 2 sin el menos
  # B MULTIPLICA: multiplica los términos
  # D EXPSUMA: suma los exponentes
  - code: M1-EXP-064
    node: ALG-EXP-TERM
    pool: curated
    difficulty: 3
    source: propio
    stem: >-
      Los términos $3x^ny$ y $-2x^2y$ son semejantes. ¿Cuál es el resultado
      de sumarlos?
    options:
      - {label: A, body: "$5x^2y$", misconception: EXP-TERM-SIGNOSUELTO}
      - {label: B, body: "$-6x^4y^2$", misconception: EXP-TERM-MULTIPLICA}
      - {label: C, body: "$x^2y$", correct: true}
      - {label: D, body: "$x^4y^2$", misconception: EXP-TERM-EXPSUMA}

  # A EXPSUMA: rechaza I: cree que da x⁴
  # C GRADO: acepta II
  # D COEFUNO: rechaza III: la a sola vale 0, queda −3a
  - code: M1-EXP-065
    node: ALG-EXP-TERM
    pool: curated
    difficulty: 3
    source: propio
    stem: |-
      Considera las siguientes afirmaciones:

      I. $x^2 + x^2 = 2x^2$

      II. $x^2$ y $x$ son semejantes, porque tienen la misma letra.

      III. $-3a - a = -4a$

      ¿Cuál o cuáles son verdaderas?
    options:
      - {label: A, body: "Solo III", misconception: EXP-TERM-EXPSUMA}
      - {label: B, body: "Solo I y III", correct: true}
      - {label: C, body: "I, II y III", misconception: EXP-TERM-GRADO}
      - {label: D, body: "Solo I", misconception: EXP-TERM-COEFUNO}

  # 12p + (12 − 8)p − 3p = 13p
  # A JUNTA: junta las cantidades por un lado y el precio por otro
  # B ORDENRESTA: «8 menos que el lunes» = 8 − 12 = −4: 12p − 4p − 3p
  # D SIGNOSUELTO: suma la devolución: 12p + 4p + 3p
  - code: M1-EXP-066
    node: ALG-EXP-TERM
    pool: curated
    difficulty: 3
    source: propio
    stem: >-
      Una tienda vende poleras a $p$ pesos cada una. El lunes vendió $12$
      poleras, el martes $8$ menos que el lunes, y el miércoles le
      devolvieron $3$ poleras y devolvió el dinero. ¿Qué expresión
      representa el dinero que ganó la tienda en los tres días?
    options:
      - {label: A, body: "$13 + p$", misconception: EXP-TERM-JUNTA}
      - {label: B, body: "$5p$", misconception: EXP-LENG-ORDENRESTA}
      - {label: C, body: "$13p$", correct: true}
      - {label: D, body: "$19p$", misconception: EXP-TERM-SIGNOSUELTO}

  # −4ab + 7ab − 3ab = 0
  # A MAGNOP: −4ab + 7ab: ve «+», suma tamaños 11 con el signo del negativo; −11ab − 3ab
  # B REGLAMUL: −4ab − 3ab: menos con menos da más, 7ab + 7ab
  # C EXPSUMA: −4ab + 7ab = 3a²b²
  - code: M1-EXP-067
    node: ALG-EXP-TERM
    pool: curated
    difficulty: 3
    source: propio
    stem: "¿Cuál es el resultado de reducir $-4ab + 7ab - 3ab$?"
    options:
      - {label: A, body: "$-14ab$", misconception: ENT-ADI-MAGNOP}
      - {label: B, body: "$14ab$", misconception: ENT-ADI-REGLAMUL}
      - {label: C, body: "$3a^2b^2 - 3ab$", misconception: EXP-TERM-EXPSUMA}
      - {label: D, body: "$0$", correct: true}

  # 3x + 2x − x = 4x
  # A COEFUNO: la x sola vale 0: 5x − 0
  # C CANCELA: 5x − x = 5: la x se va al restar
  # D POTMUL: triple = cubo, doble = cuadrado
  - code: M1-EXP-068
    node: ALG-EXP-TERM
    pool: curated
    difficulty: 3
    source: propio
    stem: >-
      ¿Qué expresión representa «el triple de un número, más el doble del
      mismo número, menos el número»?
    options:
      - {label: A, body: "$5x$", misconception: EXP-TERM-COEFUNO}
      - {label: B, body: "$4x$", correct: true}
      - {label: C, body: "$5$", misconception: EXP-TERM-CANCELA}
      - {label: D, body: "$x^3 + x^2 - x$", misconception: EXP-LENG-POTMUL}

  # 5a + 2a = 7a; −3b − b = −4b
  # B SIGNOSUELTO: el −b pierde su signo al agruparlo
  # C REGLAMUL: menos con menos da más
  # D COEFUNO: la b sola vale 0
  - code: M1-EXP-069
    node: ALG-EXP-TERM
    pool: curated
    difficulty: 3
    source: propio
    stem: >-
      ¿Cuál de los siguientes desarrollos para reducir $5a - 3b + 2a - b$ es
      correcto?
    options:
      - {label: A, body: "$(5a + 2a) + (-3b - b) = 7a - 4b$", correct: true}
      - {label: B, body: "$(5a + 2a) + (-3b + b) = 7a - 2b$", misconception: EXP-TERM-SIGNOSUELTO}
      - {label: C, body: "$(5a + 2a) + (-3b - b) = 7a + 4b$", misconception: ENT-ADI-REGLAMUL}
      - {label: D, body: "$(5a + 2a) + (-3b - b) = 7a - 3b$", misconception: EXP-TERM-COEFUNO}

  # ===== ALG-EXP-ADI · nivel 1 =================================

  # 2a − 5a + 4 = −3a + 4
  # A SIGNOPAR: cambia solo el signo del 5a
  # C IGNORA: 2a + 5a − 4: el menos desaparece
  # D JUNTA: −3a + 4: −3 + 4 = 1 con a
  - code: M1-EXP-070
    node: ALG-EXP-ADI
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuál es el resultado de $2a - (5a - 4)$?"
    options:
      - {label: A, body: "$-3a - 4$", misconception: EXP-ADI-SIGNOPAR}
      - {label: B, body: "$-3a + 4$", correct: true}
