# =====================================================================
# LES-GEO-TRA-04 — Rotaciones y simetría central
# Cubre GEO-TRA-ROT-90, GEO-TRA-ROT-CEN, GEO-TRA-SIM-CEN
# =====================================================================
# ROT-90 pide GEO-PLA-COORD (LES-GEO-TRA-01). ROT-CEN pide ROT-90 y
# GEO-TRA-TRAS (LES-GEO-TRA-02). SIM-CEN pide ROT-90 y GEO-TRA-REF-EJE
# (LES-GEO-TRA-03). Simetría central = rotación de 180°.
#
# Alcance (propuesto, sin control 1):
#   ROT-90  entra   giros de 90°, 180° y 270° alrededor del origen, en
#                   sentido antihorario u horario (siempre se dice cuál);
#                   imagen de puntos y figuras; preimagen; reconocer el
#                   giro entre una figura y su imagen.
#   ROT-CEN entra   giros de 90° y 180° alrededor de un centro C: restar
#                   C, girar, sumar C; preimagen; encontrar el centro en
#                   casos simples.
#           fuera   ángulos que no son múltiplos de 90° (necesitan
#                   trigonometría, M2).
#   SIM-CEN entra   simétrico de un punto respecto del origen y de un
#                   punto C (2C − P); centro de simetría como punto medio;
#                   figuras con simetría central.
#           fuera   composición general (GEO-TRA-COMP); propiedades
#                   comparadas (GEO-TRA-PROP).
#
# Niveles:
#   1  un punto, un giro, la regla
#   2  figuras, preimagen, contexto de un paso
#   3  I/II/III, letras, encontrar el centro, contexto de dos pasos
# ---------------------------------------------------------------------

unit: GEO-TRA

lesson:
  code: LES-GEO-TRA-04
  title: Rotaciones y simetría central
  position: 4
  nodes:
    - node: GEO-TRA-ROT-90
      anchor: rotacion-en-multiplos-de-90
    - node: GEO-TRA-ROT-CEN
      anchor: rotacion-respecto-de-un-punto
    - node: GEO-TRA-SIM-CEN
      anchor: simetria-central


# ---------------------------------------------------------------------
# ITEMS
# ---------------------------------------------------------------------

items:

  # ===== GEO-TRA-ROT-90 · nivel 1 ==============================

  # A SOLOSIGNO: cambia un signo sin intercambiar
  # C SENTIDO: gira en sentido horario
  # D SOLOCAMBIA: intercambia sin cambiar signos
  - code: M1-TRA-145
    node: GEO-TRA-ROT-90
    pool: curated
    difficulty: 1
    source: propio
    stem: >-
      ¿Cuál es la imagen del punto $P(3, 1)$ al rotarlo $90°$ en sentido
      antihorario alrededor del origen?
    options:
      - {label: A, body: "$(-3, 1)$", misconception: TRA-ROT90-SOLOSIGNO}
      - {label: B, body: "$(-1, 3)$", correct: true}
      - {label: C, body: "$(1, -3)$", misconception: TRA-ROT90-SENTIDO}
      - {label: D, body: "$(1, 3)$", misconception: TRA-ROT90-SOLOCAMBIA}

  # B ANGULO: aplica el giro de 90° antihorario
  # C SOLOCAMBIA: intercambia las coordenadas
  # D SOLOSIGNO: cambia un solo signo
  - code: M1-TRA-146
    node: GEO-TRA-ROT-90
    pool: curated
    difficulty: 1
    source: propio
    stem: >-
      ¿Cuál es la imagen del punto $Q(-2, 5)$ al rotarlo $180°$ alrededor
      del origen?
    options:
      - {label: A, body: "$(2, -5)$", correct: true}
      - {label: B, body: "$(-5, -2)$", misconception: TRA-ROT90-ANGULO}
      - {label: C, body: "$(5, -2)$", misconception: TRA-ROT90-SOLOCAMBIA}
      - {label: D, body: "$(2, 5)$", misconception: TRA-ROT90-SOLOSIGNO}

  # A SOLOCAMBIA: intercambia sin cambiar signos
  # B SOLOSIGNO: cambia un signo sin intercambiar
  # D SENTIDO: gira en sentido antihorario
  - code: M1-TRA-147
    node: GEO-TRA-ROT-90
    pool: curated
    difficulty: 1
    source: propio
    stem: >-
      ¿Cuál es la imagen del punto $(4, -3)$ al rotarlo $90°$ en sentido
      horario alrededor del origen?
    options:
      - {label: A, body: "$(-3, 4)$", misconception: TRA-ROT90-SOLOCAMBIA}
      - {label: B, body: "$(-4, -3)$", misconception: TRA-ROT90-SOLOSIGNO}
      - {label: C, body: "$(-3, -4)$", correct: true}
      - {label: D, body: "$(3, 4)$", misconception: TRA-ROT90-SENTIDO}

  # A SENTIDO: gira en sentido horario
  # B ANGULO: gira 180°
  # C SOLOCAMBIA: intercambia las coordenadas: refleja en y = x
  - code: M1-TRA-148
    node: GEO-TRA-ROT-90
    pool: curated
    difficulty: 1
    source: propio
    figure: FIG-ROT-90-01
    stem: >-
      ¿Cuál de las figuras numeradas es la imagen de $F$ al rotarla $90°$ en
      sentido antihorario alrededor del origen?
    options:
      - {label: A, body: "La figura 2", misconception: TRA-ROT90-SENTIDO}
      - {label: B, body: "La figura 3", misconception: TRA-ROT90-ANGULO}
      - {label: C, body: "La figura 4", misconception: TRA-ROT90-SOLOCAMBIA}
      - {label: D, body: "La figura 1", correct: true}

  # A ANGULO: la regla de 180° para 90°
  # C SOLOCAMBIA: olvida el signo
  # D SENTIDO: gira en sentido horario
  - code: M1-TRA-149
    node: GEO-TRA-ROT-90
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuál de las siguientes afirmaciones es correcta?"
    options:
      - {label: A, body: "Al rotar un punto $90°$ alrededor del origen, sus dos coordenadas cambian de signo.", misconception: TRA-ROT90-ANGULO}
      - {label: B, body: "Al rotar un punto $180°$ alrededor del origen, sus dos coordenadas cambian de signo.", correct: true}
      - {label: C, body: "Al rotar un punto $90°$ alrededor del origen, sus coordenadas se intercambian sin cambiar de signo.", misconception: TRA-ROT90-SOLOCAMBIA}
      - {label: D, body: "Al rotar el punto $(1, 0)$ en $90°$ antihorario alrededor del origen, queda en $(0, -1)$.", misconception: TRA-ROT90-SENTIDO}

  # A SOLOCAMBIA: intercambia sin cambiar signos
  # B SENTIDO: gira en sentido horario
  # C SOLOSIGNO: cambia un signo sin intercambiar
  - code: M1-TRA-150
    node: GEO-TRA-ROT-90
    pool: curated
    difficulty: 1
    source: propio
    stem: >-
      Un brazo robótico está fijo en el origen y su extremo está en el punto
      $(2, 4)$. Si el brazo gira $90°$ en sentido antihorario, ¿dónde queda
      su extremo?
    options:
      - {label: A, body: "$(4, 2)$", misconception: TRA-ROT90-SOLOCAMBIA}
      - {label: B, body: "$(4, -2)$", misconception: TRA-ROT90-SENTIDO}
      - {label: C, body: "$(-2, 4)$", misconception: TRA-ROT90-SOLOSIGNO}
      - {label: D, body: "$(-4, 2)$", correct: true}

  # A(4, 2) → (−2, 4)
  # A ORDEN: lee A como (2, 4) y lo gira
  # B SOLOCAMBIA: intercambia sin cambiar signos
  # D SENTIDO: gira en sentido horario
  - code: M1-TRA-151
    node: GEO-TRA-ROT-90
    pool: curated
    difficulty: 1
    source: propio
    figure: FIG-ROT-90-02
    stem: >-
      ¿Cuál es la imagen del punto $A$ al rotarlo $90°$ en sentido
      antihorario alrededor del origen?
    options:
      - {label: A, body: "$(-4, 2)$", misconception: PLA-COORD-ORDEN}
      - {label: B, body: "$(2, 4)$", misconception: TRA-ROT90-SOLOCAMBIA}
      - {label: C, body: "$(-2, 4)$", correct: true}
      - {label: D, body: "$(2, -4)$", misconception: TRA-ROT90-SENTIDO}

  # B SENTIDO: gira en sentido horario
  # C ANGULO: gira 180°
  # D SOLOCAMBIA: intercambia sin cambiar signos
  - code: M1-TRA-152
    node: GEO-TRA-ROT-90
    pool: curated
    difficulty: 1
    source: propio
    stem: >-
      Un punto del primer cuadrante se rota $90°$ en sentido antihorario
      alrededor del origen. ¿Dónde queda su imagen?
    options:
      - {label: A, body: "En el segundo cuadrante.", correct: true}
      - {label: B, body: "En el cuarto cuadrante.", misconception: TRA-ROT90-SENTIDO}
      - {label: C, body: "En el tercer cuadrante.", misconception: TRA-ROT90-ANGULO}
      - {label: D, body: "En el primer cuadrante.", misconception: TRA-ROT90-SOLOCAMBIA}

  # ===== GEO-TRA-ROT-90 · nivel 2 ==============================

  # A ANGULO: gira 180°
  # B SENTIDO: gira en sentido horario
  # C SOLOCAMBIA: intercambia sin cambiar signos
  - code: M1-TRA-153
    node: GEO-TRA-ROT-90
    pool: curated
    difficulty: 2
    source: propio
    stem: >-
      El triángulo de vértices $A(1, 1)$, $B(3, 1)$ y $C(1, 4)$ se rota
      $90°$ en sentido antihorario alrededor del origen. ¿Cuáles son los
      vértices de la imagen?
    options:
      - {label: A, body: "$A'(-1, -1)$, $B'(-3, -1)$ y $C'(-1, -4)$", misconception: TRA-ROT90-ANGULO}
      - {label: B, body: "$A'(1, -1)$, $B'(1, -3)$ y $C'(4, -1)$", misconception: TRA-ROT90-SENTIDO}
      - {label: C, body: "$A'(1, 1)$, $B'(1, 3)$ y $C'(4, 1)$", misconception: TRA-ROT90-SOLOCAMBIA}
      - {label: D, body: "$A'(-1, 1)$, $B'(-1, 3)$ y $C'(-4, 1)$", correct: true}

  # P' = (−y, x) = (−5, 2) ⇒ P = (2, 5)
  # A SOLOCAMBIA: deshace intercambiando sin cambiar signos
  # B ANGULO: deshace con un giro de 180°
  # D SENTIDO: vuelve a girar P' en sentido antihorario
  - code: M1-TRA-154
    node: GEO-TRA-ROT-90
    pool: curated
    difficulty: 2
    source: propio
    stem: >-
      Al rotar un punto $P$ en $90°$ en sentido antihorario alrededor del
      origen, se obtiene $P'(-5, 2)$. ¿Cuáles son las coordenadas de $P$?
    options:
      - {label: A, body: "$(2, -5)$", misconception: TRA-ROT90-SOLOCAMBIA}
      - {label: B, body: "$(5, -2)$", misconception: TRA-ROT90-ANGULO}
      - {label: C, body: "$(2, 5)$", correct: true}
      - {label: D, body: "$(-2, -5)$", misconception: TRA-ROT90-SENTIDO}

  # 270° antihorario = 90° horario: (y, −x) = (−2, −3)
  # A SENTIDO: usa la regla de 90° antihorario
  # C ANGULO: usa la regla de 180°
  # D SOLOCAMBIA: intercambia sin cambiar signos
  - code: M1-TRA-155
    node: GEO-TRA-ROT-90
    pool: curated
    difficulty: 2
    source: propio
    stem: >-
      ¿Cuál es la imagen del punto $(3, -2)$ al rotarlo $270°$ en sentido
      antihorario alrededor del origen?
    options:
      - {label: A, body: "$(2, 3)$", misconception: TRA-ROT90-SENTIDO}
      - {label: B, body: "$(-2, -3)$", correct: true}
      - {label: C, body: "$(-3, 2)$", misconception: TRA-ROT90-ANGULO}
      - {label: D, body: "$(-2, 3)$", misconception: TRA-ROT90-SOLOCAMBIA}

  # B ANGULO: rechaza las tres: usa (−x, −y)
  # C SOLOCAMBIA: acepta II
  # D SENTIDO: rechaza I (le da (0, −2)) y acepta III
  - code: M1-TRA-156
    node: GEO-TRA-ROT-90
    pool: curated
    difficulty: 2
    source: propio
    stem: |-
      Considera las siguientes afirmaciones sobre rotaciones de $90°$ en sentido antihorario alrededor del origen:

      I. La imagen de $(2, 0)$ es $(0, 2)$.

      II. La imagen de $(1, 3)$ es $(3, 1)$.

      III. La imagen de $(4, 1)$ es $(1, -4)$.

      ¿Cuál o cuáles son correctas?
    options:
      - {label: A, body: "Solo I", correct: true}
      - {label: B, body: "Ninguna de ellas", misconception: TRA-ROT90-ANGULO}
      - {label: C, body: "Solo I y II", misconception: TRA-ROT90-SOLOCAMBIA}
      - {label: D, body: "Solo III", misconception: TRA-ROT90-SENTIDO}

  # (−3, −5) → (5, −3)
  # A SOLOCAMBIA: intercambia sin cambiar signos
  # B ANGULO: gira 180°
  # D SENTIDO: gira en sentido horario
  - code: M1-TRA-157
    node: GEO-TRA-ROT-90
    pool: curated
    difficulty: 2
    source: propio
    stem: >-
      Una rueda de la fortuna tiene su centro en el origen. Una de sus
      cabinas está en el punto $(-3, -5)$. Si la rueda gira $90°$ en sentido
      antihorario, ¿dónde queda esa cabina?
    options:
      - {label: A, body: "$(-5, -3)$", misconception: TRA-ROT90-SOLOCAMBIA}
      - {label: B, body: "$(3, 5)$", misconception: TRA-ROT90-ANGULO}
      - {label: C, body: "$(5, -3)$", correct: true}
      - {label: D, body: "$(-5, 3)$", misconception: TRA-ROT90-SENTIDO}

  # B ANGULO: cada giro de 90° le parece de 180°
  # C SOLOSIGNO: cada giro cambia un signo
  # D SOLOCAMBIA: intercambiar dos veces vuelve al punto
  - code: M1-TRA-158
    node: GEO-TRA-ROT-90
    pool: curated
    difficulty: 2
    source: propio
    stem: >-
      Rotar un punto dos veces seguidas en $90°$, en sentido antihorario y
      alrededor del origen, es lo mismo que:
    options:
      - {label: A, body: "Rotarlo $180°$ alrededor del origen.", correct: true}
      - {label: B, body: "Rotarlo $360°$ alrededor del origen.", misconception: TRA-ROT90-ANGULO}
      - {label: C, body: "Reflejarlo respecto de un eje.", misconception: TRA-ROT90-SOLOSIGNO}
      - {label: D, body: "Dejarlo donde estaba.", misconception: TRA-ROT90-SOLOCAMBIA}

  # A ANGULO: confunde el ángulo
  # C SOLOSIGNO: ve que cambió de lado y lo toma por una reflexión (débil)
  # D SENTIDO: confunde el sentido
  - code: M1-TRA-159
    node: GEO-TRA-ROT-90
    pool: curated
    difficulty: 2
    source: propio
    figure: FIG-ROT-90-03
    stem: >-
      $F'$ es la imagen de $F$ por una rotación con centro en el origen.
      ¿Cuál es esa rotación?
    options:
      - {label: A, body: "Un giro de $180°$.", misconception: TRA-ROT90-ANGULO}
      - {label: B, body: "Un giro de $90°$ en sentido antihorario.", correct: true}
      - {label: C, body: "No es un giro: es un reflejo respecto del eje $y$.", misconception: TRA-ROT90-SOLOSIGNO}
      - {label: D, body: "Un giro de $90°$ en sentido horario.", misconception: TRA-ROT90-SENTIDO}

  # A SOLOCAMBIA: intercambia sin cambiar signos
  # B ANGULO: gira 180°
  # C SENTIDO: gira en sentido antihorario
  - code: M1-TRA-160
    node: GEO-TRA-ROT-90
    pool: curated
    difficulty: 2
    source: propio
    stem: >-
      Sean $a$ y $b$ números positivos. ¿Cuál es la imagen de $(a, b)$ al
      rotarlo $90°$ en sentido horario alrededor del origen, y en qué
      cuadrante queda?
    options:
      - {label: A, body: "$(b, a)$, en el primer cuadrante.", misconception: TRA-ROT90-SOLOCAMBIA}
      - {label: B, body: "$(-a, -b)$, en el tercer cuadrante.", misconception: TRA-ROT90-ANGULO}
      - {label: C, body: "$(-b, a)$, en el segundo cuadrante.", misconception: TRA-ROT90-SENTIDO}
      - {label: D, body: "$(b, -a)$, en el cuarto cuadrante.", correct: true}

  # ===== GEO-TRA-ROT-90 · nivel 3 ==============================

  # A SOLOCAMBIA: acepta III
  # B SOLOSIGNO: rechaza II: en 180° cambia un solo signo
  # C SENTIDO: rechaza I: le da (0, −3)
  - code: M1-TRA-161
    node: GEO-TRA-ROT-90
    pool: curated
    difficulty: 3
    source: propio
    stem: |-
      Considera las siguientes afirmaciones sobre rotaciones alrededor del origen:

      I. Al rotar $(3, 0)$ en $90°$ en sentido antihorario, se obtiene $(0, 3)$.

      II. Al rotar $(1, 2)$ en $180°$, se obtiene $(-1, -2)$.

      III. Al rotar $(2, 5)$ en $90°$ en sentido antihorario, se obtiene $(5, 2)$.

      ¿Cuál o cuáles son correctas?
    options:
      - {label: A, body: "I, II y III", misconception: TRA-ROT90-SOLOCAMBIA}
      - {label: B, body: "Solo I", misconception: TRA-ROT90-SOLOSIGNO}
      - {label: C, body: "Solo II", misconception: TRA-ROT90-SENTIDO}
      - {label: D, body: "Solo I y II", correct: true}

  # (−4, 1) horario → (y, −x) = (1, 4)
  # B SOLOCAMBIA: intercambia sin cambiar signos
  # C ANGULO: gira 180°
  # D SENTIDO: gira en sentido antihorario
  - code: M1-TRA-162
    node: GEO-TRA-ROT-90
    pool: curated
    difficulty: 3
    source: propio
    stem: >-
      En un juego, el tablero cuadriculado gira $90°$ en sentido horario
      alrededor del origen. Una pieza estaba en el punto $(-4, 1)$. ¿Dónde
      queda después del giro?
    options:
      - {label: A, body: "$(1, 4)$", correct: true}
      - {label: B, body: "$(1, -4)$", misconception: TRA-ROT90-SOLOCAMBIA}
      - {label: C, body: "$(4, -1)$", misconception: TRA-ROT90-ANGULO}
      - {label: D, body: "$(-1, -4)$", misconception: TRA-ROT90-SENTIDO}

  # P = horario(3, −6) = (−6, −3); 180° → (6, 3)
  # A SENTIDO: recupera P girando al revés: P = (6, 3)
  # B ANGULO: aplica el giro de 180° a la imagen
  # D SOLOCAMBIA: recupera P intercambiando: P = (−6, 3)
  - code: M1-TRA-163
    node: GEO-TRA-ROT-90
    pool: curated
    difficulty: 3
    source: propio
    stem: >-
      Al rotar un punto $P$ en $90°$ en sentido antihorario alrededor del
      origen se obtiene $(3, -6)$. ¿Qué se obtiene si, en cambio, $P$ se
      rota $180°$ alrededor del origen?
    options:
      - {label: A, body: "$(-6, -3)$", misconception: TRA-ROT90-SENTIDO}
      - {label: B, body: "$(-3, 6)$", misconception: TRA-ROT90-ANGULO}
      - {label: C, body: "$(6, 3)$", correct: true}
      - {label: D, body: "$(6, -3)$", misconception: TRA-ROT90-SOLOCAMBIA}

  # A ANGULO: gira (3, 1) en 90°
  # C SOLOCAMBIA: intercambia las coordenadas de (3, 1)
  # D SOLOSIGNO: cambia un solo signo a (3, 1)
  - code: M1-TRA-164
    node: GEO-TRA-ROT-90
    pool: curated
    difficulty: 3
    source: propio
    stem: >-
      El cuadrado de vértices $(1, 1)$, $(3, 1)$, $(3, 3)$ y $(1, 3)$ se
      rota $180°$ alrededor del origen. ¿Cuál de los siguientes puntos es un
      vértice de la imagen?
    options:
      - {label: A, body: "$(-1, 3)$", misconception: TRA-ROT90-ANGULO}
      - {label: B, body: "$(-3, -3)$", correct: true}
      - {label: C, body: "$(1, 3)$", misconception: TRA-ROT90-SOLOCAMBIA}
      - {label: D, body: "$(-3, 1)$", misconception: TRA-ROT90-SOLOSIGNO}

  # P(−3, 2) horario → (2, 3)
  # A SOLOCAMBIA: intercambia sin cambiar signos
  # B SENTIDO: gira en sentido antihorario
  # C ANGULO: gira 180°
  - code: M1-TRA-165
    node: GEO-TRA-ROT-90
    pool: curated
    difficulty: 3
    source: propio
    figure: FIG-ROT-90-04
    stem: >-
      El triángulo de la figura se rota $90°$ en sentido horario alrededor
      del origen. ¿Dónde queda el vértice $P$?
    options:
      - {label: A, body: "$(2, -3)$", misconception: TRA-ROT90-SOLOCAMBIA}
      - {label: B, body: "$(-2, -3)$", misconception: TRA-ROT90-SENTIDO}
      - {label: C, body: "$(3, -2)$", misconception: TRA-ROT90-ANGULO}
      - {label: D, body: "$(2, 3)$", correct: true}

  # B SOLOSIGNO: cambia el signo de la x, que es 0
  # C ANGULO: gira 180°
  # D SENTIDO: gira en sentido horario
  - code: M1-TRA-166
    node: GEO-TRA-ROT-90
    pool: curated
    difficulty: 3
    source: propio
    stem: >-
      Sea $b$ un número positivo. ¿Cuál es la imagen del punto $(0, b)$ al
      rotarlo $90°$ en sentido antihorario alrededor del origen?
    options:
      - {label: A, body: "$(-b, 0)$", correct: true}
      - {label: B, body: "$(0, b)$: el punto no se mueve.", misconception: TRA-ROT90-SOLOSIGNO}
      - {label: C, body: "$(0, -b)$", misconception: TRA-ROT90-ANGULO}
      - {label: D, body: "$(b, 0)$", misconception: TRA-ROT90-SENTIDO}

  # 270° horario = 90° antihorario: (4, 3) → (−3, 4)
  # A SOLOCAMBIA: intercambia sin cambiar signos
  # B SENTIDO: usa la regla de 90° horario
  # D ANGULO: usa la regla de 180°
  - code: M1-TRA-167
    node: GEO-TRA-ROT-90
    pool: curated
    difficulty: 3
    source: propio
    stem: >-
      El centro de las aspas de un molino está en el origen y la punta de un
      aspa está en $(4, 3)$. El molino gira $270°$ en sentido horario.
      ¿Dónde queda la punta de esa aspa?
    options:
      - {label: A, body: "$(3, 4)$", misconception: TRA-ROT90-SOLOCAMBIA}
      - {label: B, body: "$(3, -4)$", misconception: TRA-ROT90-SENTIDO}
      - {label: C, body: "$(-3, 4)$", correct: true}
      - {label: D, body: "$(-4, -3)$", misconception: TRA-ROT90-ANGULO}

  # A SOLOCAMBIA: rechaza I: le da (−2, 0)
  # C SOLOSIGNO: rechaza I y acepta III
  # D SENTIDO: rechaza I y acepta II
  - code: M1-TRA-168
    node: GEO-TRA-ROT-90
    pool: curated
    difficulty: 3
    source: propio
    stem: |-
