# =====================================================================
# LES-ALG-EXP-01 — Lenguaje algebraico
# Cubre ALG-EXP-LENG
# =====================================================================
# Primera clase del eje ALG. ALG-EXP-LENG es raíz del grafo: no hay
# nodo debajo al que bajar al estudiante, así que las remediaciones se
# sostienen solas y el cuerpo de la clase no asume más que aritmética
# con naturales.
#
# Alcance (cerrado 25 sep 2026):
#   entra   traducir enunciado -> expresión y expresión -> enunciado;
#           vocabulario (doble/cuadrado, triple/cubo, cuádruplo/cuarta
#           potencia, parte, semisuma, exceso, aumentado/disminuido,
#           opuesto, inverso); alcance de cada operación (paréntesis);
#           contexto: edades, dinero, comparaciones entre personas,
#           tasas y períodos; consecutivos, pares e impares; números de
#           dos cifras (valor posicional); patrones construidos desde el
#           enunciado (solo nivel 3, decisión de Ben).
#   fuera   valorizar (ALG-EXP-VAL), reducir términos semejantes y
#           monomios (ALG-EXP-TERM), suprimir paréntesis (ALG-EXP-ADI),
#           planteo de ecuaciones (ALG-ECU-PLAN), porcentajes (NUM-POR),
#           fracciones de una cantidad como 2/5 de x (NUM-FRA), razones
#           (ALG-PRO-RAZ).
#   notación  cuadrado/cubo, opuesto (-x) y par/impar entran como
#           NOTACIÓN aunque NUM-POT-CONC, NUM-ENT-REC y NUM-ENT-DIVIS no
#           son ancestros (decisión de Ben en el control 1: "mejor que
#           conozcan más cosas"). Ningún ítem pide calcular una potencia
#           ni operar con negativos: solo traducir.
#   respuestas  quedan sin reducir (n + (n + 1) + (n + 2), no 3n + 3):
#           reducir es ALG-EXP-TERM.
#
# Niveles:
#   1  una traducción directa, vocabulario, contexto de un paso
#   2  frases compuestas, expresión -> enunciado, contexto de dos pasos
#   3  contexto de varios pasos, tasas, cifras, patrones, I/II/III
#
# Volumen: 45 ítems (15 por nivel) en vez de 24. Con 17 misconceptions
# hacen falta ~102 distractores para que cada una tenga 6 ítems de
# práctica; 24 ítems dan 72 (decisión de Ben: los ítems que hagan falta).
#
# Material de Ben usado: presentación "MAT 11_PJO_Lenguaje Algebraico" y
# guía MA 10 (Planteamientos). Ningún ítem copia uno de la guía.
# ---------------------------------------------------------------------
# Las misconceptions viven en contenido/misconceptions/ALG-EXP.yaml.
# Acá solo se referencian por código.
# ---------------------------------------------------------------------

unit: ALG-EXP

lesson:
  code: LES-ALG-EXP-01
  title: Lenguaje algebraico
  position: 1
  nodes:
    - node: ALG-EXP-LENG
      anchor: lenguaje-algebraico


# ---------------------------------------------------------------------
# ITEMS
# ---------------------------------------------------------------------

items:

  # ===== nivel 1 ======================================================

  # B ADITIVO: triple como «3 más»   C POTMUL: triple como cubo   D PARTEMUL: triple como tercera parte
  - code: M1-EXP-001
    node: ALG-EXP-LENG
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuál expresión representa el triple de un número $x$?"
    options:
      - {label: A, body: "$3x$", correct: true}
      - {label: B, body: "$x + 3$", misconception: EXP-LENG-ADITIVO}
      - {label: C, body: "$x^3$", misconception: EXP-LENG-POTMUL}
      - {label: D, body: "$\\frac{x}{3}$", misconception: EXP-LENG-PARTEMUL}

  # B POTMUL: cuadrado leído como doble   C JUXTA: 5x leído como 5 + x   D PARTEMUL: cuarta parte leída como cuádruplo
  - code: M1-EXP-002
    node: ALG-EXP-LENG
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuál de las siguientes afirmaciones es correcta?"
    options:
      - {label: A, body: "$x^3$ es $x \\cdot x \\cdot x$", correct: true}
      - {label: B, body: "$x^2$ es el doble de $x$", misconception: EXP-LENG-POTMUL}
      - {label: C, body: "$5x$ es $x$ aumentado en $5$", misconception: EXP-LENG-JUXTA}
      - {label: D, body: "$\\frac{x}{4}$ es el cuádruplo de $x$", misconception: EXP-LENG-PARTEMUL}

  # A LINEAL: la mitad alcanza solo a la b   C PARTEMUL: semi (mitad) como doble   D ADITIVO: mitad como «2 menos»
  - code: M1-EXP-003
    node: ALG-EXP-LENG
    pool: curated
    difficulty: 1
    source: propio
    stem: "La semisuma de $a$ y $b$ se escribe:"
    options:
      - {label: A, body: "$a + \\frac{b}{2}$", misconception: EXP-LENG-LINEAL}
      - {label: B, body: "$\\frac{a + b}{2}$", correct: true}
      - {label: C, body: "$2(a + b)$", misconception: EXP-LENG-PARTEMUL}
      - {label: D, body: "$(a + b) - 2$", misconception: EXP-LENG-ADITIVO}

  # A CONSEC: consecutivos como n, 2n, 3n   B NUEVAVAR: una letra por número   D PARCONSEC: paso de 2 en 2, como si fueran pares
  - code: M1-EXP-004
    node: ALG-EXP-LENG
    pool: curated
    difficulty: 1
    source: propio
    stem: "Si $n$ es el menor de tres números naturales consecutivos, ¿cuál expresión representa la suma de los tres?"
    options:
      - {label: A, body: "$n + 2n + 3n$", misconception: EXP-LENG-CONSEC}
      - {label: B, body: "$n + m + p$", misconception: EXP-LENG-NUEVAVAR}
      - {label: C, body: "$n + (n + 1) + (n + 2)$", correct: true}
      - {label: D, body: "$n + (n + 2) + (n + 4)$", misconception: EXP-LENG-PARCONSEC}

  # A OPUINV: opuesto confundido con inverso   C ORDENRESTA: resta en el orden de lectura   D EXCESO: exceso leído como suma
  - code: M1-EXP-005
    node: ALG-EXP-LENG
    pool: curated
    difficulty: 1
    source: propio
    stem: "Si $x \\neq 0$, ¿cuál de las siguientes afirmaciones es correcta?"
    options:
      - {label: A, body: "El opuesto de $x$ es $\\frac{1}{x}$", misconception: EXP-LENG-OPUINV}
      - {label: B, body: "El opuesto de $x$ es $-x$", correct: true}
      - {label: C, body: "$7$ menos que $x$ es $7 - x$", misconception: EXP-LENG-ORDENRESTA}
      - {label: D, body: "El exceso de $x$ sobre $3$ es $x + 3$", misconception: EXP-LENG-EXCESO}

  # A SOBREAGRUPA: el doble abarca también a la x   B POTMUL: doble como cuadrado   D ADITIVO: doble como «2 más»
  - code: M1-EXP-006
    node: ALG-EXP-LENG
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuál expresión representa «$x$ aumentado en el doble de $y$»?"
    options:
      - {label: A, body: "$2(x + y)$", misconception: EXP-LENG-SOBREAGRUPA}
      - {label: B, body: "$x + y^2$", misconception: EXP-LENG-POTMUL}
      - {label: C, body: "$x + 2y$", correct: true}
      - {label: D, body: "$x + y + 2$", misconception: EXP-LENG-ADITIVO}

  # A JUXTA: 4x leído como 4 + x   B POTMUL: 4x leído como x⁴   D PARTEMUL: 4x leído como x/4
  - code: M1-EXP-007
    node: ALG-EXP-LENG
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Qué enunciado corresponde a la expresión $4x + 1$?"
    options:
      - {label: A, body: "Un número aumentado en 4, y luego aumentado en 1", misconception: EXP-LENG-JUXTA}
      - {label: B, body: "La cuarta potencia de un número, aumentada en 1", misconception: EXP-LENG-POTMUL}
      - {label: C, body: "El cuádruplo de un número, aumentado en 1", correct: true}
      - {label: D, body: "La cuarta parte de un número, aumentada en 1", misconception: EXP-LENG-PARTEMUL}

  # A INVREL: el doble se lo asigna a Luis   B ADITIVO: doble como «2 más»   C POTMUL: doble como cuadrado
  - code: M1-EXP-008
    node: ALG-EXP-LENG
    pool: curated
    difficulty: 1
    source: propio
    stem: "Luis tiene $x$ láminas y Marta tiene el doble de láminas que Luis. ¿Cuántas láminas tiene Marta?"
    options:
      - {label: A, body: "$\\frac{x}{2}$", misconception: EXP-LENG-INVREL}
      - {label: B, body: "$x + 2$", misconception: EXP-LENG-ADITIVO}
      - {label: C, body: "$x^2$", misconception: EXP-LENG-POTMUL}
      - {label: D, body: "$2x$", correct: true}

  # A NUEVAVAR: letra nueva para el hermano   C INVREL: el «más» se lo da a Ana   D ADITIVO: «3 más» como «3 veces»
  - code: M1-EXP-009
    node: ALG-EXP-LENG
    pool: curated
    difficulty: 1
    source: propio
    stem: "Ana tiene $a$ años y su hermano tiene 3 años más que ella. ¿Cuál expresión representa la suma de las edades de ambos?"
    options:
      - {label: A, body: "$a + b$", misconception: EXP-LENG-NUEVAVAR}
      - {label: B, body: "$a + (a + 3)$", correct: true}
      - {label: C, body: "$a + (a - 3)$", misconception: EXP-LENG-INVREL}
      - {label: D, body: "$a + 3a$", misconception: EXP-LENG-ADITIVO}

  # B PARCONSEC: paso de 1 entre pares   C CONSEC: siguiente de 2n como 3n (n, 2n, 3n)   D NUEVAVAR: letra nueva para el siguiente par
  - code: M1-EXP-010
    node: ALG-EXP-LENG
    pool: curated
    difficulty: 1
    source: propio
    stem: "Si $2n$ es un número par, ¿cuál es el número par que le sigue?"
    options:
      - {label: A, body: "$2n + 2$", correct: true}
      - {label: B, body: "$2n + 1$", misconception: EXP-LENG-PARCONSEC}
      - {label: C, body: "$3n$", misconception: EXP-LENG-CONSEC}
      - {label: D, body: "$2m$", misconception: EXP-LENG-NUEVAVAR}

  # A TASA: no multiplica por los kilómetros   C ADITIVO: «t por cada kilómetro» como t + k   D SOBREAGRUPA: los k kilómetros abarcan también la subida
  - code: M1-EXP-011
    node: ALG-EXP-LENG
    pool: curated
    difficulty: 1
    source: propio
    stem: "Un taxi cobra $b$ pesos al subir y $t$ pesos por cada kilómetro recorrido. ¿Cuánto cobra por un viaje de $k$ kilómetros?"
    options:
      - {label: A, body: "$b + t$", misconception: EXP-LENG-TASA}
      - {label: B, body: "$b + tk$", correct: true}
      - {label: C, body: "$b + t + k$", misconception: EXP-LENG-ADITIVO}
      - {label: D, body: "$(b + t)k$", misconception: EXP-LENG-SOBREAGRUPA}

  # A LINEAL: el doble alcanza solo a la a   B POTMUL: doble como cuadrado   C PARTEMUL: doble como mitad
  - code: M1-EXP-012
    node: ALG-EXP-LENG
    pool: curated
    difficulty: 1
    source: propio
    stem: "El doble de la suma de $a$ y $b$ se escribe:"
    options:
      - {label: A, body: "$2a + b$", misconception: EXP-LENG-LINEAL}
      - {label: B, body: "$(a + b)^2$", misconception: EXP-LENG-POTMUL}
      - {label: C, body: "$\\frac{a + b}{2}$", misconception: EXP-LENG-PARTEMUL}
      - {label: D, body: "$2(a + b)$", correct: true}

  # A SOBREAGRUPA: el cuadrado abarca la suma   B POTMUL: cuadrado como doble   C LINEAL: el cuadrado alcanza solo a la y
  - code: M1-EXP-013
    node: ALG-EXP-LENG
    pool: curated
    difficulty: 1
    source: propio
    stem: "La suma de los cuadrados de $x$ y de $y$ se escribe:"
    options:
      - {label: A, body: "$(x + y)^2$", misconception: EXP-LENG-SOBREAGRUPA}
      - {label: B, body: "$2x + 2y$", misconception: EXP-LENG-POTMUL}
      - {label: C, body: "$x + y^2$", misconception: EXP-LENG-LINEAL}
      - {label: D, body: "$x^2 + y^2$", correct: true}

  # A PATRDIF: escribe lo que cambia (15) en vez del valor   B PARTEMUL: «15 cada escalón» como dividir   D TASA: no multiplica por el número de escalones
  - code: M1-EXP-014
    node: ALG-EXP-LENG
    pool: curated
    difficulty: 1
    source: propio
    stem: "Cada escalón de una escalera sube 15 cm. ¿A qué altura, en cm, queda el escalón número $n$, medida desde el suelo?"
    options:
      - {label: A, body: "$n + 15$", misconception: EXP-LENG-PATRDIF}
      - {label: B, body: "$\\frac{n}{15}$", misconception: EXP-LENG-PARTEMUL}
      - {label: C, body: "$15n$", correct: true}
      - {label: D, body: "$15$", misconception: EXP-LENG-TASA}

  # A OPUINV: inverso como opuesto   B JUXTA: 7x leído como 7 + x   D TIEMPO: hace como sumar
  - code: M1-EXP-015
    node: ALG-EXP-LENG
    pool: curated
    difficulty: 1
    source: propio
    stem: "Si $x \\neq 0$, ¿cuál de las siguientes afirmaciones es correcta?"
    options:
      - {label: A, body: "El inverso de $x$ es $-x$", misconception: EXP-LENG-OPUINV}
      - {label: B, body: "$7x$ es la suma de $7$ y $x$", misconception: EXP-LENG-JUXTA}
      - {label: C, body: "El doble de $x$, aumentado en 1, es $2x + 1$", correct: true}
      - {label: D, body: "Si hoy tienes $x$ años, hace 2 años tenías $x + 2$", misconception: EXP-LENG-TIEMPO}

  # ===== nivel 2 ======================================================

  # A ORDENRESTA: resta en el orden de lectura   B SOBREAGRUPA: el doble abarca también al 7   C POTMUL: doble como cuadrado
  - code: M1-EXP-016
    node: ALG-EXP-LENG
    pool: curated
    difficulty: 2
    source: propio
    stem: "¿Cuál expresión representa «7 menos que el doble de un número $x$»?"
    options:
      - {label: A, body: "$7 - 2x$", misconception: EXP-LENG-ORDENRESTA}
      - {label: B, body: "$2(x - 7)$", misconception: EXP-LENG-SOBREAGRUPA}
      - {label: C, body: "$x^2 - 7$", misconception: EXP-LENG-POTMUL}
      - {label: D, body: "$2x - 7$", correct: true}

  # A EXCESO: exceso como suma   B SOBREAGRUPA: el triple abarca toda la resta   C PARTEMUL: triple como tercera parte
  - code: M1-EXP-017
    node: ALG-EXP-LENG
    pool: curated
    difficulty: 2
    source: propio
    stem: "El exceso del triple de $a$ sobre $b$ se escribe:"
    options:
      - {label: A, body: "$3a + b$", misconception: EXP-LENG-EXCESO}
      - {label: B, body: "$3(a - b)$", misconception: EXP-LENG-SOBREAGRUPA}
      - {label: C, body: "$\\frac{a}{3} - b$", misconception: EXP-LENG-PARTEMUL}
      - {label: D, body: "$3a - b$", correct: true}

  # A LINEAL: lee 2x² sin el paréntesis   B POTMUL: el cuadrado leído como doble   D JUXTA: 2x leído como 2 + x
  - code: M1-EXP-018
    node: ALG-EXP-LENG
    pool: curated
    difficulty: 2
    source: propio
    stem: "¿Qué enunciado corresponde a la expresión $(2x)^2$?"
    options:
      - {label: A, body: "El doble del cuadrado de un número", misconception: EXP-LENG-LINEAL}
      - {label: B, body: "El doble del doble de un número", misconception: EXP-LENG-POTMUL}
      - {label: C, body: "El cuadrado del doble de un número", correct: true}
      - {label: D, body: "El cuadrado de la suma de 2 y un número", misconception: EXP-LENG-JUXTA}

  # A LINEAL: lee 3x − 5 sin el paréntesis   B JUXTA: 3(…) leído como 3 + (…)   D ORDENRESTA: invierte la resta
  - code: M1-EXP-019
    node: ALG-EXP-LENG
    pool: curated
    difficulty: 2
    source: propio
    stem: "¿Qué enunciado corresponde a la expresión $3(x - 5)$?"
    options:
      - {label: A, body: "El triple de un número, disminuido en 5", misconception: EXP-LENG-LINEAL}
      - {label: B, body: "3 más la diferencia entre un número y 5", misconception: EXP-LENG-JUXTA}
      - {label: C, body: "El triple de la diferencia entre un número y 5", correct: true}
      - {label: D, body: "El triple de la diferencia entre 5 y un número", misconception: EXP-LENG-ORDENRESTA}

  # B OPUINV: opuesto como inverso   C ADITIVO: triple como «3 más»   D POTMUL: triple como cubo
  - code: M1-EXP-020
    node: ALG-EXP-LENG
    pool: curated
    difficulty: 2
    source: propio
    stem: "El opuesto del triple de un número $x$ es:"
    options:
      - {label: A, body: "$-3x$", correct: true}
      - {label: B, body: "$\\frac{1}{3x}$", misconception: EXP-LENG-OPUINV}
      - {label: C, body: "$-(x + 3)$", misconception: EXP-LENG-ADITIVO}
      - {label: D, body: "$-x^3$", misconception: EXP-LENG-POTMUL}

  # B OPUINV: inverso como opuesto   C LINEAL: el inverso alcanza solo a la a   D ADITIVO: doble como «2 más»
  - code: M1-EXP-021
    node: ALG-EXP-LENG
    pool: curated
    difficulty: 2
    source: propio
    stem: "Si $a \\neq 0$, el inverso del doble de $a$ es:"
    options:
      - {label: A, body: "$\\frac{1}{2a}$", correct: true}
      - {label: B, body: "$-2a$", misconception: EXP-LENG-OPUINV}
      - {label: C, body: "$2 \\cdot \\frac{1}{a}$", misconception: EXP-LENG-LINEAL}
      - {label: D, body: "$\\frac{1}{a + 2}$", misconception: EXP-LENG-ADITIVO}

  # A INVREL: le da el triple a Juan   B NUEVAVAR: letra nueva para Juan   D ADITIVO: triple como «3 más»
  - code: M1-EXP-022
    node: ALG-EXP-LENG
    pool: curated
    difficulty: 2
    source: propio
    stem: "Pedro tiene el triple del dinero que tiene Juan. Si Pedro tiene $p$ pesos, ¿cuánto dinero tienen entre los dos?"
    options:
      - {label: A, body: "$p + 3p$", misconception: EXP-LENG-INVREL}
      - {label: B, body: "$p + q$", misconception: EXP-LENG-NUEVAVAR}
      - {label: C, body: "$p + \\frac{p}{3}$", correct: true}
      - {label: D, body: "$p + (p - 3)$", misconception: EXP-LENG-ADITIVO}

  # A TIEMPO: hace como sumar   B LINEAL: el doble alcanza solo a la c   C ORDENRESTA: resta con el 3 primero
  - code: M1-EXP-023
    node: ALG-EXP-LENG
    pool: curated
    difficulty: 2
    source: propio
    stem: "Camila tiene $c$ años. ¿Cuál expresión representa el doble de la edad que tenía hace 3 años?"
    options:
      - {label: A, body: "$2(c + 3)$", misconception: EXP-LENG-TIEMPO}
      - {label: B, body: "$2c - 3$", misconception: EXP-LENG-LINEAL}
      - {label: C, body: "$2(3 - c)$", misconception: EXP-LENG-ORDENRESTA}
      - {label: D, body: "$2(c - 3)$", correct: true}

  # A PARCONSEC: paso de 1: 2n + 1, 2n + 2, 2n + 3   B CONSEC: consecutivos como múltiplos   D NUEVAVAR: letra nueva para cada impar
  - code: M1-EXP-024
    node: ALG-EXP-LENG
    pool: curated
    difficulty: 2
    source: propio
    stem: "Si $2n + 1$ es el menor de tres números impares consecutivos, ¿cuál es el mayor de ellos?"
    options:
      - {label: A, body: "$2n + 3$", misconception: EXP-LENG-PARCONSEC}
      - {label: B, body: "$3(2n + 1)$", misconception: EXP-LENG-CONSEC}
      - {label: C, body: "$2n + 5$", correct: true}
      - {label: D, body: "$2p + 1$", misconception: EXP-LENG-NUEVAVAR}

  # A TASA: no lleva el gasto diario a la semana   B ORDENRESTA: resta al revés   C SOBREAGRUPA: el 7 abarca también lo que gana
  - code: M1-EXP-025
    node: ALG-EXP-LENG
    pool: curated
    difficulty: 2
    source: propio
    stem: "Sofía gana $s$ pesos por semana y gasta $g$ pesos cada día, los 7 días de la semana. ¿Cuánto dinero ahorra en una semana?"
    options:
      - {label: A, body: "$s - g$", misconception: EXP-LENG-TASA}
      - {label: B, body: "$7g - s$", misconception: EXP-LENG-ORDENRESTA}
      - {label: C, body: "$7(s - g)$", misconception: EXP-LENG-SOBREAGRUPA}
      - {label: D, body: "$s - 7g$", correct: true}

  # A DIGITOS: sin valor posicional   B SOBREAGRUPA: el 10 abarca las dos cifras   C ADITIVO: decenas como «10 más»
  - code: M1-EXP-026
    node: ALG-EXP-LENG
    pool: curated
    difficulty: 2
    source: propio
    stem: "Un número de dos cifras tiene $d$ como cifra de las decenas y $u$ como cifra de las unidades. ¿Cuál expresión representa ese número?"
    options:
      - {label: A, body: "$d + u$", misconception: EXP-LENG-DIGITOS}
      - {label: B, body: "$10(d + u)$", misconception: EXP-LENG-SOBREAGRUPA}
      - {label: C, body: "$d + u + 10$", misconception: EXP-LENG-ADITIVO}
      - {label: D, body: "$10d + u$", correct: true}

  # A PATRDIF: escribe lo que cambia por día   B ORDENRESTA: resta al revés   D TASA: no multiplica por los días
  - code: M1-EXP-027
    node: ALG-EXP-LENG
    pool: curated
    difficulty: 2
    source: propio
    stem: "Un bidón tiene 20 litros de agua y cada día se sacan 3 litros. ¿Cuántos litros quedan después de $d$ días?"
    options:
      - {label: A, body: "$d - 3$", misconception: EXP-LENG-PATRDIF}
      - {label: B, body: "$3d - 20$", misconception: EXP-LENG-ORDENRESTA}
      - {label: C, body: "$20 - 3d$", correct: true}
      - {label: D, body: "$20 - 3$", misconception: EXP-LENG-TASA}

  # A OPUINV: opuesto confundido con inverso   C JUXTA: 3x leído como 3 + x   D POTMUL: 3x leído como x³
  - code: M1-EXP-028
    node: ALG-EXP-LENG
    pool: curated
    difficulty: 2
    source: propio
    stem: "¿Qué enunciado corresponde a la expresión $-3x$?"
    options:
