# =====================================================================
# LES-GEO-TRA-02 — Vectores y traslación
# Cubre GEO-PLA-VEC, GEO-PLA-VEC-OP, GEO-TRA-TRAS
# =====================================================================
# Cadena VEC -> VEC-OP -> TRAS. VEC pide GEO-PLA-COORD (LES-GEO-TRA-01);
# VEC-OP pide además NUM-ENT-ADI (LES-NUM-ENT-02).
#
# Alcance (propuesto, sin control 1):
#   VEC    entra   vector como desplazamiento; componentes desde una
#                  figura (escala 1 y 2) y desde dos puntos (B − A);
#                  extremo u origen conocido el vector; vectores iguales
#                  en distintas posiciones; vector opuesto.
#          fuera   módulo de un vector (Pitágoras, GEO-PIT-* y
#                  GEO-REC-DIST); ponderación por un número distinto de 1
#                  y −1 (no hay nodo: decisión para Ben).
#   VEC-OP entra   suma y resta por componentes; suma gráfica (a
#                  continuación y paralelogramo); vector que falta;
#                  desplazamientos sucesivos en contexto (este/oeste,
#                  norte/sur).
#   TRAS   entra   imagen de puntos y figuras según un vector; vector de
#                  una traslación a partir de un punto y su imagen;
#                  preimagen; composición de dos traslaciones; propiedades
#                  (conserva forma, tamaño y orientación).
#          fuera   composición con otras isometrías (GEO-TRA-COMP);
#                  propiedades comparadas entre isometrías (GEO-TRA-PROP).
#
# Niveles:
#   1  leer un vector, calcular B − A, una suma, una imagen
#   2  escala 2, vector que falta, suma gráfica, contexto de dos pasos
#   3  I/II/III, composición, preimagen, afirmaciones generales
# ---------------------------------------------------------------------

unit: GEO-TRA

lesson:
  code: LES-GEO-TRA-02
  title: Vectores y traslación
  position: 2
  nodes:
    - node: GEO-PLA-VEC
      anchor: vectores-y-sus-componentes
    - node: GEO-PLA-VEC-OP
      anchor: suma-y-resta-de-vectores
    - node: GEO-TRA-TRAS
      anchor: traslacion


# ---------------------------------------------------------------------
# ITEMS
# ---------------------------------------------------------------------

items:

  # ===== GEO-PLA-VEC · nivel 1 =================================

  # A SINSIGNO: hacia abajo sin signo
  # C PUNTO: da el punto donde termina
  # D ORIGEN: cuenta de la punta a la cola
  - code: M1-TRA-025
    node: GEO-PLA-VEC
    pool: curated
    difficulty: 1
    source: propio
    figure: FIG-PLA-VEC-01
    stem: "¿Cuáles son las componentes del vector $u$?"
    options:
      - {label: A, body: "$(5, 2)$", misconception: PLA-VEC-SINSIGNO}
      - {label: B, body: "$(5, -2)$", correct: true}
      - {label: C, body: "$(4, 1)$", misconception: PLA-VEC-PUNTO}
      - {label: D, body: "$(-5, 2)$", misconception: PLA-VEC-ORIGEN}

  # A PUNTO: las coordenadas de B
  # B ORIGEN: A − B
  # D SUMA: A + B
  - code: M1-TRA-026
    node: GEO-PLA-VEC
    pool: curated
    difficulty: 1
    source: propio
    stem: >-
      ¿Cuáles son las componentes del vector que va de $A(2, -1)$ a
      $B(5, 3)$?
    options:
      - {label: A, body: "$(5, 3)$", misconception: PLA-VEC-PUNTO}
      - {label: B, body: "$(-3, -4)$", misconception: PLA-VEC-ORIGEN}
      - {label: C, body: "$(3, 4)$", correct: true}
      - {label: D, body: "$(7, 2)$", misconception: PLA-VEC-SUMA}

  # A POSICION: el vector depende del lugar
  # B PUNTO: extremo = componentes
  # C ORIGEN: resta al revés
  - code: M1-TRA-027
    node: GEO-PLA-VEC
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuál de las siguientes afirmaciones es correcta?"
    options:
      - {label: A, body: "Dos vectores son iguales solo si parten del mismo punto.", misconception: PLA-VEC-POSICION}
      - {label: B, body: "Las componentes de un vector son las coordenadas de su extremo.", misconception: PLA-VEC-PUNTO}
      - {label: C, body: "Las componentes del vector de $A$ a $B$ se calculan como $A - B$.", misconception: PLA-VEC-ORIGEN}
      - {label: D, body: "Dos vectores con las mismas componentes son iguales, aunque partan de puntos distintos.", correct: true}

  # B ORDEN: c = (2, −3): lee las componentes al revés
  # C ORIGEN: b = (3, −2): lo cuenta de la punta a la cola
  # D SINSIGNO: d = (3, 2): sin signos
  - code: M1-TRA-028
    node: GEO-PLA-VEC
    pool: curated
    difficulty: 1
    source: propio
    figure: FIG-PLA-VEC-02
    stem: >-
      ¿Cuál de los vectores de la figura tiene componentes $(-3, 2)$?
    options:
      - {label: A, body: "El vector $a$", correct: true}
      - {label: B, body: "El vector $c$", misconception: PLA-COORD-ORDEN}
      - {label: C, body: "El vector $b$", misconception: PLA-VEC-ORIGEN}
      - {label: D, body: "El vector $d$", misconception: PLA-VEC-SINSIGNO}

  # (−2, 3) + (4, −1) = (2, 2)
  # A ORIGEN: resta el vector
  # B PUNTO: cree que termina en sus componentes
  # C ORDEN: suma las componentes cruzadas
  - code: M1-TRA-029
    node: GEO-PLA-VEC
    pool: curated
    difficulty: 1
    source: propio
    stem: >-
      El vector $v = (4, -1)$ se dibuja partiendo del punto $(-2, 3)$. ¿En
      qué punto termina?
    options:
      - {label: A, body: "$(-6, 4)$", misconception: PLA-VEC-ORIGEN}
      - {label: B, body: "$(4, -1)$", misconception: PLA-VEC-PUNTO}
      - {label: C, body: "$(-3, 7)$", misconception: PLA-COORD-ORDEN}
      - {label: D, body: "$(2, 2)$", correct: true}

  # A SINSIGNO: hacia abajo sin signo
  # B ORIGEN: A − B
  # D PUNTO: las coordenadas de B
  - code: M1-TRA-030
    node: GEO-PLA-VEC
    pool: curated
    difficulty: 1
    source: propio
    stem: >-
      ¿Cuáles son las componentes del vector que va de $A(0, 4)$ a
      $B(3, 0)$?
    options:
      - {label: A, body: "$(3, 4)$", misconception: PLA-VEC-SINSIGNO}
      - {label: B, body: "$(-3, 4)$", misconception: PLA-VEC-ORIGEN}
      - {label: C, body: "$(3, -4)$", correct: true}
      - {label: D, body: "$(3, 0)$", misconception: PLA-VEC-PUNTO}

  # (4 − 1, 3 − 1) = (3, 2); (1 − (−2), 2 − 0) = (3, 2)
  # B ORIGEN: el recorrido al revés le parece el mismo
  # C POSICION: el vector depende del lugar
  # D PUNTO: termina en el mismo punto
  - code: M1-TRA-031
    node: GEO-PLA-VEC
    pool: curated
    difficulty: 1
    source: propio
    stem: >-
      ¿Cuál de los siguientes vectores es igual al vector que va de $(1, 1)$
      a $(4, 3)$?
    options:
      - {label: A, body: "El que va de $(-2, 0)$ a $(1, 2)$.", correct: true}
      - {label: B, body: "El que va de $(4, 3)$ a $(1, 1)$.", misconception: PLA-VEC-ORIGEN}
      - {label: C, body: "Ninguno: solo es igual el que parte de $(1, 1)$.", misconception: PLA-VEC-POSICION}
      - {label: D, body: "El que va de $(0, 0)$ a $(4, 3)$.", misconception: PLA-VEC-PUNTO}

  # A ORIGEN: de la punta a la cola
  # C PUNTO: da el punto donde termina
  # D ORDEN: pone el avance horizontal en la segunda componente
  - code: M1-TRA-032
    node: GEO-PLA-VEC
    pool: curated
    difficulty: 1
    source: propio
    figure: FIG-PLA-VEC-05
    stem: "¿Cuáles son las componentes del vector $v$?"
    options:
      - {label: A, body: "$(-5, 0)$", misconception: PLA-VEC-ORIGEN}
      - {label: B, body: "$(5, 0)$", correct: true}
      - {label: C, body: "$(1, 2)$", misconception: PLA-VEC-PUNTO}
      - {label: D, body: "$(0, 5)$", misconception: PLA-COORD-ORDEN}

  # ===== GEO-PLA-VEC · nivel 2 =================================

  # B ESCALA: cuenta cuadrados
  # C ORIGEN: de la punta a la cola
  # D SINSIGNO: hacia abajo sin signo
  - code: M1-TRA-033
    node: GEO-PLA-VEC
    pool: curated
    difficulty: 2
    source: propio
    figure: FIG-PLA-VEC-03
    stem: "¿Cuáles son las componentes del vector $w$?"
    options:
      - {label: A, body: "$(8, -4)$", correct: true}
      - {label: B, body: "$(4, -2)$", misconception: PLA-COORD-ESCALA}
      - {label: C, body: "$(-8, 4)$", misconception: PLA-VEC-ORIGEN}
      - {label: D, body: "$(8, 4)$", misconception: PLA-VEC-SINSIGNO}

  # B = A + v = (3 − 2, −1 + 5) = (1, 4)
  # A ORIGEN: usa A − B = v: B = A − v
  # C ORDEN: suma las componentes cruzadas
  # D PUNTO: cree que B son las componentes
  - code: M1-TRA-034
    node: GEO-PLA-VEC
    pool: curated
    difficulty: 2
    source: propio
    stem: >-
      El vector que va de $A$ a $B$ es $(-2, 5)$. Si $A = (3, -1)$, ¿cuáles
      son las coordenadas de $B$?
    options:
      - {label: A, body: "$(5, -6)$", misconception: PLA-VEC-ORIGEN}
      - {label: B, body: "$(1, 4)$", correct: true}
      - {label: C, body: "$(8, -3)$", misconception: PLA-COORD-ORDEN}
      - {label: D, body: "$(-2, 5)$", misconception: PLA-VEC-PUNTO}

  # A = B − v = (1 − 4, 2 + 3) = (−3, 5)
  # A ORIGEN: usa A − B = v: A = B + v
  # B PUNTO: cree que el punto son las componentes
  # C SINSIGNO: resta (4, 3): el vector sin signo
  - code: M1-TRA-035
    node: GEO-PLA-VEC
    pool: curated
    difficulty: 2
    source: propio
    stem: >-
      El vector que va de $A$ a $B$ es $(4, -3)$. Si $B = (1, 2)$, ¿cuáles
      son las coordenadas de $A$?
    options:
      - {label: A, body: "$(5, -1)$", misconception: PLA-VEC-ORIGEN}
      - {label: B, body: "$(4, -3)$", misconception: PLA-VEC-PUNTO}
      - {label: C, body: "$(-3, -1)$", misconception: PLA-VEC-SINSIGNO}
      - {label: D, body: "$(-3, 5)$", correct: true}

  # A SINSIGNO: b es el opuesto de a: sin sentido le parecen iguales
  # B PUNTO: terminan en el mismo punto
  # D POSICION: el vector depende del lugar
  - code: M1-TRA-036
    node: GEO-PLA-VEC
    pool: curated
    difficulty: 2
    source: propio
    figure: FIG-PLA-VEC-04
    stem: "¿Cuáles de los vectores de la figura son iguales?"
    options:
      - {label: A, body: "$a$ y $b$", misconception: PLA-VEC-SINSIGNO}
      - {label: B, body: "$a$ y $d$", misconception: PLA-VEC-PUNTO}
      - {label: C, body: "$a$ y $c$", correct: true}
      - {label: D, body: "Ninguno, porque parten de puntos distintos.", misconception: PLA-VEC-POSICION}

  # A PUNTO: acepta II
  # C ORIGEN: rechaza I: calcula (−3, 2)
  # D POSICION: acepta III
  - code: M1-TRA-037
    node: GEO-PLA-VEC
    pool: curated
    difficulty: 2
    source: propio
    stem: |-
      Considera las siguientes afirmaciones:

      I. El vector que va de $(1, 2)$ a $(4, 0)$ es $(3, -2)$.

      II. El vector que va de $(2, 3)$ a $(6, 4)$ es $(6, 4)$.

      III. Los vectores que van de $(0, 0)$ a $(2, 1)$ y de $(3, 3)$ a $(5, 4)$ son distintos.

      ¿Cuál o cuáles son correctas?
    options:
      - {label: A, body: "Solo I y II", misconception: PLA-VEC-PUNTO}
      - {label: B, body: "Solo I", correct: true}
      - {label: C, body: "Ninguna de ellas", misconception: PLA-VEC-ORIGEN}
      - {label: D, body: "Solo I y III", misconception: PLA-VEC-POSICION}

  # (4 − (−3), −1 − 2) = (7, −3)
  # A ORIGEN: estación − bodega
  # B SUMA: suma las posiciones
  # D SINSIGNO: hacia abajo sin signo
  - code: M1-TRA-038
    node: GEO-PLA-VEC
    pool: curated
    difficulty: 2
    source: propio
    stem: >-
      Un robot se mueve en línea recta desde la estación $(-3, 2)$ hasta la
      bodega $(4, -1)$. ¿Qué vector describe su desplazamiento?
    options:
      - {label: A, body: "$(-7, 3)$", misconception: PLA-VEC-ORIGEN}
      - {label: B, body: "$(1, 1)$", misconception: PLA-VEC-SUMA}
      - {label: C, body: "$(7, -3)$", correct: true}
      - {label: D, body: "$(7, 3)$", misconception: PLA-VEC-SINSIGNO}

  # (−5 − (−2), 1 − (−3)) = (−3, 4)
  # B SUMA: P + Q
  # C ORIGEN: P − Q
  # D ORDEN: componentes al revés
  - code: M1-TRA-039
    node: GEO-PLA-VEC
    pool: curated
    difficulty: 2
    source: propio
    stem: "¿Cuál es el vector que va de $P(-2, -3)$ a $Q(-5, 1)$?"
    options:
      - {label: A, body: "$(-3, 4)$", correct: true}
      - {label: B, body: "$(-7, -2)$", misconception: PLA-VEC-SUMA}
      - {label: C, body: "$(3, -4)$", misconception: PLA-VEC-ORIGEN}
      - {label: D, body: "$(4, -3)$", misconception: PLA-COORD-ORDEN}

  # a = 4 − 1 = 3; b = 2 − 2 = 0
  # A ORIGEN: inicio − final
  # B ORDEN: componentes al revés
  # C PUNTO: el punto de llegada
  - code: M1-TRA-040
    node: GEO-PLA-VEC
    pool: curated
    difficulty: 2
    source: propio
    stem: >-
      El vector $v = (a, b)$ va de $(1, 2)$ a $(4, 2)$. ¿Qué se puede
      afirmar?
    options:
      - {label: A, body: "$a = -3$ y $b = 0$", misconception: PLA-VEC-ORIGEN}
      - {label: B, body: "$a = 0$ y $b = 3$", misconception: PLA-COORD-ORDEN}
      - {label: C, body: "$a = 4$ y $b = 2$", misconception: PLA-VEC-PUNTO}
      - {label: D, body: "$a = 3$ y $b = 0$", correct: true}

  # ===== GEO-PLA-VEC · nivel 3 =================================

  # A SINSIGNO: rechaza I: el de ida y el de vuelta le parecen iguales
  # B POSICION: rechaza II
  # C PUNTO: acepta III
  - code: M1-TRA-041
    node: GEO-PLA-VEC
    pool: curated
    difficulty: 3
    source: propio
    stem: |-
      Considera las siguientes afirmaciones:

      I. El vector que va de $A$ a $B$ es el opuesto del que va de $B$ a $A$.

      II. Las componentes de un vector no dependen del punto donde se dibuja.

      III. Las componentes del vector que va de $A$ a $B$ son las coordenadas de $B$.

      ¿Cuál o cuáles son correctas?
    options:
      - {label: A, body: "Solo II", misconception: PLA-VEC-SINSIGNO}
      - {label: B, body: "Solo I", misconception: PLA-VEC-POSICION}
      - {label: C, body: "I, II y III", misconception: PLA-VEC-PUNTO}
      - {label: D, body: "Solo I y II", correct: true}

  # AB = (4, 3); D = C + (4, 3) = (4, 1)
  # A PUNTO: toma AB = B, y entonces D = B
  # C POSICION: el vector depende del lugar
  # D ORDEN: suma a C el vector con las componentes al revés, (3, 4)
  - code: M1-TRA-042
    node: GEO-PLA-VEC
    pool: curated
    difficulty: 3
    source: propio
    stem: >-
      Los puntos $A(-1, 2)$, $B(3, 5)$ y $C(0, -2)$ son vértices de un
      paralelogramo $ABDC$, de modo que el vector de $A$ a $B$ es igual al
      vector de $C$ a $D$. ¿Cuáles son las coordenadas de $D$?
    options:
      - {label: A, body: "$(3, 5)$", misconception: PLA-VEC-PUNTO}
      - {label: B, body: "$(4, 1)$", correct: true}
      - {label: C, body: "No existe, porque dos vectores que parten de puntos distintos no pueden ser iguales.", misconception: PLA-VEC-POSICION}
      - {label: D, body: "$(3, 2)$", misconception: PLA-COORD-ORDEN}

  # origen = extremo − v = (−1 + 6, −4 − 2) = (5, −6)
  # A SINSIGNO: resta (6, 2): el vector sin signo
  # B PUNTO: toma las componentes como punto
  # D ORIGEN: suma el vector al extremo
  - code: M1-TRA-043
    node: GEO-PLA-VEC
    pool: curated
    difficulty: 3
    source: propio
    stem: >-
      Un vector tiene componentes $(-6, 2)$ y su extremo está en el punto
      $(-1, -4)$. ¿Dónde está su origen?
    options:
      - {label: A, body: "$(-7, -6)$", misconception: PLA-VEC-SINSIGNO}
      - {label: B, body: "$(-6, 2)$", misconception: PLA-VEC-PUNTO}
      - {label: C, body: "$(5, -6)$", correct: true}
      - {label: D, body: "$(-7, -2)$", misconception: PLA-VEC-ORIGEN}

  # B CONTEO: cuenta líneas de la cuadrícula
  # C ORDEN: componentes al revés
  # D ORIGEN: inicio − final
  - code: M1-TRA-044
    node: GEO-PLA-VEC
    pool: curated
    difficulty: 3
    source: propio
    stem: >-
      En un patio cuadriculado en metros, una grúa mueve un contenedor desde
      el punto $(2, 7)$ hasta el punto $(-4, 7)$. ¿Qué vector representa el
      movimiento y cuántos metros se desplazó el contenedor?
    options:
      - {label: A, body: "$(-6, 0)$; se desplazó $6$ metros.", correct: true}
      - {label: B, body: "$(-6, 0)$; se desplazó $7$ metros.", misconception: PLA-COORD-CONTEO}
      - {label: C, body: "$(0, -6)$; se desplazó $6$ metros.", misconception: PLA-COORD-ORDEN}
      - {label: D, body: "$(6, 0)$; se desplazó $6$ metros.", misconception: PLA-VEC-ORIGEN}

  # B POSICION: el vector depende del lugar
  # C PUNTO: da los puntos de llegada
  # D ORIGEN: ve que son iguales, pero cuenta de la punta a la cola
  - code: M1-TRA-045
    node: GEO-PLA-VEC
    pool: curated
    difficulty: 3
    source: propio
    figure: FIG-PLA-VEC-06
    stem: >-
      ¿Cuál afirmación sobre los vectores $u$ y $v$ de la figura es
      correcta?
    options:
      - {label: A, body: "$u = v = (3, 2)$", correct: true}
      - {label: B, body: "$u$ y $v$ son distintos, porque parten de puntos distintos.", misconception: PLA-VEC-POSICION}
      - {label: C, body: "$u = (0, 1)$ y $v = (4, 4)$, así que son distintos.", misconception: PLA-VEC-PUNTO}
      - {label: D, body: "$u = v = (-3, -2)$", misconception: PLA-VEC-ORIGEN}

  # A ORIGEN: inicio − final
  # B SUMA: suma los puntos
  # C PUNTO: da el punto de llegada
  - code: M1-TRA-046
    node: GEO-PLA-VEC
    pool: curated
    difficulty: 3
    source: propio
    stem: >-
      Un dron está en el punto $(-2, -5)$ y debe llegar al punto $(3, 1)$.
      ¿Cuál es el vector de su desplazamiento y hacia dónde se mueve?
    options:
      - {label: A, body: "$(-5, -6)$; hacia la izquierda y hacia abajo.", misconception: PLA-VEC-ORIGEN}
      - {label: B, body: "$(1, -4)$; hacia la derecha y hacia abajo.", misconception: PLA-VEC-SUMA}
      - {label: C, body: "$(3, 1)$; hacia la derecha y hacia arriba.", misconception: PLA-VEC-PUNTO}
      - {label: D, body: "$(5, 6)$; hacia la derecha y hacia arriba.", correct: true}

  # A SUMA: acepta III: suma los puntos
  # C ORIGEN: acepta II: inicio − final
  # D SINSIGNO: rechaza I (le parecen iguales) y acepta II (sin signos)
  - code: M1-TRA-047
    node: GEO-PLA-VEC
    pool: curated
    difficulty: 3
    source: propio
    stem: |-
      Considera las siguientes afirmaciones:

      I. $(3, -2)$ y $(-3, 2)$ son vectores opuestos.

      II. El vector que va de $(5, 5)$ a $(2, 1)$ es $(3, 4)$.

      III. El vector que va de $(1, 1)$ a $(3, 4)$ es $(4, 5)$.

      ¿Cuál o cuáles son correctas?
    options:
      - {label: A, body: "Solo I y III", misconception: PLA-VEC-SUMA}
      - {label: B, body: "Solo I", correct: true}
      - {label: C, body: "Solo I y II", misconception: PLA-VEC-ORIGEN}
      - {label: D, body: "Solo II", misconception: PLA-VEC-SINSIGNO}

  # (3, −2) + (3, −2) = (6, −4); (−5, 2) + (6, −4) = (1, −2)
  # A ORIGEN: resta el desplazamiento al punto de partida
  # B PUNTO: cree que termina en las componentes del desplazamiento
  # D SINSIGNO: suma (6, 4): el vector sin signo
  - code: M1-TRA-048
    node: GEO-PLA-VEC
    pool: curated
    difficulty: 3
    source: propio
    stem: >-
      Una lancha parte del muelle $A(-5, 2)$. Su desplazamiento es el doble
      del vector $(3, -2)$, es decir, $(3, -2) + (3, -2)$. ¿En qué punto
      termina?
    options:
      - {label: A, body: "$(-11, 6)$", misconception: PLA-VEC-ORIGEN}
      - {label: B, body: "$(6, -4)$", misconception: PLA-VEC-PUNTO}
      - {label: C, body: "$(1, -2)$", correct: true}
      - {label: D, body: "$(1, 6)$", misconception: PLA-VEC-SINSIGNO}

  # ===== GEO-PLA-VEC-OP · nivel 1 ==============================

  # A MAGNOP: suma tamaños con el signo del negativo
  # C RESTAORDEN: resta al revés
  # D REGLAMUL: −2 + (−4): menos con menos da más
  - code: M1-TRA-049
    node: GEO-PLA-VEC-OP
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuál de las siguientes igualdades es correcta?"
    options:
      - {label: A, body: "$(-1, 6) + (4, -2) = (-5, -8)$", misconception: ENT-ADI-MAGNOP}
      - {label: B, body: "$(3, -2) + (-5, 4) = (-2, 2)$", correct: true}
      - {label: C, body: "$(5, 1) - (2, 3) = (-3, 2)$", misconception: PLA-VECOP-RESTAORDEN}
      - {label: D, body: "$(-2, -3) + (-4, 1) = (6, -2)$", misconception: ENT-ADI-REGLAMUL}

  # B SINSENTIDO: suma los tamaños sin el signo del −1
  # C ORIGEN: lee cada flecha de la punta a la cola
  # D PUNTAS: calcula v − u
  - code: M1-TRA-050
    node: GEO-PLA-VEC-OP
    pool: curated
    difficulty: 1
    source: propio
