# =====================================================================
# LES-NUM-ENT-05 — Divisibilidad, mcm y MCD
# Cubre NUM-ENT-DIVIS, NUM-ENT-MCM
# =====================================================================
# Dos nodos `pre` con arista directa DIVIS -> MCM (decisión 1 del plan,
# cerrada). DIVIS pide NUM-ENT-MUL (LES-NUM-ENT-03). La clase 06 queda
# sin usar.
#
# Alcance (propuesto, sin control 1):
#   DIVIS entra  múltiplos y divisores de un natural (listar, contar,
#                reconocer); "a es divisor de b" <-> "b es múltiplo de
#                a"; criterios de divisibilidad por 2, 3, 4, 5, 6, 9 y
#                10; primos y compuestos (el 1 no es ninguno, el 2 es el
#                único primo par); descomposición en factores primos
#                escrita como producto (2 · 2 · 3 · 5); contexto de
#                repartos y grupos iguales.
#         fuera  potencias en la descomposición (2² · 3): NUM-POT-CONC no
#                es ancestro, se escribe el producto repetido; mcm y MCD
#                (MCM); simplificar fracciones (NUM-FRA-SIMP); raíces
#                (NUM-RAI-DESC); divisores negativos.
#   MCM   entra  mcm y MCD de dos o tres números, por listado y por
#                descomposición; problemas de "cuándo coinciden" (mcm) y
#                de "el grupo más grande posible" (MCD); números primos
#                entre sí; mcm · MCD = a · b como afirmación.
#         fuera  suma de fracciones con mcm (NUM-FRA-ADI).
#
# Niveles:
#   1  una idea: reconocer, listar, un criterio, un cálculo directo
#   2  descomposición, contar divisores, contexto de un paso, I/II/III
#   3  contexto que exige decidir mcm o MCD, tres números, afirmaciones
#      generales
# ---------------------------------------------------------------------

unit: NUM-ENT

lesson:
  code: LES-NUM-ENT-05
  title: Divisibilidad, mcm y MCD
  position: 5
  nodes:
    - node: NUM-ENT-DIVIS
      anchor: multiplos-divisores-y-numeros-primos
    - node: NUM-ENT-MCM
      anchor: minimo-comun-multiplo-y-maximo-comun-divisor


# ---------------------------------------------------------------------
# ITEMS
# ---------------------------------------------------------------------

items:

  # ===== NUM-ENT-DIVIS · nivel 1 ===============================

  # B EXTREMOS: omite el 1 y el 18
  # C INVIERTE: lista múltiplos
  # D SOLOPRIMOS: se queda con los primos
  - code: M1-ENT-097
    node: NUM-ENT-DIVIS
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuáles son todos los divisores de $18$?"
    options:
      - {label: A, body: "$1, 2, 3, 6, 9, 18$", correct: true}
      - {label: B, body: "$2, 3, 6, 9$", misconception: ENT-DIVIS-EXTREMOS}
      - {label: C, body: "$18, 36, 54, 72$", misconception: ENT-DIVIS-INVIERTE}
      - {label: D, body: "$2, 3$", misconception: ENT-DIVIS-SOLOPRIMOS}

  # A INVIERTE: invierte la relación
  # B IMPARPRIMO: impar = primo
  # D UNO: el 1 es primo
  - code: M1-ENT-098
    node: NUM-ENT-DIVIS
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuál de las siguientes afirmaciones es verdadera?"
    options:
      - {label: A, body: "$56$ es divisor de $8$.", misconception: ENT-DIVIS-INVIERTE}
      - {label: B, body: "$21$ es un número primo.", misconception: ENT-DIVIS-IMPARPRIMO}
      - {label: C, body: "$8$ es divisor de $56$.", correct: true}
      - {label: D, body: "$1$ es un número primo.", misconception: ENT-DIVIS-UNO}

  # 4 + 7 + 7 = 18
  # A INVIERTE: confunde "divisible por 9" con "divisor de 9"
  # B ULTCIFRA: termina en 9
  # C CRITERIO: 5 + 7 = 12, múltiplo de 3: cree que basta
  - code: M1-ENT-099
    node: NUM-ENT-DIVIS
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuál de los siguientes números es divisible por $9$?"
    options:
      - {label: A, body: "$3$", misconception: ENT-DIVIS-INVIERTE}
      - {label: B, body: "$139$", misconception: ENT-DIVIS-ULTCIFRA}
      - {label: C, body: "$57$", misconception: ENT-DIVIS-CRITERIO}
      - {label: D, body: "$477$", correct: true}

  # A UNO: incluye el 1 como factor primo
  # C SOLOPRIMOS: escribe cada primo que divide una sola vez
  # D COMPUESTO: se queda en factores compuestos
  - code: M1-ENT-100
    node: NUM-ENT-DIVIS
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuál es la descomposición en factores primos de $60$?"
    options:
      - {label: A, body: "$1 \\cdot 2 \\cdot 2 \\cdot 3 \\cdot 5$", misconception: ENT-DIVIS-UNO}
      - {label: B, body: "$2 \\cdot 2 \\cdot 3 \\cdot 5$", correct: true}
      - {label: C, body: "$2 \\cdot 3 \\cdot 5$", misconception: ENT-DIVIS-SOLOPRIMOS}
      - {label: D, body: "$4 \\cdot 15$", misconception: ENT-DIVIS-COMPUESTO}

  # 1, 2, 4, 5, 10, 20
  # B EXTREMOS: omite el 1 y el 20
  # C SOLOPRIMOS: cuenta solo el 2 y el 5
  # D INVIERTE: confunde divisores con múltiplos
  - code: M1-ENT-101
    node: NUM-ENT-DIVIS
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuántos divisores tiene el número $20$?"
    options:
      - {label: A, body: "$6$", correct: true}
      - {label: B, body: "$4$", misconception: ENT-DIVIS-EXTREMOS}
      - {label: C, body: "$2$", misconception: ENT-DIVIS-SOLOPRIMOS}
      - {label: D, body: "Infinitos", misconception: ENT-DIVIS-INVIERTE}

  # 1 + 3 + 5 = 9
  # A INVIERTE: invierte quién divide a quién
  # B ULTCIFRA: termina en 3
  # C CRITERIO: 4 + 2 = 6, múltiplo de 3: cree que basta
  - code: M1-ENT-102
    node: NUM-ENT-DIVIS
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuál de las siguientes afirmaciones es verdadera?"
    options:
      - {label: A, body: "$9$ es divisible por $135$.", misconception: ENT-DIVIS-INVIERTE}
      - {label: B, body: "$53$ es divisible por $3$.", misconception: ENT-DIVIS-ULTCIFRA}
      - {label: C, body: "$42$ es divisible por $9$.", misconception: ENT-DIVIS-CRITERIO}
      - {label: D, body: "$135$ es divisible por $9$.", correct: true}

  # 51 = 3 · 17
  # A IMPARPRIMO: par = compuesto; y 51, impar, lo cree primo
  # C ULTCIFRA: termina en 3: lo cree divisible por 3; a 51 lo cree primo
  # D UNO: ubica el 1 entre primos o compuestos
  - code: M1-ENT-103
    node: NUM-ENT-DIVIS
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuál de los siguientes números es compuesto?"
    options:
      - {label: A, body: "$2$", misconception: ENT-DIVIS-IMPARPRIMO}
      - {label: B, body: "$51$", correct: true}
      - {label: C, body: "$53$", misconception: ENT-DIVIS-ULTCIFRA}
      - {label: D, body: "$1$", misconception: ENT-DIVIS-UNO}

  # A INVIERTE: lista divisores
  # B ULTCIFRA: los que terminan en 8
  # D EXTREMOS: cree que 8 no es múltiplo de sí mismo
  - code: M1-ENT-104
    node: NUM-ENT-DIVIS
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuáles son los múltiplos de $8$ menores que $40$?"
    options:
      - {label: A, body: "$1, 2, 4, 8$", misconception: ENT-DIVIS-INVIERTE}
      - {label: B, body: "$8, 18, 28, 38$", misconception: ENT-DIVIS-ULTCIFRA}
      - {label: C, body: "$8, 16, 24, 32$", correct: true}
      - {label: D, body: "$16, 24, 32$", misconception: ENT-DIVIS-EXTREMOS}

  # ===== NUM-ENT-DIVIS · nivel 2 ===============================

  # divisores de 24: 1, 2, 3, 4, 6, 8, 12, 24
  # B SOLOPRIMOS: solo grupos de 2 o de 3
  # C EXTREMOS: descarta grupos de 1 y un solo grupo de 24
  # D INVIERTE: piensa en múltiplos de 24
  - code: M1-ENT-105
    node: NUM-ENT-DIVIS
    pool: curated
    difficulty: 2
    source: propio
    stem: >-
      Una profesora quiere repartir a sus $24$ estudiantes en grupos que
      tengan todos la misma cantidad de integrantes, sin que sobre nadie.
      ¿Cuántas cantidades distintas de integrantes por grupo puede elegir?
    options:
      - {label: A, body: "$8$", correct: true}
      - {label: B, body: "$2$", misconception: ENT-DIVIS-SOLOPRIMOS}
      - {label: C, body: "$6$", misconception: ENT-DIVIS-EXTREMOS}
      - {label: D, body: "Infinitas", misconception: ENT-DIVIS-INVIERTE}

  # A IMPARPRIMO: rechaza I (el 2 es par) y acepta II (el 1 es impar)
  # C CRITERIO: acepta III
  # D UNO: acepta II
  - code: M1-ENT-106
    node: NUM-ENT-DIVIS
    pool: curated
    difficulty: 2
    source: propio
    stem: |-
      Considera las siguientes afirmaciones:

      I. El $2$ es el único número primo par.

      II. El $1$ es un número primo.

      III. Todo número divisible por $3$ es divisible por $9$.

      ¿Cuál o cuáles son verdaderas?
    options:
      - {label: A, body: "Solo II", misconception: ENT-DIVIS-IMPARPRIMO}
      - {label: B, body: "Solo I", correct: true}
      - {label: C, body: "Solo I y III", misconception: ENT-DIVIS-CRITERIO}
      - {label: D, body: "Solo I y II", misconception: ENT-DIVIS-UNO}

  # A EXTREMOS: cree que un número no es divisor de sí mismo
  # B INVIERTE: invierte la relación
  # C SOLOPRIMOS: cree que los divisores son primos
  - code: M1-ENT-107
    node: NUM-ENT-DIVIS
    pool: curated
    difficulty: 2
    source: propio
    stem: >-
      Sean $a$ y $b$ números naturales tales que $a$ es divisor de $b$.
      ¿Cuál de las siguientes afirmaciones es **siempre** verdadera?
    options:
      - {label: A, body: "$a$ es distinto de $b$.", misconception: ENT-DIVIS-EXTREMOS}
      - {label: B, body: "$a$ es múltiplo de $b$.", misconception: ENT-DIVIS-INVIERTE}
      - {label: C, body: "$a$ es un número primo.", misconception: ENT-DIVIS-SOLOPRIMOS}
      - {label: D, body: "$b$ es múltiplo de $a$.", correct: true}

  # n = 90; divisores: 1, 2, 3, 5, 6, 9, 10, 15, 18, 30, 45, 90. El 4 no.
  # A SOLOPRIMOS: 6 no es primo: cree que no divide
  # B EXTREMOS: el número no es divisor de sí mismo
  # D ULTCIFRA: 90 no termina en 9
  - code: M1-ENT-108
    node: NUM-ENT-DIVIS
    pool: curated
    difficulty: 2
    source: propio
    stem: >-
      La descomposición en factores primos de un número es
      $2 \cdot 3 \cdot 3 \cdot 5$. ¿Cuál de los siguientes números **no** es
      divisor de ese número?
    options:
      - {label: A, body: "$6$", misconception: ENT-DIVIS-SOLOPRIMOS}
      - {label: B, body: "$90$", misconception: ENT-DIVIS-EXTREMOS}
      - {label: C, body: "$4$", correct: true}
      - {label: D, body: "$9$", misconception: ENT-DIVIS-ULTCIFRA}

  # A CRITERIO: par basta para 4
  # B UNO: el 1 es primo
  # C IMPARPRIMO: impar = primo
  - code: M1-ENT-109
    node: NUM-ENT-DIVIS
    pool: curated
    difficulty: 2
    source: propio
    stem: "¿Cuál de las siguientes afirmaciones es verdadera?"
    options:
      - {label: A, body: "Todo número par es divisible por $4$.", misconception: ENT-DIVIS-CRITERIO}
      - {label: B, body: "El $1$ es el menor número primo.", misconception: ENT-DIVIS-UNO}
      - {label: C, body: "Todo número impar es primo.", misconception: ENT-DIVIS-IMPARPRIMO}
      - {label: D, body: "Todo número par mayor que $2$ es compuesto.", correct: true}

  # 126 = 2 · 3 · 3 · 7
  # A COMPUESTO: copia los divisores de Javiera, con el 9
  # B UNO: agrega el 1 del final como factor
  # D SOLOPRIMOS: escribe cada primo una sola vez
  - code: M1-ENT-110
    node: NUM-ENT-DIVIS
    pool: curated
    difficulty: 2
    source: propio
    stem: >-
      Javiera dividió $126$ así: $126 \div 2 = 63$, $63 \div 9 = 7$ y
      $7 \div 7 = 1$. ¿Cuál es la descomposición de $126$ en factores
      primos?
    options:
      - {label: A, body: "$2 \\cdot 9 \\cdot 7$", misconception: ENT-DIVIS-COMPUESTO}
      - {label: B, body: "$1 \\cdot 2 \\cdot 3 \\cdot 3 \\cdot 7$", misconception: ENT-DIVIS-UNO}
      - {label: C, body: "$2 \\cdot 3 \\cdot 3 \\cdot 7$", correct: true}
      - {label: D, body: "$2 \\cdot 3 \\cdot 7$", misconception: ENT-DIVIS-SOLOPRIMOS}

  # 114: par y 1 + 1 + 4 = 6
  # A INVIERTE: un divisor de 6
  # C CRITERIO: 8 + 1 = 9, divisible por 3: cree que basta (no mira que sea par)
  # D ULTCIFRA: par y termina en 6: lo cree divisible por 3 (7 + 6 = 13)
  - code: M1-ENT-111
    node: NUM-ENT-DIVIS
    pool: curated
    difficulty: 2
    source: propio
    stem: "¿Cuál de los siguientes números es divisible por $6$?"
    options:
      - {label: A, body: "$3$", misconception: ENT-DIVIS-INVIERTE}
      - {label: B, body: "$114$", correct: true}
      - {label: C, body: "$81$", misconception: ENT-DIVIS-CRITERIO}
      - {label: D, body: "$76$", misconception: ENT-DIVIS-ULTCIFRA}

  # 7, 14, 21, 28, 35, 42, 49
  # B EXTREMOS: no cuenta el 7 como múltiplo de sí mismo
  # C INVIERTE: cuenta los divisores de 7
  # D ULTCIFRA: cuenta los que terminan en 7: 7, 17, 27, 37, 47
  - code: M1-ENT-112
    node: NUM-ENT-DIVIS
    pool: curated
    difficulty: 2
    source: propio
    stem: "¿Cuántos múltiplos de $7$ hay entre $1$ y $50$?"
    options:
      - {label: A, body: "$7$", correct: true}
      - {label: B, body: "$6$", misconception: ENT-DIVIS-EXTREMOS}
      - {label: C, body: "$2$", misconception: ENT-DIVIS-INVIERTE}
      - {label: D, body: "$5$", misconception: ENT-DIVIS-ULTCIFRA}

  # ===== NUM-ENT-DIVIS · nivel 3 ===============================

  # 84: 1, 2, 3, 4, 6, 7, 12, 14, 21, 28, 42, 84
  # A SOLOPRIMOS: cuenta los primos distintos: 2, 3 y 7
  # B EXTREMOS: omite el 1 y el 84
  # C INVIERTE: confunde divisores con múltiplos
  - code: M1-ENT-113
    node: NUM-ENT-DIVIS
    pool: curated
    difficulty: 3
    source: propio
    stem: >-
      La descomposición en factores primos de un número $n$ es
      $2 \cdot 2 \cdot 3 \cdot 7$. ¿Cuántos divisores tiene $n$?
    options:
      - {label: A, body: "$3$", misconception: ENT-DIVIS-SOLOPRIMOS}
      - {label: B, body: "$10$", misconception: ENT-DIVIS-EXTREMOS}
      - {label: C, body: "Infinitos", misconception: ENT-DIVIS-INVIERTE}
      - {label: D, body: "$12$", correct: true}

  # 87 = 3 · 29; 83 primo; 1 no es primo
  # A ULTCIFRA: 83 termina en 3: lo cree divisible por 3; a 87 no lo divide por 3 porque termina en 7
  # C IMPARPRIMO: son impares
  # D UNO: el 1 es primo
  - code: M1-ENT-114
    node: NUM-ENT-DIVIS
    pool: curated
    difficulty: 3
    source: propio
    stem: >-
      Considera los números $1$, $83$ y $87$. ¿Cuál de las siguientes
      afirmaciones es verdadera?
    options:
      - {label: A, body: "Solo $87$ es primo.", misconception: ENT-DIVIS-ULTCIFRA}
      - {label: B, body: "Solo $83$ es primo.", correct: true}
      - {label: C, body: "Los tres son primos.", misconception: ENT-DIVIS-IMPARPRIMO}
      - {label: D, body: "Solo $1$ y $83$ son primos.", misconception: ENT-DIVIS-UNO}

  # A IMPARPRIMO: primo = impar (olvida el 2)
  # B SOLOPRIMOS: cree que los divisores son primos (el 1 no lo es)
  # D UNO: el 1 es primo, "tiene dos divisores"
  - code: M1-ENT-115
    node: NUM-ENT-DIVIS
    pool: curated
    difficulty: 3
    source: propio
    stem: >-
      Sea $n$ un número natural que tiene exactamente dos divisores. ¿Cuál
      de las siguientes afirmaciones es verdadera?
    options:
      - {label: A, body: "$n$ es un número impar.", misconception: ENT-DIVIS-IMPARPRIMO}
      - {label: B, body: "Los dos divisores de $n$ son números primos.", misconception: ENT-DIVIS-SOLOPRIMOS}
      - {label: C, body: "$n$ es un número primo.", correct: true}
      - {label: D, body: "$n$ puede ser $1$.", misconception: ENT-DIVIS-UNO}

  # B IMPARPRIMO: todo impar es primo
  # C SOLOPRIMOS: cree que los divisores son primos (con p = 3, el 4 divide a 4)
  # D EXTREMOS: descarta el 1 y el propio p
  - code: M1-ENT-116
    node: NUM-ENT-DIVIS
    pool: curated
    difficulty: 3
    source: propio
    stem: >-
      Sea $p$ un número primo mayor que $2$. ¿Cuál de las siguientes
      afirmaciones es **siempre** verdadera?
    options:
      - {label: A, body: "$p + 1$ es par.", correct: true}
      - {label: B, body: "$p + 2$ es primo.", misconception: ENT-DIVIS-IMPARPRIMO}
      - {label: C, body: "Todos los divisores de $p + 1$ son primos.", misconception: ENT-DIVIS-SOLOPRIMOS}
      - {label: D, body: "$p$ no tiene divisores.", misconception: ENT-DIVIS-EXTREMOS}

  # 2+0+2+5 = 9; 2+0+1+3 = 6; 2.025 = 3·3·3·3·5·5
  # A COMPUESTO: acepta III
  # C ULTCIFRA: rechaza I: 2.025 no termina en 9
  # D CRITERIO: acepta II: la suma 6 es múltiplo de 3
  - code: M1-ENT-117
    node: NUM-ENT-DIVIS
    pool: curated
    difficulty: 3
    source: propio
    stem: |-
      Considera las siguientes afirmaciones:

      I. $2.025$ es divisible por $9$.

      II. $2.013$ es divisible por $9$.

      III. La descomposición en factores primos de $2.025$ es $81 \cdot 25$.

      ¿Cuál o cuáles son verdaderas?
    options:
      - {label: A, body: "Solo I y III", misconception: ENT-DIVIS-COMPUESTO}
      - {label: B, body: "Solo I", correct: true}
      - {label: C, body: "Ninguna de ellas", misconception: ENT-DIVIS-ULTCIFRA}
      - {label: D, body: "Solo I y II", misconception: ENT-DIVIS-CRITERIO}

  # 210 = 2 · 3 · 5 · 7; 210 ÷ 35 = 6
  # A SOLOPRIMOS: los divisores son los primos
  # B COMPUESTO: acepta factores compuestos
  # D CRITERIO: tiene un 3: cree que basta para 9
  - code: M1-ENT-118
    node: NUM-ENT-DIVIS
    pool: curated
    difficulty: 3
    source: propio
    stem: >-
      La descomposición en factores primos de un número es
      $2 \cdot 3 \cdot 5 \cdot 7$. ¿Cuál de las siguientes afirmaciones es
      verdadera?
    options:
      - {label: A, body: "Sus únicos divisores son $2$, $3$, $5$ y $7$.", misconception: ENT-DIVIS-SOLOPRIMOS}
      - {label: B, body: "Su descomposición en factores primos también puede escribirse como $6 \\cdot 35$.", misconception: ENT-DIVIS-COMPUESTO}
      - {label: C, body: "El número es divisible por $35$.", correct: true}
      - {label: D, body: "El número es divisible por $9$.", misconception: ENT-DIVIS-CRITERIO}

  # 72: par y 7 + 2 = 9
  # B INVIERTE: un divisor de 18
  # C ULTCIFRA: termina en 8, como el 18
  # D CRITERIO: par y divisible por 3: cree que basta para 18
  - code: M1-ENT-119
    node: NUM-ENT-DIVIS
    pool: curated
    difficulty: 3
    source: propio
    stem: "¿Cuál de los siguientes números es divisible por $18$?"
    options:
      - {label: A, body: "$72$", correct: true}
      - {label: B, body: "$9$", misconception: ENT-DIVIS-INVIERTE}
      - {label: C, body: "$98$", misconception: ENT-DIVIS-ULTCIFRA}
      - {label: D, body: "$78$", misconception: ENT-DIVIS-CRITERIO}

  # A ULTCIFRA: 15 termina en 5: lo relaciona con 25 (distractor débil)
  # B CRITERIO: 15 es divisible por 3: cree que también por 9
  # C INVIERTE: un múltiplo de 15
  - code: M1-ENT-120
    node: NUM-ENT-DIVIS
    pool: curated
    difficulty: 3
    source: propio
    stem: >-
      Se sabe que $15$ es divisor de un número natural $n$. ¿Cuál de los
      siguientes números es **con seguridad** divisor de $n$?
    options:
      - {label: A, body: "$25$", misconception: ENT-DIVIS-ULTCIFRA}
      - {label: B, body: "$9$", misconception: ENT-DIVIS-CRITERIO}
      - {label: C, body: "$30$", misconception: ENT-DIVIS-INVIERTE}
      - {label: D, body: "$5$", correct: true}

  # ===== NUM-ENT-MCM · nivel 1 =================================

  # A SOLOCOMUN: solo el factor común 2, con su mayor repetición (tres veces)
  # B PRODUCTO: multiplica 8 · 12
  # C CAMBIA: da el MCD
  - code: M1-ENT-121
    node: NUM-ENT-MCM
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuál es el mínimo común múltiplo de $8$ y $12$?"
    options:
      - {label: A, body: "$8$", misconception: ENT-MCM-SOLOCOMUN}
      - {label: B, body: "$96$", misconception: ENT-MCM-PRODUCTO}
      - {label: C, body: "$4$", misconception: ENT-MCM-CAMBIA}
      - {label: D, body: "$24$", correct: true}

  # A MAYOR: toma el menor de los dos
  # B CAMBIA: da el mcm
  # D PRIMERCOMUN: el primer divisor común mayor que 1
  - code: M1-ENT-122
    node: NUM-ENT-MCM
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuál es el máximo común divisor de $12$ y $18$?"
    options:
      - {label: A, body: "$12$", misconception: ENT-MCM-MAYOR}
      - {label: B, body: "$36$", misconception: ENT-MCM-CAMBIA}
      - {label: C, body: "$6$", correct: true}
      - {label: D, body: "$2$", misconception: ENT-MCM-PRIMERCOMUN}

