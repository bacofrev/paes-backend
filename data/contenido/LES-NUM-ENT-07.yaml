  title: Valor absoluto
  position: 7
  nodes:
    - node: NUM-ENT-ABS
      anchor: valor-absoluto


# ---------------------------------------------------------------------
# ITEMS
# ---------------------------------------------------------------------

items:

  # ===== nivel 1 ======================================================

  # B CAMBIA: |7| = -7, le cambia el signo
  # C NEGSOL: resuelve |x| = -1 como |x| = 1
  # D SIGNOFUERA: -|-4| = 4 y -|4| = 4 (con una sola expresión
  #   coincidiría con PARENT o CAMBIA)
  - code: M2-ENT-001
    node: NUM-ENT-ABS
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuál de las siguientes afirmaciones es verdadera?"
    options:
      - {label: A, body: "$|-9| = |9|$", correct: true}
      - {label: B, body: "$|7| = -7$", misconception: ENT-ABS-CAMBIA}
      - {label: C, body: "$|x| = -1$ se cumple para $x = 1$ y para $x = -1$", misconception: ENT-ABS-NEGSOL}
      - {label: D, body: "$-|-4| = 4$ y también $-|4| = 4$", misconception: ENT-ABS-SIGNOFUERA}

  # A PARENT: -8 < 5
  # B CAMBIA: |3| = -3 y |-2| = 2, entonces -3 < 2
  # D MAGN: 9 > 4 entonces -9 > -4 (lo demás lo tiene bien)
  - code: M2-ENT-002
    node: NUM-ENT-ABS
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuál de las siguientes desigualdades es verdadera?"
    options:
      - {label: A, body: "$|-8| < |5|$", misconception: ENT-ABS-PARENT}
      - {label: B, body: "$|3| < |-2|$", misconception: ENT-ABS-CAMBIA}
      - {label: C, body: "$|-2| < |-9|$", correct: true}
      - {label: D, body: "$-9 > -4$ y $|-9| > |-4|$", misconception: ENT-REC-MAGN}

  # A PARENT: |x| = x, entonces x = -6
  # C NEGSOL: resuelve como |x| = 6
  # D CAMBIA: |x| = -x = -6, entonces x = 6
  - code: M2-ENT-003
    node: NUM-ENT-ABS
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Qué valores de $x$ cumplen $|x| = -6$?"
    options:
      - {label: A, body: "Solo $x = -6$", misconception: ENT-ABS-PARENT}
      - {label: B, body: "Ningún valor de $x$", correct: true}
      - {label: C, body: "$x = 6$ y $x = -6$", misconception: ENT-ABS-NEGSOL}
      - {label: D, body: "Solo $x = 6$", misconception: ENT-ABS-CAMBIA}

  # A UNASOL: 0, 1, 2, 3
  # B SALTOS: de -3 a 3 hay 6
  # C PARENT: |x| = x <= 3, todos los menores o iguales que 3
  - code: M2-ENT-004
    node: NUM-ENT-ABS
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuántos números enteros $x$ cumplen $|x| \\leq 3$?"
    options:
      - {label: A, body: "$4$", misconception: ENT-ABS-UNASOL}
      - {label: B, body: "$6$", misconception: ENT-ABS-SALTOS}
      - {label: C, body: "Infinitos: todos los menores o iguales que $3$", misconception: ENT-ABS-PARENT}
      - {label: D, body: "$7$", correct: true}

  # A UNASOL: solo el lado positivo
  # C NEGSOL: resuelve |x| = -2 como |x| = 2
  # D SIGNOFUERA: el menos de afuera también desaparece
  - code: M2-ENT-005
    node: NUM-ENT-ABS
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuál de las siguientes afirmaciones es verdadera?"
    options:
      - {label: A, body: "Solo un número cumple $|x| = 8$: el $8$.", misconception: ENT-ABS-UNASOL}
      - {label: B, body: "Dos números cumplen $|x| = 11$: el $11$ y el $-11$.", correct: true}
      - {label: C, body: "Dos números cumplen $|x| = -2$: el $2$ y el $-2$.", misconception: ENT-ABS-NEGSOL}
      - {label: D, body: "Las expresiones $-|-5|$ y $-|5|$ son iguales a $5$.", misconception: ENT-ABS-SIGNOFUERA}

  # B DISTTAM: 5 - 3 = 2
  # C CONTEO: cuenta los números de -5 a 3, que son 9
  # D SINSIGNO: compara 5 con 3 sin el signo, -5 > 3
  - code: M2-ENT-006
    node: NUM-ENT-ABS
    pool: curated
    difficulty: 1
    source: propio
    stem: >-
      En la recta numérica, el punto $A$ está en $-5$ y el punto $B$ está
      en $3$. ¿Cuál afirmación es correcta?
    options:
      - {label: A, body: "La distancia entre $A$ y $B$ es $8$, y $A$ es menor que $B$.", correct: true}
      - {label: B, body: "La distancia entre $A$ y $B$ es $2$, y $A$ es menor que $B$.", misconception: ENT-ABS-DISTTAM}
      - {label: C, body: "La distancia entre $A$ y $B$ es $9$, y $A$ es menor que $B$.", misconception: ENT-REC-CONTEO}
      - {label: D, body: "La distancia entre $A$ y $B$ es $8$, y $A$ es mayor que $B$.", misconception: ENT-REC-SINSIGNO}

  # A PARENT: |-6| = -6, su opuesto 6; |4| = 4, su opuesto -4
  # B CAMBIA: |-6| = 6, opuesto -6; |4| = -4, opuesto 4
  # C SIGNOFUERA: los dos quedan positivos
  - code: M2-ENT-007
    node: NUM-ENT-ABS
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuáles son los valores de $-|-6|$ y de $-|4|$, en ese orden?"
    options:
      - {label: A, body: "$6$ y $-4$", misconception: ENT-ABS-PARENT}
      - {label: B, body: "$-6$ y $4$", misconception: ENT-ABS-CAMBIA}
      - {label: C, body: "$6$ y $4$", misconception: ENT-ABS-SIGNOFUERA}
      - {label: D, body: "$-6$ y $-4$", correct: true}

  # A UNASOL: 0, 1, 2, 3, 4
  # B SALTOS: de -4 a 4 hay 8
  # D CAMBIA: |x| = -x < 5, todos los mayores que -5
  - code: M2-ENT-008
    node: NUM-ENT-ABS
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuántos números enteros $x$ cumplen $|x| < 5$?"
    options:
      - {label: A, body: "$5$", misconception: ENT-ABS-UNASOL}
      - {label: B, body: "$8$", misconception: ENT-ABS-SALTOS}
      - {label: C, body: "$9$", correct: true}
      - {label: D, body: "Infinitos: todos los mayores que $-5$", misconception: ENT-ABS-CAMBIA}

  # ===== nivel 2 ======================================================

  # Valores reales: 7, 3, -5, 0
  # B PARENT: -7, 3, -5, 0
  # C CAMBIA: 7, -3, 5, 0  (|5| = -5, su opuesto 5)
  # D SIGNOFUERA: 7, 3, 5, 0
  - code: M2-ENT-009
    node: NUM-ENT-ABS
    pool: curated
    difficulty: 2
    source: propio
    stem: >-
      ¿Cuál de las siguientes opciones ordena de menor a mayor las
      expresiones $|-7|,\ |3|,\ -|5|,\ |0|$?
    options:
      - {label: A, body: "$-|5|,\\ |0|,\\ |3|,\\ |-7|$", correct: true}
      - {label: B, body: "$|-7|,\\ -|5|,\\ |0|,\\ |3|$", misconception: ENT-ABS-PARENT}
      - {label: C, body: "$|3|,\\ |0|,\\ -|5|,\\ |-7|$", misconception: ENT-ABS-CAMBIA}
      - {label: D, body: "$|0|,\\ |3|,\\ -|5|,\\ |-7|$", misconception: ENT-ABS-SIGNOFUERA}

  # A PARENT: |x| = x, x = 9 y x = -3
  # B CAMBIA: |x| = -x, x = -9 y x = 3
  # C NEGSOL: resuelve |x| = -3 como |x| = 3
  - code: M2-ENT-010
    node: NUM-ENT-ABS
    pool: curated
    difficulty: 2
    source: propio
    stem: "¿Qué números cumplen $|x| = 9$ y qué números cumplen $|x| = -3$?"
    options:
      - {label: A, body: "$|x| = 9$: solo el $9$. $|x| = -3$: solo el $-3$.", misconception: ENT-ABS-PARENT}
      - {label: B, body: "$|x| = 9$: solo el $-9$. $|x| = -3$: solo el $3$.", misconception: ENT-ABS-CAMBIA}
      - {label: C, body: "$|x| = 9$: el $9$ y el $-9$. $|x| = -3$: el $3$ y el $-3$.", misconception: ENT-ABS-NEGSOL}
      - {label: D, body: "$|x| = 9$: el $9$ y el $-9$. $|x| = -3$: ningún número.", correct: true}

  # A DISTTAM: 12 - 7 = 5
  # C CONTEO: cuenta los números de -12 a 7, que son 20
  # D CTXSIGNO: "bajo el nivel del mar" queda +12, y de 12 a 7 hay 5
  - code: M2-ENT-011
    node: NUM-ENT-ABS
    pool: curated
    difficulty: 2
    source: propio
    stem: >-
      Frente a la costa de Valparaíso, un buzo está a 12 m bajo el nivel
      del mar. Justo sobre él, una gaviota vuela a 7 m sobre el nivel del
      mar. Si el nivel del mar es el $0$, ¿cuál opción indica la posición
      del buzo y la distancia entre el buzo y la gaviota?
    options:
      - {label: A, body: "Posición: $-12$ m. Distancia: $5$ m.", misconception: ENT-ABS-DISTTAM}
      - {label: B, body: "Posición: $-12$ m. Distancia: $19$ m.", correct: true}
      - {label: C, body: "Posición: $-12$ m. Distancia: $20$ m.", misconception: ENT-REC-CONTEO}
      - {label: D, body: "Posición: $12$ m. Distancia: $5$ m.", misconception: ENT-REC-CTXSIGNO}

  # Figura: P = -4, Q = -3, R = -1, S = 2, T = 5 (rotulados solo 0 y 1)
  # A UNASOL: solo los no negativos hasta 3: S
  # C PARENT: x <= 3: P, Q, R, S
  # D CAMBIA: -x <= 3, o sea x >= -3: Q, R, S, T
  - code: M2-ENT-012
    node: NUM-ENT-ABS
    pool: curated
    difficulty: 2
    source: propio
    figure: FIG-ENT-ABS-01
    stem: "¿Cuáles de los puntos marcados en la recta cumplen $|x| \\leq 3$?"
    options:
      - {label: A, body: "Solo $S$", misconception: ENT-ABS-UNASOL}
      - {label: B, body: "$Q$, $R$ y $S$", correct: true}
      - {label: C, body: "$P$, $Q$, $R$ y $S$", misconception: ENT-ABS-PARENT}
      - {label: D, body: "$Q$, $R$, $S$ y $T$", misconception: ENT-ABS-CAMBIA}

  # Cada variación entera v con |v| <= 4 da una lectura distinta: se
  # cuenta v, no hace falta calcular el rango (-22 a -14 sería ENT-ADI).
  # B UNASOL: solo variaciones 0 a 4 (solo subidas)
  # C SALTOS: de -4 a 4 hay 8
  # D PARENT: |v| = v <= 4, cualquier bajada sirve
  - code: M2-ENT-013
    node: NUM-ENT-ABS
    pool: curated
    difficulty: 2
    source: propio
    stem: >-
      Una cámara de frío está programada a $-18$ °C. Sea $v$ la variación
      de la temperatura respecto de ese valor: positiva si sube y negativa
      si baja. Para que los alimentos se conserven, debe cumplirse
      $|v| \leq 4$. Si el termómetro solo marca grados enteros, ¿cuántas
      lecturas distintas están permitidas?
    options:
      - {label: A, body: "$9$", correct: true}
      - {label: B, body: "$5$", misconception: ENT-ABS-UNASOL}
      - {label: C, body: "$8$", misconception: ENT-ABS-SALTOS}
      - {label: D, body: "Infinitas, porque la temperatura puede bajar sin límite", misconception: ENT-ABS-PARENT}

  # A UNASOL: solo x >= 0: 1, 1, 0
  # B NEGSOL: |x| = -5 como |x| = 5: 2, 1, 2
  # D CAMBIA: x = -a en cada una: 1, 1, 1 (PARENT da lo mismo:
  #   se etiqueta CAMBIA)
  - code: M2-ENT-014
    node: NUM-ENT-ABS
    pool: curated
    difficulty: 2
    source: propio
    stem: >-
      ¿Cuántos números enteros cumplen $|x| = 5$, cuántos cumplen
      $|x| = 0$ y cuántos cumplen $|x| = -5$, en ese orden?
    options:
      - {label: A, body: "$1$, $1$ y $0$", misconception: ENT-ABS-UNASOL}
      - {label: B, body: "$2$, $1$ y $2$", misconception: ENT-ABS-NEGSOL}
      - {label: C, body: "$2$, $1$ y $0$", correct: true}
      - {label: D, body: "$1$, $1$ y $1$", misconception: ENT-ABS-CAMBIA}

  # A SALTOS: de -5 a -1 hay 4
  # C UNASOL: solo mira los no negativos, así que no hay negativos
  # D PARENT: |x| = x < 6 lo cumplen todos los negativos
  - code: M2-ENT-015
    node: NUM-ENT-ABS
    pool: curated
    difficulty: 2
    source: propio
    stem: "¿Cuántos números enteros **negativos** cumplen $|x| < 6$?"
    options:
      - {label: A, body: "$4$", misconception: ENT-ABS-SALTOS}
      - {label: B, body: "$5$", correct: true}
      - {label: C, body: "Ninguno", misconception: ENT-ABS-UNASOL}
      - {label: D, body: "Infinitos", misconception: ENT-ABS-PARENT}

  # A DISTTAM: 9 - 6 = 3
  # B CONTEO: cuenta los números de -9 a 6, que son 16
  # C SINSIGNO: compara 9 con 6 sin el signo: -9 > 6
  - code: M2-ENT-016
    node: NUM-ENT-ABS
    pool: curated
    difficulty: 2
    source: propio
    stem: >-
      Un día de invierno en Ollagüe, a las 5:00 se registraron 9 °C bajo
      cero y a las 15:00, 6 °C. ¿Cuál afirmación es correcta?
    options:
      - {label: A, body: "Las temperaturas se diferencian en 3 °C, y la más fría fue la de las 5:00.", misconception: ENT-ABS-DISTTAM}
      - {label: B, body: "Las temperaturas se diferencian en 16 °C, y la más fría fue la de las 5:00.", misconception: ENT-REC-CONTEO}
      - {label: C, body: "Las temperaturas se diferencian en 15 °C, y la más fría fue la de las 15:00.", misconception: ENT-REC-SINSIGNO}
      - {label: D, body: "Las temperaturas se diferencian en 15 °C, y la más fría fue la de las 5:00.", correct: true}

  # ===== nivel 3 ======================================================

  # Verdades: I V, II F, III F
  # B NEGSOL: II también le parece verdadera
  # C SIGNOFUERA: III también le parece verdadera
  # D UNASOL: I le parece falsa (una sola solución), II y III falsas
  - code: M2-ENT-017
    node: NUM-ENT-ABS
    pool: curated
    difficulty: 3
    source: propio
    stem: |
      Considera las siguientes afirmaciones:

      I. Exactamente dos números cumplen $|x| = 12$.

      II. Exactamente dos números cumplen $|x| = -12$.

      III. Los números $-|-3|$ y $-|8|$ son positivos.

      ¿Cuál o cuáles son verdaderas?
    options:
      - {label: A, body: "Solo I", correct: true}
      - {label: B, body: "Solo I y II", misconception: ENT-ABS-NEGSOL}
      - {label: C, body: "Solo I y III", misconception: ENT-ABS-SIGNOFUERA}
      - {label: D, body: "Ninguna de ellas", misconception: ENT-ABS-UNASOL}

  # Verdades: I V (11 enteros), II V (distancia 8), III V
  # A UNASOL: I falsa (cuenta 6), III falsa (solo x = 3), II verdadera
  # B DISTTAM: II falsa (6 - 2 = 4)
  # C SALTOS: I falsa (de -5 a 5 hay 10)
  - code: M2-ENT-018
    node: NUM-ENT-ABS
    pool: curated
    difficulty: 3
    source: propio
    stem: |
      Considera las siguientes afirmaciones:

      I. Hay $11$ números enteros que cumplen $|x| \leq 5$.

      II. La distancia entre $-6$ y $2$ en la recta numérica es $8$.

      III. Si $|x| = 3$, entonces $x$ puede ser $-3$.

      ¿Cuál o cuáles son verdaderas?
    options:
      - {label: A, body: "Solo II", misconception: ENT-ABS-UNASOL}
      - {label: B, body: "Solo I y III", misconception: ENT-ABS-DISTTAM}
      - {label: C, body: "Solo II y III", misconception: ENT-ABS-SALTOS}
      - {label: D, body: "I, II y III", correct: true}

  # k < 0, -k > 0
  # A NEGSOL: las dos como si fueran positivas
  # B UNASOL: |x| = k no tiene solución x >= 0; |x| = -k solo x = -k
  # D PARENT: |x| = k la cumple x = k; |x| = -k la cumple x = -k
  #   (CAMBIA da lo mismo: se etiqueta PARENT)
  - code: M2-ENT-019
    node: NUM-ENT-ABS
    pool: curated
    difficulty: 3
    source: propio
    stem: >-
      Sea $k$ un número entero negativo. ¿Cuántos números cumplen
      $|x| = k$ y cuántos cumplen $|x| = -k$, respectivamente?
    options:
      - {label: A, body: "Dos y dos", misconception: ENT-ABS-NEGSOL}
      - {label: B, body: "Ninguno y uno", misconception: ENT-ABS-UNASOL}
      - {label: C, body: "Ninguno y dos", correct: true}
      - {label: D, body: "Uno y uno", misconception: ENT-ABS-PARENT}

  # A UNASOL: 0 a 50, son 51
  # B SALTOS: de -50 a 50 hay 100
  # D CAMBIA: -x <= 50, todos los mayores o iguales que -50
  - code: M2-ENT-020
    node: NUM-ENT-ABS
    pool: curated
    difficulty: 3
    source: propio
    stem: "¿Cuántos números enteros $x$ cumplen $|x| \\leq 50$?"
    options:
      - {label: A, body: "$51$", misconception: ENT-ABS-UNASOL}
      - {label: B, body: "$100$", misconception: ENT-ABS-SALTOS}
      - {label: C, body: "$101$", correct: true}
      - {label: D, body: "Infinitos: todos los mayores o iguales que $-50$", misconception: ENT-ABS-CAMBIA}

  # Figura: marcas de 2 en 2, rotulados solo 0 y 4. M = -6, N = 8.
  # A DISTTAM: 8 - 6 = 2
  # C ESCALA: cuenta 3 marcas a la izquierda y 4 a la derecha: 7
  # D CONTEO: cuenta los números de -6 a 8, que son 15
  - code: M2-ENT-021
    node: NUM-ENT-ABS
    pool: curated
    difficulty: 3
    source: propio
    figure: FIG-ENT-ABS-02
    stem: >-
      En la recta numérica, las marcas están igualmente espaciadas. ¿Cuál
      es la distancia entre los puntos $M$ y $N$?
    options:
      - {label: A, body: "$2$", misconception: ENT-ABS-DISTTAM}
      - {label: B, body: "$14$", correct: true}
      - {label: C, body: "$7$", misconception: ENT-REC-ESCALA}
      - {label: D, body: "$15$", misconception: ENT-REC-CONTEO}

  # Verdades: I V, II V, III V
  # B PARENT: I (-5 > 2) F, II (5 < -2) F, III (4 > -1) V
  # C CAMBIA: I (5 > -2) V, II (-5 < 2) V, III (-4 > 1) F
  # D SIGNOFUERA: I V, II (5 < 2) F, III V
  - code: M2-ENT-022
    node: NUM-ENT-ABS
    pool: curated
    difficulty: 3
    source: propio
    stem: |
      Considera las siguientes desigualdades:

      I. $|-5| > |2|$

      II. $-|-5| < -|2|$

      III. $|4| > |-1|$

      ¿Cuál o cuáles son verdaderas?
    options:
      - {label: A, body: "I, II y III", correct: true}
      - {label: B, body: "Solo III", misconception: ENT-ABS-PARENT}
      - {label: C, body: "Solo I y II", misconception: ENT-ABS-CAMBIA}
      - {label: D, body: "Solo I y III", misconception: ENT-ABS-SIGNOFUERA}

  # Verdades: I V (5), II F (es 11), III V (12 enteros)
  # A SALTOS: III falsa (de -8 a 3 hay 11): solo I
  # B CONTEO: I falsa (cuenta 6), III verdadera: solo III
