# =====================================================================
# LES-NUM-ENT-07 — Valor absoluto
# Cubre NUM-ENT-ABS
# =====================================================================
# Clase sola: es el único nodo M2 de la unidad. Sus prerrequisitos son
# NUM-ENT-REC (LES-NUM-ENT-01) y NUM-ENT-ADI (LES-NUM-ENT-02). La arista
# ADI -> ABS se agregó el 27 sep 2026: los ítems PAES de valor absoluto
# operan dentro de las barras (|b - a|, distancia |a - b|). MUL no es
# prerrequisito: no tiene contenido y bloquearía el nodo; se evalúa al
# hacer su clase. La posición 7 deja 3 a 6 libres para las clases M1
# que faltan (MUL, PRIOR, DIVIS, MCM).
#
# Alcance (cerrado 26 sep 2026):
#   entra   |x| como distancia al 0 (incluye |0|), -|x| frente a |-x|,
#           comparar y ordenar expresiones con valor absoluto, qué
#           números cumplen |x| = a (dos, uno o ninguno), contar los
#           enteros con |x| <= a o |x| < a, sumas y restas dentro de las
#           barras, distancia entre dos enteros como |a - b|, deducir el
#           signo de lo de adentro (si a > b, |b - a|), contexto.
#   fuera   multiplicación dentro de las barras (ENT-MUL), fracciones y
#           decimales (NUM-FRA-SIG, NUM-REA-ORD), irracionales
#           (NUM-REA-IRR). Sin vocabulario de ecuaciones: se dice "qué
#           números cumplen".
#   hueco   inecuaciones |x - a| < b en R y la función f(x) = |x| no
#           tienen nodo en el grafo.
#   recurso el opuesto (-a como el simétrico de a) para leer -|x|.
#
# Niveles:
#   1  un valor absoluto, una ecuación o un conteo directo
#   2  ordenar, pares de ecuaciones, figura, contexto
#   3  I/II/III, enunciados generales, figura con escala, contexto PAES
# ---------------------------------------------------------------------
# Las misconceptions viven en contenido/misconceptions/NUM-ENT.yaml.
# Acá solo se referencian por código.
#
# Cómo se derivan los distractores (reglas del catálogo):
#   CAMBIA      |a| = -a  (acierta con negativos)
#   PARENT      |a| = a   (acierta con positivos)
#   SIGNOFUERA  -|a| = |a|
#   UNASOL      solo x >= 0: |x| = a -> x = a; |x| <= a -> 0..a
#   NEGSOL      |x| = -a -> x = a o x = -a
#   DISTTAM     distancia(a, b) = | |a| - |b| |
#   SALTOS      cantidad de enteros de m a M = M - m
#   DISTRIB     |a - b| = |a| - |b|,  |a + b| = |a| + |b|
#   QUITASIGNO  borra los signos menos de adentro y suma: |a - b| = a + b
# Una expresión suelta -|a| da lo mismo con SIGNOFUERA que con PARENT
# (a < 0) o CAMBIA (a > 0). Por eso SIGNOFUERA siempre va en ítems con
# un -|negativo| y un -|positivo| a la vez.
# ---------------------------------------------------------------------

unit: NUM-ENT

lesson:
