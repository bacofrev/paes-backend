    stem: "Si $a$ y $b$ son números enteros tales que $a > b$, ¿a qué expresión es igual $|b - a|$?"
    options:
      - {label: A, body: "$b - a$", misconception: ENT-ABS-PARENT}
      - {label: B, body: "$a - b$", correct: true}
      - {label: C, body: "$a + b$", misconception: ENT-ABS-QUITASIGNO}
      - {label: D, body: "$|b| - |a|$", misconception: ENT-ABS-DISTRIB}

  # Verdades: I F (x = 1, y = -3), II V, III V (x está entre -y e y)
  # B PARENT: lee la hipótesis como x < y: I V, II F, III V
  # C MAGN: entre negativos cree mayor al más lejano del 0: II F. La I la
  #   rechaza bien (MAGN solo afecta a los negativos)
  # D CAMBIA: lee la hipótesis como -x < -y, o sea x > y: I F, II V, III F
  - code: M2-ENT-030
    node: NUM-ENT-ABS
