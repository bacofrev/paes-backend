# =====================================================================
# LES-GEO-TRA-01 — El plano cartesiano, puntos y cuadrantes
# Cubre GEO-PLA-COORD
# =====================================================================
# Clase sola y temprano: GEO-PLA-COORD es tronco (la piden SIS, FUN-REP,
# VEC, ROT, REF, HOM, REC-DIST). Prerrequisito: NUM-ENT-REC
# (LES-NUM-ENT-01). Decisión 4 del plan: los cuadrantes van acá, las
# regiones (REG) en LES-GEO-TRA-07.
#
# Alcance (propuesto, sin control 1):
#   entra   par ordenado (x, y), abscisa y ordenada; ubicar y leer puntos
#           (cuadrícula de 1, de 2, de 3, de 5); cuadrantes y signos;
#           puntos sobre los ejes (no son de ningún cuadrante); distancia
#           entre dos puntos en una misma horizontal o vertical (contar
#           saltos); vértice que falta de un rectángulo; contexto de mapas
#           con norte y este.
#   fuera   distancia entre puntos cualesquiera y punto medio
#           (GEO-REC-DIST, M2); regiones del plano (GEO-PLA-REG);
#           vectores y traslaciones (GEO-PLA-VEC, GEO-TRA-TRAS); simetrías
#           (GEO-TRA-REF-EJE).
#   recurso la recta numérica de NUM-ENT-REC: cada eje es una recta.
#
# Niveles:
#   1  leer o ubicar un punto, reconocer el cuadrante o el eje
#   2  figuras con escala 2, vértice que falta, coordenadas + cuadrante
#      en contexto
#   3  escala 5, I/II/III, enunciados con letras, recorridos en contexto
# ---------------------------------------------------------------------

