      - {label: D, body: "$(-2, -7)$", misconception: TRA-REFEJE-CAMBIAEJE}

  # A CAMBIAEJE: rechaza I y acepta II
  # B INTERCAMBIA: rechaza las tres
  # D AMBOS: rechaza I y acepta III
