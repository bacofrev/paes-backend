  # ===== GEO-TRA-REF-EJE · nivel 3 =============================

  # A CAMBIAEJE: rechaza I y II; con dos reflexiones acierta
  # C INTERCAMBIA: rechaza las tres
  # D PROYECTA: acepta I (queda en el eje) y rechaza II y III
  - code: M1-TRA-113
    node: GEO-TRA-REF-EJE
    pool: curated
    difficulty: 3
    source: propio
    stem: |-
      Considera las siguientes afirmaciones:

      I. Si un punto $P$ está sobre el eje $x$, su reflejo respecto del eje $x$ es el mismo $P$.

      II. El reflejo de $(a, b)$ respecto del eje $y$ es $(-a, b)$.

      III. Reflejar un punto respecto del eje $x$ y después respecto del eje $y$ equivale a cambiar el signo de sus dos coordenadas.

      ¿Cuál o cuáles son correctas?
    options:
      - {label: A, body: "Solo III", misconception: TRA-REFEJE-CAMBIAEJE}
      - {label: B, body: "I, II y III", correct: true}
      - {label: C, body: "Ninguna de ellas", misconception: TRA-REFEJE-INTERCAMBIA}
      - {label: D, body: "Solo I", misconception: TRA-REFEJE-PROYECTA}

  # A CAMBIAEJE: cambia la x
  # B INTERCAMBIA: intercambia las coordenadas
  # D AMBOS: cambia los dos signos
  - code: M1-TRA-114
    node: GEO-TRA-REF-EJE
    pool: curated
    difficulty: 3
    source: propio
