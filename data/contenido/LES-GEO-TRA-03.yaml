# =====================================================================
# LES-GEO-TRA-03 — Reflexiones
# Cubre GEO-TRA-REF-EJE, GEO-TRA-REF-REC
# =====================================================================
# Arista directa REF-EJE -> REF-REC. REF-EJE pide GEO-PLA-COORD
# (LES-GEO-TRA-01).
#
# Alcance (propuesto, sin control 1):
#   REF-EJE entra  reflejo de puntos y figuras respecto del eje x y del
#                  eje y; qué coordenada cambia; puntos sobre el eje (no se
#                  mueven); la reflexión invierte la orientación; reconocer
#                  el eje a partir de una figura y su imagen; distancia de
#                  un punto a su reflejo.
#   REF-REC entra  reflejo respecto de rectas x = a, y = b, y = x e
#                  y = −x; encontrar la recta de simetría entre un punto y
#                  su imagen; composición con un eje.
#           fuera  rectas oblicuas distintas de y = x e y = −x (no las pide
#                  la PAES M1); simetría central (GEO-TRA-SIM-CEN, clase 04);
#                  composición general (GEO-TRA-COMP).
#
# Niveles:
#   1  un punto, una recta, una regla
#   2  figuras, preimagen, distancias, cuadrantes
#   3  I/II/III, letras, recta de simetría, composición
# ---------------------------------------------------------------------

unit: GEO-TRA

lesson:
  code: LES-GEO-TRA-03
  title: Reflexiones
  position: 3
  nodes:
    - node: GEO-TRA-REF-EJE
      anchor: reflexion-respecto-de-los-ejes
    - node: GEO-TRA-REF-REC
      anchor: reflexion-respecto-de-una-recta


