      - {label: C, body: "$A' = (2, -1)$, y la imagen tiene la orientación invertida.", misconception: TRA-REFEJE-CAMBIAEJE}
      - {label: D, body: "$A' = (-2, 1)$, y la imagen tiene la misma forma y tamaño, pero la orientación invertida.", correct: true}

