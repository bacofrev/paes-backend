    pool: curated
    difficulty: 3
    source: propio
    stem: >-
      Un espejo vertical coincide con el eje $y$. Una persona está parada en
      el punto $(-3, 1)$. ¿A qué distancia está de su reflejo y dónde se ve
      el reflejo?
    options:
      - {label: A, body: "A $6$ unidades; el reflejo se ve en $(3, 1)$.", correct: true}
      - {label: B, body: "A $7$ unidades; el reflejo se ve en $(3, 1)$.", misconception: PLA-COORD-CONTEO}
      - {label: C, body: "A $3$ unidades; el reflejo se ve en $(0, 1)$.", misconception: TRA-REFEJE-PROYECTA}
      - {label: D, body: "A $2$ unidades; el reflejo se ve en $(-3, -1)$.", misconception: TRA-REFEJE-CAMBIAEJE}

  # B INTERCAMBIA: intercambia las coordenadas
  # C AMBOS: cambia los dos signos
  # D CAMBIAEJE: cambia la x
  - code: M1-TRA-117
    node: GEO-TRA-REF-EJE
    pool: curated
    difficulty: 3
    source: propio
    stem: >-
      Sean $a$ y $b$ números positivos. ¿Cuál es el reflejo del punto
