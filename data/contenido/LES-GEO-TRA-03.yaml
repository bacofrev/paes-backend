      III. El reflejo de $(2, 3)$ respecto del eje $x$ es $(3, 2)$.

      ¿Cuál o cuáles son correctas?
    options:
      - {label: A, body: "Solo I y III", misconception: TRA-REFEJE-INTERCAMBIA}
      - {label: B, body: "Solo I", correct: true}
      - {label: C, body: "Ninguna de ellas", misconception: TRA-REFEJE-TRASLADA}
      - {label: D, body: "Solo I y II", misconception: TRA-REFEJE-CAMBIAEJE}

  # A INTERCAMBIA: intercambia las coordenadas
  # B CAMBIAEJE: cambia la x
  # D PROYECTA: cree que todo punto de esa vertical cae en el eje
  - code: M1-TRA-119
    node: GEO-TRA-REF-EJE
    pool: curated
    difficulty: 3
    source: propio
    stem: >-
