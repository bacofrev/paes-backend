      - {label: C, body: "Al reflejar un punto respecto de un eje, cambian de signo sus dos coordenadas.", misconception: TRA-REFEJE-AMBOS}
      - {label: D, body: "Al reflejar un punto respecto del eje $x$, su abscisa no cambia y su ordenada cambia de signo.", correct: true}

  # B AMBOS: cambia los dos signos
  # C CAMBIAEJE: refleja en el eje x
  # D TRASLADA: al otro lado sin darla vuelta
