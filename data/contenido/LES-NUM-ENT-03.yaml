      - {label: C, body: "$3 \\cdot 4$", misconception: ENT-REC-CTXSIGNO}
      - {label: D, body: "$(-3) + 4$", misconception: ENT-MUL-SUMA}

  # A CERONEUTRO: el 0 no cambia el número
  # B REGLASUMA: dos negativos dan negativo
  # D DIVCERO: dividir por cero da cero
  - code: M1-ENT-055
    node: NUM-ENT-MUL
    pool: curated
    difficulty: 1
