# =====================================================================
# LES-NUM-ENT-03 — Multiplicación y división de enteros
# Cubre NUM-ENT-MUL
# =====================================================================
# Clase sola: incluye la división y concentra las reglas de signos.
# Prerrequisito: NUM-ENT-ADI (LES-NUM-ENT-02). Desbloquea potencias
# (NUM-POT-CONC, NUM-POT-SIG), PRIOR, DIVIS y ALG-EXP-TERM.
#
# Alcance (propuesto, sin control 1):
#   entra   producto y cociente de dos enteros; regla de signos; producto
#           de tres o más factores (se cuentan los negativos); el cero
#           como factor, como dividendo y como divisor; factor o divisor
#           desconocido (? · (−5) = −35); contexto: bajadas constantes,
#           deudas repartidas, variación por hora.
#   fuera   potencias, aunque sean productos repetidos (NUM-POT-CONC);
#           mezcla de operaciones y cadenas de divisiones de izquierda a
#           derecha (NUM-ENT-PRIOR); divisibilidad (NUM-ENT-DIVIS);
#           divisiones no exactas (NUM-FRA); valor absoluto |a · b|
#           (NUM-ENT-ABS, M2).
#   recurso el "tamaño" de un número (distancia al 0) para decir que el
#           tamaño del producto es el producto de los tamaños. Sin
#           notación |x|.
#   dos pasos  los ítems de nivel 2-3 pueden calcular una variación con
#           ADI antes de dividir: ADI es prerrequisito.
#
# Niveles:
#   1  una operación, igualdad verdadera, contexto directo
#   2  tres o más factores, factor desconocido, contexto de dos pasos
#   3  I/II/III, enunciados generales con letras, casos límite con cero
# ---------------------------------------------------------------------

