      - {label: B, body: "$a \\cdot a$", misconception: ENT-MUL-REGLASUMA}
      - {label: C, body: "$2 \\cdot 5 \\cdot a$", correct: true}
      - {label: D, body: "$a \\cdot 0$", misconception: ENT-MUL-CERONEUTRO}

