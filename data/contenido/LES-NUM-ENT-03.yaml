      - {label: B, body: "$(-12.000) + 4$", misconception: ENT-MUL-SUMA}
      - {label: C, body: "$(-12.000) \\cdot 4$", misconception: ENT-MUL-INVERSA}
      - {label: D, body: "$(-12.000) \\div 4$", correct: true}

  # A INVERSA: reparte en vez de repetir
