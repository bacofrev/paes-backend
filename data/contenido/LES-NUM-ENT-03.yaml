items:

  # ===== NUM-ENT-MUL · nivel 1 =================================

  # A DIVCERO: dividir por cero da cero
  # C SUMA: lee (−6)(2) como −6 + 2
  # D REGLASUMA: dos negativos dan negativo, como en la suma
  - code: M1-ENT-049
    node: NUM-ENT-MUL
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuál de las siguientes igualdades es verdadera?"
    options:
      - {label: A, body: "$(-8) \\div 0 = 0$", misconception: ENT-MUL-DIVCERO}
      - {label: B, body: "$(-7)\\cdot(-3) = 21$", correct: true}
      - {label: C, body: "$(-6)(2) = -4$", misconception: ENT-MUL-SUMA}
      - {label: D, body: "$(-4)\\cdot(-5) = -20$", misconception: ENT-MUL-REGLASUMA}

  # A SUMA: lee (−2)(5) como −2 + 5
