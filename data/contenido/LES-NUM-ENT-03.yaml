      - {label: D, body: "$(-5)\\cdot 2 \\cdot 3$", misconception: ENT-MUL-MAYORIA}

  # A CTXSIGNO: «bajó» se anota positivo
  # B SUMA: junta los dos datos sumando
  # C INVERSA: multiplica cuando la situación reparte
