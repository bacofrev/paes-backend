  - code: M1-ENT-051
    node: NUM-ENT-MUL
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Qué número multiplicado por $-5$ da $-35$?"
    options:
      - {label: A, body: "$-7$", misconception: ENT-MUL-REGLASUMA}
      - {label: B, body: "$175$", misconception: ENT-MUL-INVERSA}
      - {label: C, body: "$-30$", misconception: ENT-MUL-SUMA}
      - {label: D, body: "$7$", correct: true}

  # B CERONEUTRO: se salta el 0: (−6)(−1) = 6
  # C REGLASUMA: signo del de mayor tamaño: el 42, positivo
  # D MAYORIA: hay más factores positivos: positivo
  - code: M1-ENT-052
    node: NUM-ENT-MUL
    pool: curated
    difficulty: 1
    source: propio
    stem: >-
      ¿Cuál de las siguientes operaciones tiene resultado positivo?
    options:
      - {label: A, body: "$(-42) \\div (-7)$", correct: true}
      - {label: B, body: "$(-6)\\cdot 0 \\cdot (-1)$", misconception: ENT-MUL-CERONEUTRO}
