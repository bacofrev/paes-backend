# =====================================================================
# Catálogo de misconceptions — unidad NUM-ENT
# =====================================================================
# Fuente única de la unidad. Las clases NO declaran misconceptions:
# solo referencian códigos, y el cargador falla si el código no existe
# acá.
#
# origin — de dónde salió el error:
#   demre      observado en ítems oficiales o clavijero DEMRE
#   docente    reportado por alguien que hace clases
#   hipotesis  plausible, sin evidencia todavía
#
# Estado: NUM-ENT-REC, NUM-ENT-ADI y NUM-ENT-ABS. MUL y el resto se
# agregan al llegar a su clase.
#
# NUM-ENT-REC es raíz del grafo: no hay nodo debajo al que bajar al
# estudiante. Las remediaciones de estos errores deben sostenerse solas.
# ---------------------------------------------------------------------

unit: NUM-ENT

misconceptions:

  # --- NUM-ENT-REC ----------------------------------------------------

  - code: ENT-REC-MAGN
    name: Compara negativos por su magnitud
    nodo: NUM-ENT-REC
    area: NUM
    origin: docente
    description: >-
      Entre dos negativos elige como mayor el de mayor número "visible".
      Traslada el orden de los naturales a los negativos sin invertirlo:
      como 7 > 3, concluye que -7 > -3. Es el error central del nodo y
      debe aparecer como distractor en la mayoría de los ítems de
      comparación.
    example: "-7 > -3"

  - code: ENT-REC-SINSIGNO
    name: Ignora el signo al comparar negativo con positivo
    nodo: NUM-ENT-REC
    area: NUM
    origin: docente
    description: >-
      Compara un negativo con un positivo mirando solo los dígitos. Se
      registra separado de ENT-REC-MAGN a propósito: MAGN ocurre entre dos
      negativos y este cruza el cero. Un estudiante puede ordenar bien
      -7 < -3 y aun así decir que -8 > 5.
    example: "-8 > 5"

  - code: ENT-REC-CERO
    name: Cree que 0 es el menor de los enteros
    nodo: NUM-ENT-REC
    area: NUM
    origin: docente
    description: >-
      Arrastra la idea de los naturales de que el 0 es el piso: "no hay
      nada menos que cero". Ubica los negativos por encima del 0 o los
      trata como mayores que él.
    example: "0 < -2"

  - code: ENT-REC-SUCESOR
    name: Invierte antecesor y sucesor con negativos
    nodo: NUM-ENT-REC
    area: NUM
    origin: docente
    description: >-
      Para el sucesor de un negativo se aleja del 0 en vez de moverse a la
      derecha. Usa "sucesor = el número que sigue al leer" (4, 5, 6...) y
      lo aplica a la magnitud. Con positivos no se nota, solo aparece con
      negativos.
    example: "sucesor de -4 = -5"

  - code: ENT-REC-ESCALA
    name: Lee cada marca de la recta como una unidad
    nodo: NUM-ENT-REC
    area: NUM
    origin: hipotesis
    description: >-
      En una recta cuya escala no es 1 (de 2 en 2, de 5 en 5), cuenta
      marcas en vez de leer su valor: asigna 1, 2, 3... a las marcas
      sucesivas aunque cada una valga más. Sin observación en aula; se
      mantiene porque la PAES usa rectas con escala.
    example: "escala de 2 en 2 desde 0: lee la 3ª marca como 3 (vale 6)"

  - code: ENT-REC-CONTEO
    name: Cuenta el punto de partida al medir en la recta
    nodo: NUM-ENT-REC
    area: NUM
    origin: docente
    description: >-
      Al contar cuántas unidades hay entre dos enteros cuenta los números
      (incluyendo el de partida) en vez de los saltos. Da siempre una
      unidad de más. Es más frecuente cuando el recorrido cruza el cero.
    example: "de -2 a 3 cuenta 6 unidades (son 5)"

  - code: ENT-REC-CTXSIGNO
    name: Asigna mal el signo en un contexto
    nodo: NUM-ENT-REC
    area: NUM
    origin: docente
    description: >-
      Traduce mal una situación a entero: "bajo el nivel del mar", "bajo
      cero", "deuda" o "retroceso" quedan como positivos. Después compara
      bien, pero sobre números con el signo equivocado.
    example: "5 m bajo el nivel del mar = +5"

  - code: ENT-REC-DIRECCION
    name: Invierte izquierda y derecha al moverse en la recta
    nodo: NUM-ENT-REC
    area: NUM
    origin: docente
    description: >-
      Al desplazarse en la recta se mueve hacia el lado contrario: trata
      "a la izquierda" como aumentar. A diferencia de ENT-REC-SUCESOR,
      ocurre también con puros positivos ("3 a la izquierda de 5" = 8), y
      a diferencia de ENT-REC-SINSIGNO no tiene que ver con comparar sino
      con moverse. Con negativos y sucesor/antecesor da la misma
      respuesta que SUCESOR; los ítems que buscan distinguirlos usan
      desplazamientos, no sucesores.
    example: "3 unidades a la izquierda de 1 = 4"

  # --- NUM-ENT-ADI ----------------------------------------------------
  # Aprobadas por Ben en el control 1 de LES-NUM-ENT-02 (25 sep 2026),
  # todas vistas en aula. Se descartó ENT-ADI-SIGNOPRIM ("pone el signo
  # del primer término"): sin evidencia de que sea una regla estable y no
  # un descuido.

  - code: ENT-ADI-REGLAMUL
    name: Aplica la regla de signos de la multiplicación a la suma
    nodo: NUM-ENT-ADI
    area: NUM
    origin: docente
    description: >-
      Lleva "menos con menos da más" a la suma y la resta: dos negativos
      que se suman o un negativo al que se le resta un positivo le dan
      resultado positivo. Es el único error del nodo que produce un
      positivo a partir de dos cantidades negativas, y se vuelve más
      frecuente después de ver ENT-MUL.
    example: "-3 - 5 = 8"

  - code: ENT-ADI-MAGNOP
    name: Decide sumar o restar por el símbolo de la operación
    nodo: NUM-ENT-ADI
    area: NUM
    origin: docente
    description: >-
      Mira el símbolo de la operación y no los signos de los números: si
      ve "+" suma los tamaños, si ve "-" los resta, y deja el signo del
      negativo que aparece. Se separa de ENT-ADI-INVIERTE con -7 + 3
      (MAGNOP da -10, INVIERTE da 4) y de ENT-ADI-DOBLENEG con 5 - (-3)
      (MAGNOP da -2, DOBLENEG da 2). En 3 - 7, sin negativos a la vista,
      coincide con INVIERTE: ahí se etiqueta INVIERTE. En una cadena
      a - b + c con a < b coincide con ENT-ADI-RESTAGRUPA: esos ítems no
      usan las dos.
    example: "-7 + 3 = -10"

  - code: ENT-ADI-INVIERTE
    name: Resta el mayor menos el menor y deja el resultado positivo
    nodo: NUM-ENT-ADI
    area: NUM
    origin: docente
    description: >-
      Arrastra de los naturales que "no se puede quitar 7 a 3": da vuelta
      la resta como si fuera conmutativa y el resultado queda positivo.
      También aparece en sumas con signos distintos, donde resta bien los
      tamaños pero no pone el signo del que tiene mayor tamaño.
    example: "3 - 7 = 4"

  - code: ENT-ADI-DOBLENEG
    name: Ignora que está restando un negativo
    nodo: NUM-ENT-ADI
    area: NUM
    origin: docente
    description: >-
      Lee a - (-b) como a - b: el signo del número que se resta desaparece
      y no se transforma en suma. Un estudiante con solo este error
      resuelve bien -7 + 3; falla únicamente cuando se resta un negativo,
      incluidas las diferencias en contexto que cruzan el cero (máxima 4,
      mínima -6: da 2).
    example: "5 - (-3) = 2"

  - code: ENT-ADI-RESTAGRUPA
    name: Aplica el signo menos a todo lo que viene después
    nodo: NUM-ENT-ADI
    area: NUM
    origin: docente
    description: >-
      En una cadena de sumas y restas trata el primer "-" como si
      encerrara el resto entre paréntesis: 10 - 3 + 2 lo calcula como
      10 - (3 + 2). Solo aparece con tres o más términos. Borde con
      ENT-PRIOR: se queda en ADI porque la cadena es solo de sumas y
      restas.
    example: "10 - 3 + 2 = 5"

  - code: ENT-ADI-VARORDEN
    name: Calcula la variación como inicial menos final
    nodo: NUM-ENT-ADI
    area: NUM
    origin: docente
    description: >-
      Invierte el orden de la resta al calcular una variación o un cambio:
      hace inicial - final en vez de final - inicial. Acierta el tamaño y
      falla el signo, así que una subida queda como bajada. Solo aparece
      en ítems de variación.
    example: "de -3 °C a 5 °C: variación -8"

  # --- NUM-ENT-MUL ----------------------------------------------------
  # Propuestas para LES-NUM-ENT-03 (27 sep 2026), sin control 1: todas
  # hipotesis hasta que Ben las revise.
  #
  # Colisiones conocidas:
  #   REGLASUMA y MAYORIA dan el mismo valor (el opuesto del correcto)
  #   en un producto de números sueltos siempre que las dos se
  #   equivoquen. Por eso los ítems de varios factores usan valor +
  #   afirmación, o preguntan "¿cuál es negativo?" con productos donde
  #   una de las dos acierta.
  #   REGLASUMA acierta cuando el factor de mayor tamaño es el negativo
  #   ((−8) · 3): esos ítems la dejan fuera.

  - code: ENT-MUL-REGLASUMA
    name: Aplica la regla de signos de la suma a la multiplicación
    nodo: NUM-ENT-MUL
    area: NUM
    origin: hipotesis
    description: >-
      Espejo de ENT-ADI-REGLAMUL: trae a la multiplicación y la división
      lo que sabe de la suma. Dos negativos "juntan" un negativo más
      grande ((−4)(−5) = −20), y con signos distintos pone el signo del
      factor de mayor tamaño ((−2) · 6 = 12). Es la misconception central
      del nodo. Se separa de MAYORIA en un producto de varios factores
      donde el de mayor tamaño y la mayoría tienen signos distintos, o con
      valor + afirmación.
    example: "(−4)(−5) = −20;  (−2) · 6 = 12"

  - code: ENT-MUL-MAYORIA
    name: Decide el signo de un producto por mayoría
    nodo: NUM-ENT-MUL
    area: NUM
    origin: hipotesis
    description: >-
      Con tres o más factores, le pone al resultado el signo que más se
      repite en vez de contar si los negativos son una cantidad par o
      impar: (−1) · 2 · 3 = 6 porque "hay más positivos". Solo aparece con
      tres o más factores. Acierta siempre que la mayoría coincide con la
      paridad (tres negativos solos, por ejemplo).
    example: "(−1) · 2 · 3 = 6"

  - code: ENT-MUL-SUMA
    name: Suma los números que se multiplican
    nodo: NUM-ENT-MUL
    area: NUM
    origin: hipotesis
    description: >-
      Lee dos paréntesis seguidos, o un número pegado a un paréntesis,
      como suma: (−4)(3) = −1. En situaciones que se repiten (baja 3 pisos
      por minuto durante 4 minutos) junta los datos sumando en vez de
      multiplicar. Solo se usa en ítems escritos sin punto de
      multiplicación o en contexto: con "·" a la vista la regla no se
      activa.
    example: "(−4)(3) = −1"

  - code: ENT-MUL-DIVCERO
    name: Confunde dividir el cero con dividir por cero
    nodo: NUM-ENT-MUL
    area: NUM
    origin: hipotesis
    description: >-
      Cree que a ÷ 0 = 0, o al revés, que 0 ÷ a no está definido. Es una
      sola regla mal ubicada: sabe que "con el cero hay un problema" pero
      no dónde. Se separa de CERONEUTRO porque solo aparece en divisiones.
      Se mantiene como una sola misconception porque ningún ítem de
      opción múltiple separa las dos direcciones sin que una de ellas
      coincida con la correcta.
    example: "(−8) ÷ 0 = 0"

  - code: ENT-MUL-CERONEUTRO
    name: Trata el cero como si no cambiara el producto
    nodo: NUM-ENT-MUL
    area: NUM
    origin: hipotesis
    description: >-
      Se salta el factor 0, como si fuera el 1: (−5) · 0 · (−2) = 10 y
      9 · 0 = 9. Confunde el neutro de la multiplicación (1) con el de la
      suma (0). Solo aparece en productos: en divisiones con cero se
      etiqueta DIVCERO.
    example: "(−5) · 0 · (−2) = 10"

  - code: ENT-MUL-INVERSA
    name: Multiplica cuando corresponde dividir
    nodo: NUM-ENT-MUL
    area: NUM
    origin: hipotesis
    description: >-
      Usa la operación directa donde hace falta la inversa: para hallar el
      factor que falta (? · (−5) = −35) multiplica −35 · (−5), y al
      repartir una cantidad en partes iguales la multiplica por el número
      de partes. También al revés: reparte cuando la situación repite.
      Acierta el signo o no, según los números; lo que la delata es el
      tamaño del resultado.
    example: "? · (−5) = −35  →  175"

  # --- NUM-ENT-PRIOR --------------------------------------------------
  # Propuestas para LES-NUM-ENT-04 (27 sep 2026), sin control 1.
  # "Sumas antes que restas" ya existe: es ENT-ADI-RESTAGRUPA, y los
  # ítems de PRIOR la usan como distractor cruzado.
  #
  # Colisiones conocidas:
  #   SIGNOPAR y IZQDER dan lo mismo en a − (b − c) cuando IZQDER ignora
  #   el paréntesis: esos ítems se etiquetan SIGNOPAR.
  #   IZQDER acierta en cadenas donde la izquierda ya es la prioridad
  #   (a · b + c, a ÷ b · c): ahí solo cabe MULTDIV.

  - code: ENT-PRIOR-IZQDER
    name: Calcula de izquierda a derecha sin mirar la prioridad
    nodo: NUM-ENT-PRIOR
    area: NUM
    origin: hipotesis
    description: >-
      Opera en el orden en que lee: en 5 + 3 · (−2) suma primero y obtiene
      8 · (−2) = −16. Trata la expresión como si cada operación encerrara
      entre paréntesis todo lo anterior. Es la misconception central del
      nodo. Solo se ve cuando una suma o resta aparece antes que una
      multiplicación o división.
    example: "5 + 3 · (−2) = −16"

  - code: ENT-PRIOR-MULTDIV
    name: Multiplica antes de dividir
    nodo: NUM-ENT-PRIOR
    area: NUM
    origin: hipotesis
    description: >-
      Lee la regla como una lista ordenada (primero multiplicar, después
      dividir) en vez de "multiplicación y división al mismo nivel, de
      izquierda a derecha": 24 ÷ 4 · 2 = 24 ÷ 8 = 3. Se separa de IZQDER
      porque en una cadena de solo · y ÷ IZQDER acierta. El análogo con
      sumas y restas es ENT-ADI-RESTAGRUPA.
    example: "24 ÷ 4 · 2 = 3"

  - code: ENT-PRIOR-SIGNOPAR
    name: El menos delante del paréntesis afecta solo al primer término
    nodo: NUM-ENT-PRIOR
    area: NUM
    origin: hipotesis
    description: >-
      Saca el paréntesis sin calcular adentro y el signo menos queda solo
      con el primer número: 10 − (4 − 9) = 10 − 4 − 9 = −3. Es la versión
      numérica de EXP-ADI-SIGNOPAR (álgebra); PRIOR no es ancestro de
      ALG-EXP-ADI, por eso son dos entradas.
    example: "10 − (4 − 9) = −3"

  - code: ENT-PRIOR-PARCIAL
    name: El número de afuera multiplica solo al primer término
    nodo: NUM-ENT-PRIOR
    area: NUM
    origin: hipotesis
    description: >-
      En a(b − c) multiplica a solo por b: 3(4 − 6) = 12 − 6 = 6. Deja el
      resto del paréntesis sin multiplicar. Se separa de ENT-MUL-SUMA
      (que lee a(b − c) como a + (b − c)) porque PARCIAL sí multiplica.
    example: "3(4 − 6) = 6"

  - code: ENT-PRIOR-RAYA
    name: La raya de fracción divide solo el término más cercano
    nodo: NUM-ENT-PRIOR
    area: NUM
    origin: hipotesis
    description: >-
      No ve la raya de fracción como agrupación: en (−12 + 4)/(−2) divide
      solo el 4 y obtiene −12 − 2 = −14. Aplica la prioridad de la
      división como si la expresión estuviera escrita en una línea sin
      paréntesis.
    example: "(−12 + 4)/(−2) = −14"

  # --- NUM-ENT-DIVIS --------------------------------------------------
  # Propuestas para LES-NUM-ENT-05 (27 sep 2026), sin control 1.
  # DIVIS es `pre` y su único ancestro con contenido es MUL: casi no hay
  # errores de otros nodos que sirvan de distractor, así que los ítems
  # usan mucho el formato de afirmación.
  #
  # Colisiones conocidas:
  #   IMPARPRIMO y ULTCIFRA coinciden en impares compuestos que no
  #   terminan en 3, 6 o 9 (51, 57, 87): los dos los creen primos. Los
  #   ítems que las usan juntas ponen a ULTCIFRA sobre un primo que
  #   termina en 3 (53, 83), que IMPARPRIMO acierta.
  #   CRITERIO y ULTCIFRA coinciden en pares que terminan en 6 cuando se
  #   pregunta por el 6 (46, 76): se etiqueta ULTCIFRA y el distractor de
  #   CRITERIO se busca impar y divisible por 3.

  - code: ENT-DIVIS-INVIERTE
    name: Confunde múltiplo con divisor
    nodo: NUM-ENT-DIVIS
    area: NUM
    origin: hipotesis
    description: >-
      Invierte la relación: lista múltiplos cuando le piden divisores (o
      al revés), dice que 24 es divisor de 6, o lee "divisible por 9" como
      "divisor de 9". Es la misconception central del nodo. Una señal: un
      "divisor" mayor que el número.
    example: "divisores de 6: 6, 12, 18, 24"

  - code: ENT-DIVIS-UNO
    name: Clasifica el 1 como primo o como compuesto
    nodo: NUM-ENT-DIVIS
    area: NUM
    origin: hipotesis
    description: >-
      No sabe que el 1 no es primo ni compuesto. Casi siempre lo pone entre
      los primos ("tiene como divisores al 1 y a sí mismo") y lo incluye en
      descomposiciones (1 · 2 · 3 · 5).
    example: "1 es primo"

  - code: ENT-DIVIS-IMPARPRIMO
    name: Confunde primo con impar
    nodo: NUM-ENT-DIVIS
    area: NUM
    origin: hipotesis
    description: >-
      Usa "impar" como si fuera "primo": 21, 27 o 35 le parecen primos, y
      el 2 no, porque es par. Se separa de ULTCIFRA con un primo que
      termina en 3 (IMPARPRIMO acierta) y con el 2.
    example: "21 es primo; 2 no es primo"

  - code: ENT-DIVIS-ULTCIFRA
    name: Aplica al 3 y al 9 un criterio de última cifra
    nodo: NUM-ENT-DIVIS
    area: NUM
    origin: hipotesis
    description: >-
      Generaliza el criterio del 2, del 5 y del 10 (mirar la última cifra)
      a divisores que no lo tienen: 43 es divisible por 3 porque termina en
      3; 139 por 9 porque termina en 9; 87 no es divisible por 3 porque
      termina en 7. También cuenta "los múltiplos de 7" como los que
      terminan en 7.
    example: "43 es divisible por 3"

  - code: ENT-DIVIS-CRITERIO
    name: Usa el criterio de un divisor más chico como suficiente
    nodo: NUM-ENT-DIVIS
    area: NUM
    origin: hipotesis
    description: >-
      Comprueba solo una parte: divisible por 3 le basta para el 9, ser par
      le basta para el 4 o para el 6, y "par y divisible por 3" le basta
      para el 18. Conoce los criterios; lo que falla es qué divisor
      certifica cada uno.
    example: "57 es divisible por 9 (5 + 7 = 12)"

  - code: ENT-DIVIS-EXTREMOS
    name: Deja fuera el 1 y el propio número
    nodo: NUM-ENT-DIVIS
    area: NUM
    origin: hipotesis
    description: >-
      Al listar o contar divisores omite el 1 y el número mismo ("esos no
      cuentan"), y a veces cree que un número no es múltiplo de sí mismo.
      Divisores de 20: 2, 4, 5, 10. Se separa de SOLOPRIMOS porque sí
      incluye los divisores compuestos.
    example: "divisores de 20: 2, 4, 5, 10"

  - code: ENT-DIVIS-SOLOPRIMOS
    name: Cree que los divisores de un número son sus factores primos
    nodo: NUM-ENT-DIVIS
    area: NUM
    origin: hipotesis
    description: >-
      Confunde "divisores" con "factores primos": los divisores de 20 son
      2 y 5; 6 no divide a 90 porque no es primo. Al descomponer escribe
      cada primo una sola vez (60 = 2 · 3 · 5).
    example: "divisores de 20: 2 y 5"

  - code: ENT-DIVIS-COMPUESTO
    name: Deja factores compuestos en la descomposición
    nodo: NUM-ENT-DIVIS
    area: NUM
    origin: hipotesis
    description: >-
      Se detiene en un producto correcto pero con factores que no son
      primos: 60 = 4 · 15, 126 = 2 · 9 · 7. Sabe que hay que "partir" el
      número, no que la descomposición termina cuando todos los factores
      son primos.
    example: "60 = 4 · 15"

  # --- NUM-ENT-MCM ----------------------------------------------------
  # Propuestas para LES-NUM-ENT-05 (27 sep 2026), sin control 1.
  #
  # Colisiones conocidas:
  #   CAMBIA en un cálculo (da el MCD cuando piden mcm) y CAMBIA en un
  #   problema (usa el MCD donde corresponde el mcm) dan el mismo número:
  #   por eso son una sola misconception.
  #   SOLOCOMUN coincide con el mcm cuando todos los primos son comunes
  #   (12 y 18), y con el MCD cuando los comunes aparecen con la misma
  #   repetición (6 y 10): se usa con pares como 8 y 12, 9 y 12, 20 y 30.
  #   MAYOR acierta cuando un número divide al otro: esos ítems no la usan.

  - code: ENT-MCM-CAMBIA
    name: Intercambia mcm y MCD
    nodo: NUM-ENT-MCM
    area: NUM
    origin: hipotesis
    description: >-
      Da el MCD cuando le piden el mcm (o al revés), o en un problema usa
      el que no corresponde: para saber cuándo coinciden dos buses usa el
      MCD. Es la misconception central del nodo. La delata el tamaño: un
      mcm menor que los números o un MCD mayor.
    example: "mcm(8, 12) = 4"

  - code: ENT-MCM-PRODUCTO
    name: Cree que el mcm es el producto de los números
    nodo: NUM-ENT-MCM
    area: NUM
    origin: hipotesis
    description: >-
      Multiplica los números: mcm(8, 12) = 96. El producto siempre es
      múltiplo común, por eso la regla "funciona" con primos entre sí y
      se refuerza. Por descomposición aparece como juntar todos los
      factores de los dos sin quitar los repetidos.
    example: "mcm(8, 12) = 96"

  - code: ENT-MCM-SUMA
    name: Suma los períodos para saber cuándo coinciden
    nodo: NUM-ENT-MCM
    area: NUM
    origin: hipotesis
    description: >-
      En problemas de cosas que se repiten, suma los períodos: buses cada 6
      y cada 10 minutos coinciden a los 16. Trata "juntar dos ciclos" como
      juntar dos cantidades. Solo aparece en contexto o con números
      pequeños.
    example: "cada 6 y cada 10 minutos: coinciden a los 16"

  - code: ENT-MCM-MAYOR
    name: Toma el mayor como mcm o el menor como MCD
    nodo: NUM-ENT-MCM
    area: NUM
    origin: hipotesis
    description: >-
      Da como mcm el mayor de los números y como MCD el menor, sin
      comprobar que uno sea múltiplo o divisor del otro. Acierta cuando uno
      divide al otro (mcm(4, 12) = 12), y por eso se sostiene.
    example: "mcm(6, 10) = 10"

  - code: ENT-MCM-SOLOCOMUN
    name: Para el mcm usa solo los factores comunes
    nodo: NUM-ENT-MCM
    area: NUM
    origin: hipotesis
    description: >-
      Mezcla las dos reglas de la descomposición: para el mcm toma los
      factores comunes (con su mayor repetición) y deja fuera los que no
      comparten. 8 = 2 · 2 · 2 y 12 = 2 · 2 · 3 dan 8. Solo se ve por
      descomposición o con números que la vuelven distinta del mcm y del
      MCD.
    example: "mcm(8, 12) = 8"

  - code: ENT-MCM-PRIMERCOMUN
    name: Da como MCD el primer divisor común que encuentra
    nodo: NUM-ENT-MCM
    area: NUM
    origin: hipotesis
    description: >-
      Lee "común divisor" y se detiene en el primero mayor que 1 (casi
      siempre 2 o 3), sin buscar el mayor: MCD(12, 18) = 2. Por
      descomposición aparece como elegir un solo factor común en vez de
      multiplicarlos todos. Es el espejo de lo que en el mcm sí funciona
      (el primer múltiplo común es el mínimo).
    example: "MCD(12, 18) = 2"

  # --- NUM-ENT-ABS ----------------------------------------------------
  # Aprobadas por Ben en el control 1 de LES-NUM-ENT-07 (26 sep 2026).
  # Todas vistas en aula. DISTRIB y QUITASIGNO entraron el 27 sep, al
  # agregar la arista ADI -> ABS: con ella los ítems operan dentro de las
  # barras.
  #
  # Colisiones conocidas:
  #   PARENT y UNASOL dan lo mismo en |x| = a con a > 0 (x = a): esos
  #   ítems no usan PARENT.
  #   SIGNOFUERA coincide con PARENT en -|negativo| y con CAMBIA en
  #   -|positivo|: SIGNOFUERA va en comparaciones y afirmaciones, no en
  #   "calcula -|x|".
  #   DISTRIB coincide con PARENT en |a - b| con 0 < a < b (las dos dan
  #   a - b), y con QUITASIGNO en |a + b| con signos distintos.
  #   Con ENT-ADI-MAGNOP coincide en |-a - b| después de tomar el valor
  #   absoluto: esos ítems ponen como alternativa el valor sin barras.

  - code: ENT-ABS-CAMBIA
    name: Cree que el valor absoluto cambia el signo
    nodo: NUM-ENT-ABS
    area: NUM
    origin: docente
    description: >-
      Generaliza el ejemplo |-3| = 3 como "el valor absoluto le cambia el
      signo al número" y lo aplica también a los positivos: |5| = -5. Con
      negativos acierta, así que solo se ve con positivos. En |x| = a se
      queda con x = -a. Se separa de ENT-ABS-PARENT con |5| (CAMBIA da -5,
      PARENT da 5).
    example: "|5| = -5"

  - code: ENT-ABS-PARENT
    name: Lee las barras como si fueran paréntesis
    nodo: NUM-ENT-ABS
    area: NUM
    origin: docente
    description: >-
      Las barras no le hacen nada al número: |-5| = -5. Al comparar
      valores absolutos compara los números mismos (|-8| < |5| porque
      -8 < 5), y en |x| <= a acepta todos los enteros menores o iguales
      que a. Con positivos acierta, así que solo se ve con negativos.
    example: "|-5| = -5"

  - code: ENT-ABS-SIGNOFUERA
    name: Cree que las barras también borran el signo de afuera
    nodo: NUM-ENT-ABS
    area: NUM
    origin: docente
    description: >-
      Aprende que "el valor absoluto siempre es positivo" y lo extiende al
      signo menos que está fuera de las barras: -|-6| = 6 y -|4| = 4. Se
      separa de ENT-ABS-CAMBIA y ENT-ABS-PARENT con -|4|: las dos dan -4 y
      SIGNOFUERA da 4.
    example: "-|-6| = 6"

  - code: ENT-ABS-UNASOL
    name: Considera solo el lado positivo del 0
    nodo: NUM-ENT-ABS
    area: NUM
    origin: docente
    description: >-
      Lee |x| como "el número sin signo" y al devolverse se queda solo con
      los no negativos: |x| = 5 tiene solo la solución 5, y los enteros con
      |x| <= 3 son 0, 1, 2 y 3. Olvida que a la misma distancia del 0 hay
      un número a cada lado. Coincide con ENT-ABS-PARENT en |x| = a con
      a > 0; se separa en |x| <= a (PARENT acepta infinitos).
    example: "|x| = 5  =>  x = 5"

  - code: ENT-ABS-NEGSOL
    name: Busca números cuyo valor absoluto sea negativo
    nodo: NUM-ENT-ABS
    area: NUM
    origin: docente
    description: >-
      Busca los números que cumplen |x| = -4 igual que si fuera |x| = 4
      y responde 4 y -4, sin notar que una distancia no puede ser
      negativa.
      Solo se ve cuando el valor absoluto se iguala o se compara con un
      negativo; con a > 0 no falla.
    example: "|x| = -4  =>  x = 4 o x = -4"

  - code: ENT-ABS-DISTTAM
    name: Calcula la distancia restando las distancias al 0
    nodo: NUM-ENT-ABS
    area: NUM
    origin: docente
    description: >-
      Para la distancia entre dos enteros resta sus valores absolutos,
      sin mirar si están al mismo lado del 0. Acierta cuando están al
      mismo lado (-3 y -8: 5) y falla cuando el 0 queda entre ellos
      (-3 y 5: da 2, son 8). En el cálculo 5 - (-3) coincide con
      ENT-ADI-DOBLENEG: los ítems de este nodo no escriben esa resta.
    example: "distancia entre -3 y 5 = 2"

  - code: ENT-ABS-SALTOS
    name: Cuenta la distancia en vez de los enteros
    nodo: NUM-ENT-ABS
    area: NUM
    origin: docente
    description: >-
      Para contar los enteros con |x| <= a mide cuánto hay del menor al
      mayor (2a) en vez de contar los números (2a + 1): pierde uno, que
      suele ser el 0. Es el error inverso de ENT-REC-CONTEO, que cuenta
      números cuando debería contar saltos. Solo aparece en ítems de
      conteo.
    example: "enteros con |x| <= 3: cuenta 6 (son 7)"

  - code: ENT-ABS-DISTRIB
    name: Saca el valor absoluto de cada término por separado
    nodo: NUM-ENT-ABS
    area: NUM
    origin: docente
    description: >-
      Trata las barras como un factor que se reparte: |a - b| lo calcula
      como |a| - |b| y |a + b| como |a| + |b|, conservando la operación de
      adentro. Puede dar un resultado negativo (|3 - 8| = -5) o uno
      demasiado grande (|-9 + 2| = 11). Se separa de ENT-ABS-PARENT con
      |-2 - 6| (DISTRIB da -4, PARENT da -8) y de ENT-ABS-QUITASIGNO con
      |3 - 8| (DISTRIB da -5, QUITASIGNO da 11).
    example: "|3 - 8| = |3| - |8| = -5"

  - code: ENT-ABS-QUITASIGNO
    name: Borra todos los signos de adentro y suma
    nodo: NUM-ENT-ABS
    area: NUM
    origin: docente
    description: >-
      Lee "el valor absoluto deja todo positivo" como "borra todos los
      signos menos que hay adentro", incluido el de la operación: |3 - 8|
      queda 3 + 8 = 11 y |b - a| queda b + a. Acierta cuando los dos
      términos ya se alejaban del 0 hacia el mismo lado (|-2 - 6| = 8), así
      que solo se ve cuando adentro hay una resta que acerca al 0.
    example: "|3 - 8| = 3 + 8 = 11"
