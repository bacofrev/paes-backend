# =====================================================================
# Catálogo de misconceptions — unidad NUM-ENT
# =====================================================================
# Fuente única de la unidad. Las clases NO declaran misconceptions:
# solo referencian códigos, y el cargador falla si el código no existe
# acá.
#
# origin — de dónde salió el error:
#   demre      observado en ítems oficiales o clavijero DEMRE
#   docente    reportado por alguien que hace clases
#   hipotesis  plausible, sin evidencia todavía
#
# Estado: NUM-ENT-REC, NUM-ENT-ADI y NUM-ENT-ABS. MUL y el resto se
# agregan al llegar a su clase.
#
# NUM-ENT-REC es raíz del grafo: no hay nodo debajo al que bajar al
# estudiante. Las remediaciones de estos errores deben sostenerse solas.
# ---------------------------------------------------------------------

unit: NUM-ENT

misconceptions:

  # --- NUM-ENT-REC ----------------------------------------------------

  - code: ENT-REC-MAGN
    name: Compara negativos por su magnitud
    nodo: NUM-ENT-REC
    area: NUM
    origin: docente
    description: >-
      Entre dos negativos elige como mayor el de mayor número "visible".
      Traslada el orden de los naturales a los negativos sin invertirlo:
      como 7 > 3, concluye que -7 > -3. Es el error central del nodo y
      debe aparecer como distractor en la mayoría de los ítems de
      comparación.
    example: "-7 > -3"

  - code: ENT-REC-SINSIGNO
    name: Ignora el signo al comparar negativo con positivo
    nodo: NUM-ENT-REC
    area: NUM
    origin: docente
    description: >-
      Compara un negativo con un positivo mirando solo los dígitos. Se
      registra separado de ENT-REC-MAGN a propósito: MAGN ocurre entre dos
      negativos y este cruza el cero. Un estudiante puede ordenar bien
      -7 < -3 y aun así decir que -8 > 5.
    example: "-8 > 5"

  - code: ENT-REC-CERO
    name: Cree que 0 es el menor de los enteros
    nodo: NUM-ENT-REC
    area: NUM
    origin: docente
    description: >-
      Arrastra la idea de los naturales de que el 0 es el piso: "no hay
      nada menos que cero". Ubica los negativos por encima del 0 o los
      trata como mayores que él.
    example: "0 < -2"

  - code: ENT-REC-SUCESOR
    name: Invierte antecesor y sucesor con negativos
    nodo: NUM-ENT-REC
    area: NUM
    origin: docente
    description: >-
      Para el sucesor de un negativo se aleja del 0 en vez de moverse a la
      derecha. Usa "sucesor = el número que sigue al leer" (4, 5, 6...) y
      lo aplica a la magnitud. Con positivos no se nota, solo aparece con
      negativos.
    example: "sucesor de -4 = -5"

  - code: ENT-REC-ESCALA
    name: Lee cada marca de la recta como una unidad
    nodo: NUM-ENT-REC
    area: NUM
    origin: hipotesis
    description: >-
      En una recta cuya escala no es 1 (de 2 en 2, de 5 en 5), cuenta
      marcas en vez de leer su valor: asigna 1, 2, 3... a las marcas
      sucesivas aunque cada una valga más. Sin observación en aula; se
      mantiene porque la PAES usa rectas con escala.
    example: "escala de 2 en 2 desde 0: lee la 3ª marca como 3 (vale 6)"

  - code: ENT-REC-CONTEO
    name: Cuenta el punto de partida al medir en la recta
    nodo: NUM-ENT-REC
    area: NUM
    origin: docente
    description: >-
      Al contar cuántas unidades hay entre dos enteros cuenta los números
      (incluyendo el de partida) en vez de los saltos. Da siempre una
      unidad de más. Es más frecuente cuando el recorrido cruza el cero.
    example: "de -2 a 3 cuenta 6 unidades (son 5)"

  - code: ENT-REC-CTXSIGNO
    name: Asigna mal el signo en un contexto
    nodo: NUM-ENT-REC
    area: NUM
    origin: docente
    description: >-
      Traduce mal una situación a entero: "bajo el nivel del mar", "bajo
      cero", "deuda" o "retroceso" quedan como positivos. Después compara
      bien, pero sobre números con el signo equivocado.
    example: "5 m bajo el nivel del mar = +5"

  - code: ENT-REC-DIRECCION
    name: Invierte izquierda y derecha al moverse en la recta
    nodo: NUM-ENT-REC
    area: NUM
    origin: docente
    description: >-
      Al desplazarse en la recta se mueve hacia el lado contrario: trata
      "a la izquierda" como aumentar. A diferencia de ENT-REC-SUCESOR,
      ocurre también con puros positivos ("3 a la izquierda de 5" = 8), y
      a diferencia de ENT-REC-SINSIGNO no tiene que ver con comparar sino
      con moverse. Con negativos y sucesor/antecesor da la misma
      respuesta que SUCESOR; los ítems que buscan distinguirlos usan
      desplazamientos, no sucesores.
    example: "3 unidades a la izquierda de 1 = 4"

  # --- NUM-ENT-ADI ----------------------------------------------------
  # Aprobadas por Ben en el control 1 de LES-NUM-ENT-02 (25 sep 2026),
  # todas vistas en aula. Se descartó ENT-ADI-SIGNOPRIM ("pone el signo
  # del primer término"): sin evidencia de que sea una regla estable y no
  # un descuido.

  - code: ENT-ADI-REGLAMUL
    name: Aplica la regla de signos de la multiplicación a la suma
    nodo: NUM-ENT-ADI
    area: NUM
    origin: docente
    description: >-
      Lleva "menos con menos da más" a la suma y la resta: dos negativos
      que se suman o un negativo al que se le resta un positivo le dan
      resultado positivo. Es el único error del nodo que produce un
      positivo a partir de dos cantidades negativas, y se vuelve más
      frecuente después de ver ENT-MUL.
    example: "-3 - 5 = 8"

  - code: ENT-ADI-MAGNOP
    name: Decide sumar o restar por el símbolo de la operación
    nodo: NUM-ENT-ADI
    area: NUM
    origin: docente
    description: >-
      Mira el símbolo de la operación y no los signos de los números: si
      ve "+" suma los tamaños, si ve "-" los resta, y deja el signo del
      negativo que aparece. Se separa de ENT-ADI-INVIERTE con -7 + 3
      (MAGNOP da -10, INVIERTE da 4) y de ENT-ADI-DOBLENEG con 5 - (-3)
      (MAGNOP da -2, DOBLENEG da 2). En 3 - 7, sin negativos a la vista,
      coincide con INVIERTE: ahí se etiqueta INVIERTE. En una cadena
      a - b + c con a < b coincide con ENT-ADI-RESTAGRUPA: esos ítems no
      usan las dos.
    example: "-7 + 3 = -10"

  - code: ENT-ADI-INVIERTE
    name: Resta el mayor menos el menor y deja el resultado positivo
    nodo: NUM-ENT-ADI
    area: NUM
    origin: docente
    description: >-
      Arrastra de los naturales que "no se puede quitar 7 a 3": da vuelta
      la resta como si fuera conmutativa y el resultado queda positivo.
      También aparece en sumas con signos distintos, donde resta bien los
      tamaños pero no pone el signo del que tiene mayor tamaño.
    example: "3 - 7 = 4"

  - code: ENT-ADI-DOBLENEG
    name: Ignora que está restando un negativo
    nodo: NUM-ENT-ADI
    area: NUM
    origin: docente
    description: >-
      Lee a - (-b) como a - b: el signo del número que se resta desaparece
      y no se transforma en suma. Un estudiante con solo este error
      resuelve bien -7 + 3; falla únicamente cuando se resta un negativo,
      incluidas las diferencias en contexto que cruzan el cero (máxima 4,
      mínima -6: da 2).
    example: "5 - (-3) = 2"

  - code: ENT-ADI-RESTAGRUPA
    name: Aplica el signo menos a todo lo que viene después
    nodo: NUM-ENT-ADI
    area: NUM
    origin: docente
    description: >-
      En una cadena de sumas y restas trata el primer "-" como si
      encerrara el resto entre paréntesis: 10 - 3 + 2 lo calcula como
      10 - (3 + 2). Solo aparece con tres o más términos. Borde con
      ENT-PRIOR: se queda en ADI porque la cadena es solo de sumas y
      restas.
    example: "10 - 3 + 2 = 5"

  - code: ENT-ADI-VARORDEN
    name: Calcula la variación como inicial menos final
    nodo: NUM-ENT-ADI
    area: NUM
    origin: docente
    description: >-
      Invierte el orden de la resta al calcular una variación o un cambio:
      hace inicial - final en vez de final - inicial. Acierta el tamaño y
      falla el signo, así que una subida queda como bajada. Solo aparece
      en ítems de variación.
    example: "de -3 °C a 5 °C: variación -8"

  # --- NUM-ENT-ABS ----------------------------------------------------
  # Aprobadas por Ben en el control 1 de LES-NUM-ENT-07 (26 sep 2026).
  # Las siete primeras, vistas en aula. DISTRIB y QUITASIGNO entraron el
  # 27 sep, al agregar la arista ADI -> ABS: con ella los ítems operan
  # dentro de las barras.
  #
  # Colisiones conocidas:
  #   PARENT y UNASOL dan lo mismo en |x| = a con a > 0 (x = a): esos
  #   ítems no usan PARENT.
  #   SIGNOFUERA coincide con PARENT en -|negativo| y con CAMBIA en
  #   -|positivo|: SIGNOFUERA va en comparaciones y afirmaciones, no en
  #   "calcula -|x|".
  #   DISTRIB coincide con PARENT en |a - b| con 0 < a < b (las dos dan
  #   a - b), y con QUITASIGNO en |a + b| con signos distintos.
  #   Con ENT-ADI-MAGNOP coincide en |-a - b| después de tomar el valor
  #   absoluto: esos ítems ponen como alternativa el valor sin barras.

  - code: ENT-ABS-CAMBIA
    name: Cree que el valor absoluto cambia el signo
    nodo: NUM-ENT-ABS
    area: NUM
    origin: docente
    description: >-
      Generaliza el ejemplo |-3| = 3 como "el valor absoluto le cambia el
      signo al número" y lo aplica también a los positivos: |5| = -5. Con
      negativos acierta, así que solo se ve con positivos. En |x| = a se
      queda con x = -a. Se separa de ENT-ABS-PARENT con |5| (CAMBIA da -5,
      PARENT da 5).
    example: "|5| = -5"

  - code: ENT-ABS-PARENT
    name: Lee las barras como si fueran paréntesis
    nodo: NUM-ENT-ABS
    area: NUM
    origin: docente
    description: >-
      Las barras no le hacen nada al número: |-5| = -5. Al comparar
      valores absolutos compara los números mismos (|-8| < |5| porque
      -8 < 5), y en |x| <= a acepta todos los enteros menores o iguales
      que a. Con positivos acierta, así que solo se ve con negativos.
    example: "|-5| = -5"

  - code: ENT-ABS-SIGNOFUERA
    name: Cree que las barras también borran el signo de afuera
    nodo: NUM-ENT-ABS
    area: NUM
    origin: docente
    description: >-
      Aprende que "el valor absoluto siempre es positivo" y lo extiende al
      signo menos que está fuera de las barras: -|-6| = 6 y -|4| = 4. Se
      separa de ENT-ABS-CAMBIA y ENT-ABS-PARENT con -|4|: las dos dan -4 y
      SIGNOFUERA da 4.
    example: "-|-6| = 6"

  - code: ENT-ABS-UNASOL
    name: Considera solo el lado positivo del 0
    nodo: NUM-ENT-ABS
    area: NUM
    origin: docente
    description: >-
      Lee |x| como "el número sin signo" y al devolverse se queda solo con
      los no negativos: |x| = 5 tiene solo la solución 5, y los enteros con
      |x| <= 3 son 0, 1, 2 y 3. Olvida que a la misma distancia del 0 hay
      un número a cada lado. Coincide con ENT-ABS-PARENT en |x| = a con
      a > 0; se separa en |x| <= a (PARENT acepta infinitos).
    example: "|x| = 5  =>  x = 5"

  - code: ENT-ABS-NEGSOL
    name: Busca números cuyo valor absoluto sea negativo
    nodo: NUM-ENT-ABS
    area: NUM
    origin: docente
    description: >-
      Busca los números que cumplen |x| = -4 igual que si fuera |x| = 4
      y responde 4 y -4, sin notar que una distancia no puede ser
      negativa.
      Solo se ve cuando el valor absoluto se iguala o se compara con un
      negativo; con a > 0 no falla.
    example: "|x| = -4  =>  x = 4 o x = -4"

  - code: ENT-ABS-DISTTAM
    name: Calcula la distancia restando las distancias al 0
    nodo: NUM-ENT-ABS
    area: NUM
    origin: docente
    description: >-
      Para la distancia entre dos enteros resta sus valores absolutos,
      sin mirar si están al mismo lado del 0. Acierta cuando están al
      mismo lado (-3 y -8: 5) y falla cuando el 0 queda entre ellos
      (-3 y 5: da 2, son 8). En el cálculo 5 - (-3) coincide con
      ENT-ADI-DOBLENEG: los ítems de este nodo no escriben esa resta.
    example: "distancia entre -3 y 5 = 2"

  - code: ENT-ABS-SALTOS
    name: Cuenta la distancia en vez de los enteros
    nodo: NUM-ENT-ABS
    area: NUM
    origin: docente
    description: >-
      Para contar los enteros con |x| <= a mide cuánto hay del menor al
      mayor (2a) en vez de contar los números (2a + 1): pierde uno, que
      suele ser el 0. Es el error inverso de ENT-REC-CONTEO, que cuenta
      números cuando debería contar saltos. Solo aparece en ítems de
      conteo.
    example: "enteros con |x| <= 3: cuenta 6 (son 7)"

  - code: ENT-ABS-DISTRIB
    name: Saca el valor absoluto de cada término por separado
    nodo: NUM-ENT-ABS
    area: NUM
    origin: hipotesis
    description: >-
      Trata las barras como un factor que se reparte: |a - b| lo calcula
      como |a| - |b| y |a + b| como |a| + |b|, conservando la operación de
      adentro. Puede dar un resultado negativo (|3 - 8| = -5) o uno
      demasiado grande (|-9 + 2| = 11). Se separa de ENT-ABS-PARENT con
      |-2 - 6| (DISTRIB da -4, PARENT da -8) y de ENT-ABS-QUITASIGNO con
      |3 - 8| (DISTRIB da -5, QUITASIGNO da 11).
    example: "|3 - 8| = |3| - |8| = -5"

  - code: ENT-ABS-QUITASIGNO
    name: Borra todos los signos de adentro y suma
    nodo: NUM-ENT-ABS
    area: NUM
    origin: hipotesis
    description: >-
      Lee "el valor absoluto deja todo positivo" como "borra todos los
      signos menos que hay adentro", incluido el de la operación: |3 - 8|
      queda 3 + 8 = 11 y |b - a| queda b + a. Acierta cuando los dos
      términos ya se alejaban del 0 hacia el mismo lado (|-2 - 6| = 8), así
      que solo se ve cuando adentro hay una resta que acerca al 0.
    example: "|3 - 8| = 3 + 8 = 11"
