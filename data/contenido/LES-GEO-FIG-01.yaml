# =====================================================================
# LES-GEO-FIG-01 — Figuras, sus elementos y su perímetro
# Cubre GEO-FIG-CLAS, GEO-FIG-ELEM, GEO-PER-POL
# =====================================================================
# CLAS es `pre` y raíz del grafo; ELEM y PER-POL cuelgan de CLAS (no hay
# arista entre ELEM y PER-POL: los dos piden solo CLAS). Primera clase del
# eje GEO.
#
# Alcance (propuesto, sin control 1):
#   CLAS   entra   triángulos por lados y por ángulos (ángulos dados o
#                  marcados); cuadriláteros: trapezoide, trapecio,
#                  paralelogramo, romboide, rectángulo, rombo, cuadrado y
#                  sus inclusiones; polígonos regulares y nombres por número
#                  de lados; la posición no cambia la figura.
#          fuera   suma de ángulos interiores (no hay nodo en el grafo:
#                  pregunta para Ben); congruencia y semejanza (GEO-SEM).
#   ELEM   entra   base y altura de triángulos y cuadriláteros (altura
#                  dentro, fuera y sobre un lado); apotema y radio de un
#                  polígono regular; diagonales: definición, desde un
#                  vértice (n − 3) y total n(n − 3)/2.
#          fuera   calcular alturas o apotemas (Pitágoras, GEO-PIT-*);
#                  medianas, bisectrices y simetrales como contenido propio
#                  (solo aparecen como distractor de la altura).
#   PER    entra   perímetro de polígonos con medidas dadas; lados iguales
#                  marcados; lados que faltan en figuras en L, U y escalera;
#                  figuras compuestas (sin contar el borde interior); lado a
#                  partir del perímetro; contexto de cercas y bordes.
#          fuera   unidades distintas en una misma figura (GEO-UNI-SUP);
#                  circunferencia (GEO-CIR-PER); área (GEO-ARE-*), salvo como
#                  distractor.
#
# Niveles:
#   1  un nombre, un elemento, un perímetro directo
#   2  figuras con datos implícitos, conteos de diagonales, I/II/III
#   3  afirmaciones generales, figuras compuestas, contexto de varios pasos
# ---------------------------------------------------------------------

unit: GEO-FIG

lesson:
  code: LES-GEO-FIG-01
  title: Figuras, sus elementos y su perímetro
  position: 1
  nodes:
    - node: GEO-FIG-CLAS
      anchor: clasificacion-de-figuras
    - node: GEO-FIG-ELEM
      anchor: altura-base-apotema-y-diagonal
    - node: GEO-PER-POL
      anchor: perimetro-de-poligonos


# ---------------------------------------------------------------------
# ITEMS
# ---------------------------------------------------------------------

items:

  # ===== GEO-FIG-CLAS · nivel 1 ================================

  # B EXCLUYE: nombres excluyentes
  # C REGULAR: basta con lados iguales
  # D PARALELOS: confunde los pares
  - code: M1-FIG-001
    node: GEO-FIG-CLAS
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuál de las siguientes afirmaciones es correcta?"
    options:
      - {label: A, body: "Todo cuadrado es un rectángulo.", correct: true}
      - {label: B, body: "Un cuadrado no puede ser un rectángulo, porque sus lados son iguales.", misconception: FIG-CLAS-EXCLUYE}
      - {label: C, body: "Todo rombo es un polígono regular.", misconception: FIG-CLAS-REGULAR}
      - {label: D, body: "Un trapecio tiene dos pares de lados paralelos.", misconception: FIG-CLAS-PARALELOS}

  # A PARALELOS: cuenta un solo par
  # B ORIENTA: la posición decide
  # C EXCLUYE: nombres excluyentes
  - code: M1-FIG-002
    node: GEO-FIG-CLAS
    pool: curated
    difficulty: 1
    source: propio
    figure: FIG-FIG-CLAS-01
    stem: >-
      ¿Cuál de las siguientes afirmaciones sobre la figura es correcta?
    options:
      - {label: A, body: "Es un trapecio, porque tiene un par de lados paralelos.", misconception: FIG-CLAS-PARALELOS}
      - {label: B, body: "Es un rombo, pero no un cuadrado, porque está girado.", misconception: FIG-CLAS-ORIENTA}
      - {label: C, body: "Es un cuadrado, así que no puede ser un rombo.", misconception: FIG-CLAS-EXCLUYE}
      - {label: D, body: "Es un cuadrado y también un rombo.", correct: true}

  # A EXCLUYE: nombres excluyentes
  # C NOMBRE: confunde escaleno con isósceles
  # D CRITERIOS: lados y ángulos se excluyen
  - code: M1-FIG-003
    node: GEO-FIG-CLAS
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuál de las siguientes afirmaciones es correcta?"
    options:
      - {label: A, body: "Un triángulo isósceles no puede tener sus tres lados iguales.", misconception: FIG-CLAS-EXCLUYE}
      - {label: B, body: "Un triángulo equilátero también es isósceles.", correct: true}
      - {label: C, body: "Un triángulo escaleno tiene dos lados iguales.", misconception: FIG-CLAS-NOMBRE}
      - {label: D, body: "Un triángulo rectángulo no puede ser isósceles.", misconception: FIG-CLAS-CRITERIOS}

  # A EXCLUYE: nombres excluyentes
  # B REGULAR: basta con ángulos iguales
  # D PARALELOS: tener lados paralelos le basta para trapecio
  - code: M1-FIG-004
    node: GEO-FIG-CLAS
    pool: curated
    difficulty: 1
    source: propio
    figure: FIG-FIG-CLAS-02
    stem: "¿Qué nombres le corresponden a la figura?"
    options:
      - {label: A, body: "Rectángulo, pero no paralelogramo.", misconception: FIG-CLAS-EXCLUYE}
      - {label: B, body: "Rectángulo y polígono regular.", misconception: FIG-CLAS-REGULAR}
      - {label: C, body: "Rectángulo y paralelogramo.", correct: true}
      - {label: D, body: "Rectángulo y trapecio.", misconception: FIG-CLAS-PARALELOS}

  # A REGULAR: basta con lados iguales
  # B NOMBRE: confunde isósceles con equilátero
  # C ORIENTA: la posición decide
  - code: M1-FIG-005
    node: GEO-FIG-CLAS
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuál de las siguientes figuras es un polígono regular?"
    options:
      - {label: A, body: "Un rombo que no es cuadrado.", misconception: FIG-CLAS-REGULAR}
      - {label: B, body: "Un triángulo isósceles que no es equilátero.", misconception: FIG-CLAS-NOMBRE}
      - {label: C, body: "Un cuadrado, pero solo si está apoyado sobre un lado.", misconception: FIG-CLAS-ORIENTA}
      - {label: D, body: "Un triángulo equilátero.", correct: true}

  # A NOMBRE: confunde los nombres
  # B PARALELOS: cambia trapecio por trapezoide
  # D ORIENTA: la posición decide
  - code: M1-FIG-006
    node: GEO-FIG-CLAS
    pool: curated
    difficulty: 1
    source: propio
    stem: >-
      Un cuadrilátero tiene exactamente un par de lados paralelos. ¿Cómo se
      llama?
    options:
      - {label: A, body: "Romboide", misconception: FIG-CLAS-NOMBRE}
      - {label: B, body: "Trapezoide", misconception: FIG-CLAS-PARALELOS}
      - {label: C, body: "Trapecio", correct: true}
      - {label: D, body: "Depende de si los lados paralelos están horizontales.", misconception: FIG-CLAS-ORIENTA}

  # B CRITERIOS: lados y ángulos se excluyen
  # C NOMBRE: confunde isósceles con escaleno
  # D ORIENTA: la posición decide
  - code: M1-FIG-007
    node: GEO-FIG-CLAS
    pool: curated
    difficulty: 1
    source: propio
    figure: FIG-FIG-CLAS-03
    stem: "¿Cómo se clasifica el triángulo de la figura?"
    options:
      - {label: A, body: "Es rectángulo e isósceles.", correct: true}
      - {label: B, body: "Es solo rectángulo: no puede ser isósceles también.", misconception: FIG-CLAS-CRITERIOS}
      - {label: C, body: "Es rectángulo y escaleno.", misconception: FIG-CLAS-NOMBRE}
      - {label: D, body: "Es isósceles, pero no rectángulo, porque el ángulo recto no está abajo.", misconception: FIG-CLAS-ORIENTA}

  # A REGULAR: lados iguales ⇒ regular
  # C EXCLUYE: nombres excluyentes
  # D PARALELOS: confunde los pares
  - code: M1-FIG-008
    node: GEO-FIG-CLAS
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuál de las siguientes afirmaciones es correcta?"
    options:
      - {label: A, body: "Todo rombo tiene sus cuatro ángulos iguales, porque sus lados son iguales.", misconception: FIG-CLAS-REGULAR}
      - {label: B, body: "Todo cuadrado es un rombo.", correct: true}
      - {label: C, body: "Un rombo y un cuadrado nunca son la misma figura.", misconception: FIG-CLAS-EXCLUYE}
      - {label: D, body: "Un rombo tiene un solo par de lados paralelos.", misconception: FIG-CLAS-PARALELOS}

  # ===== GEO-FIG-CLAS · nivel 2 ================================

  # A EXCLUYE: rechaza I
  # B CRITERIOS: rechaza II
  # C PARALELOS: acepta III
  - code: M1-FIG-009
    node: GEO-FIG-CLAS
    pool: curated
    difficulty: 2
    source: propio
    stem: |-
      Considera las siguientes afirmaciones:

      I. Todo rectángulo es un paralelogramo.

      II. Un triángulo rectángulo puede ser isósceles.

      III. Un trapecio tiene dos pares de lados paralelos.

      ¿Cuál o cuáles son correctas?
    options:
      - {label: A, body: "Solo II", misconception: FIG-CLAS-EXCLUYE}
      - {label: B, body: "Solo I", misconception: FIG-CLAS-CRITERIOS}
      - {label: C, body: "I, II y III", misconception: FIG-CLAS-PARALELOS}
      - {label: D, body: "Solo I y II", correct: true}

  # B NOMBRE: confunde trapecio con trapezoide
  # C PARALELOS: un paralelogramo: tener lados paralelos le basta
  # D ORIENTA: base horizontal, «parece» trapecio
  - code: M1-FIG-010
    node: GEO-FIG-CLAS
    pool: curated
    difficulty: 2
    source: propio
    figure: FIG-FIG-CLAS-04
    stem: "¿Cuál de los cuadriláteros de la figura es un trapecio?"
    options:
      - {label: A, body: "El cuadrilátero C", correct: true}
      - {label: B, body: "El cuadrilátero D", misconception: FIG-CLAS-NOMBRE}
      - {label: C, body: "El cuadrilátero A", misconception: FIG-CLAS-PARALELOS}
      - {label: D, body: "El cuadrilátero B", misconception: FIG-CLAS-ORIENTA}

  # A REGULAR: lados iguales le bastan
  # B EXCLUYE: nombres excluyentes
  # D NOMBRE: confunde rombo con romboide
  - code: M1-FIG-011
    node: GEO-FIG-CLAS
    pool: curated
    difficulty: 2
    source: propio
    stem: >-
      Un paralelogramo tiene sus cuatro lados iguales y uno de sus ángulos
      mide $60°$. ¿Cuál es su nombre más preciso?
    options:
      - {label: A, body: "Cuadrado, porque sus lados son iguales", misconception: FIG-CLAS-REGULAR}
      - {label: B, body: "Paralelogramo, y por eso no puede ser rombo", misconception: FIG-CLAS-EXCLUYE}
      - {label: C, body: "Rombo", correct: true}
      - {label: D, body: "Romboide", misconception: FIG-CLAS-NOMBRE}

  # A NOMBRE: confunde los nombres
  # C EXCLUYE: nombres excluyentes
  # D ORIENTA: la posición decide
  - code: M1-FIG-012
    node: GEO-FIG-CLAS
    pool: curated
    difficulty: 2
    source: propio
    stem: >-
      Una baldosa tiene cuatro lados de $20$ cm y cuatro ángulos rectos,
      pero está colocada «en diagonal», apoyada sobre una esquina. ¿Qué
      figura es?
    options:
      - {label: A, body: "Un romboide", misconception: FIG-CLAS-NOMBRE}
      - {label: B, body: "Un cuadrado", correct: true}
      - {label: C, body: "Un cuadrado, pero no un rectángulo", misconception: FIG-CLAS-EXCLUYE}
      - {label: D, body: "Un rombo que no es cuadrado", misconception: FIG-CLAS-ORIENTA}

  # A ORIENTA: la posición decide
  # C NOMBRE: confunde acutángulo con obtusángulo
  # D CRITERIOS: lados y ángulos se excluyen
  - code: M1-FIG-013
    node: GEO-FIG-CLAS
    pool: curated
    difficulty: 2
    source: propio
    figure: FIG-FIG-CLAS-05
    stem: "¿Cómo se clasifica el triángulo de la figura?"
    options:
      - {label: A, body: "Es escaleno, porque no está apoyado sobre su lado desigual.", misconception: FIG-CLAS-ORIENTA}
      - {label: B, body: "Es isósceles y obtusángulo.", correct: true}
      - {label: C, body: "Es isósceles y acutángulo.", misconception: FIG-CLAS-NOMBRE}
      - {label: D, body: "Es obtusángulo, y por eso no puede ser isósceles.", misconception: FIG-CLAS-CRITERIOS}

  # A PARALELOS: tener lados paralelos le basta
  # B EXCLUYE: nombres excluyentes
  # D REGULAR: ángulos iguales le bastan
  - code: M1-FIG-014
    node: GEO-FIG-CLAS
    pool: curated
    difficulty: 2
    source: propio
    stem: "¿Cuál de las siguientes afirmaciones es correcta?"
    options:
      - {label: A, body: "Un rectángulo es un trapecio, porque tiene lados paralelos.", misconception: FIG-CLAS-PARALELOS}
      - {label: B, body: "Un rectángulo nunca puede ser un cuadrado.", misconception: FIG-CLAS-EXCLUYE}
      - {label: C, body: "Un rectángulo que tiene sus cuatro lados iguales es un cuadrado.", correct: true}
      - {label: D, body: "Todo rectángulo es un polígono regular, porque sus ángulos son iguales.", misconception: FIG-CLAS-REGULAR}

  # B REGULAR: una condición le basta
  # C EXCLUYE: nombres excluyentes
  # D PARALELOS: confunde los pares
  - code: M1-FIG-015
    node: GEO-FIG-CLAS
    pool: curated
    difficulty: 2
    source: propio
    stem: "¿Qué tienen en común un rombo y un rectángulo?"
    options:
      - {label: A, body: "Los dos son paralelogramos.", correct: true}
      - {label: B, body: "Los dos son polígonos regulares.", misconception: FIG-CLAS-REGULAR}
      - {label: C, body: "Nada: como tienen nombre propio, ninguno es paralelogramo.", misconception: FIG-CLAS-EXCLUYE}
      - {label: D, body: "Los dos tienen un solo par de lados paralelos.", misconception: FIG-CLAS-PARALELOS}

  # A ORIENTA: rechaza I
  # B CRITERIOS: rechaza III: si ya es equilátero, no puede tener nombre por ángulos
  # C PARALELOS: acepta II
  - code: M1-FIG-016
    node: GEO-FIG-CLAS
    pool: curated
    difficulty: 2
    source: propio
    stem: |-
      Considera las siguientes afirmaciones:

      I. Un cuadrado girado sigue siendo un cuadrado.

      II. Todo paralelogramo es un trapecio.

      III. Un triángulo equilátero es acutángulo.

      ¿Cuál o cuáles son correctas?
    options:
      - {label: A, body: "Solo III", misconception: FIG-CLAS-ORIENTA}
      - {label: B, body: "Solo I", misconception: FIG-CLAS-CRITERIOS}
      - {label: C, body: "I, II y III", misconception: FIG-CLAS-PARALELOS}
      - {label: D, body: "Solo I y III", correct: true}

  # ===== GEO-FIG-CLAS · nivel 3 ================================

  # A REGULAR: acepta I
  # B CRITERIOS: rechaza II: un trapecio no puede ser «rectángulo»
  # C EXCLUYE: rechaza III
  - code: M1-FIG-017
    node: GEO-FIG-CLAS
    pool: curated
    difficulty: 3
    source: propio
    stem: |-
      Considera las siguientes afirmaciones:

      I. Si un cuadrilátero tiene sus cuatro lados iguales, es un polígono regular.

      II. Un trapecio puede tener un ángulo recto.

      III. El cuadrado es a la vez rombo y rectángulo.

      ¿Cuál o cuáles son correctas?
    options:
      - {label: A, body: "I, II y III", misconception: FIG-CLAS-REGULAR}
      - {label: B, body: "Solo III", misconception: FIG-CLAS-CRITERIOS}
      - {label: C, body: "Solo II", misconception: FIG-CLAS-EXCLUYE}
      - {label: D, body: "Solo II y III", correct: true}

  # A NOMBRE: isósceles, lo confunde con equilátero
  # C ORIENTA: está «derecho»; A está girado
  # D REGULAR: rombo: lados iguales le bastan
  - code: M1-FIG-018
    node: GEO-FIG-CLAS
    pool: curated
    difficulty: 3
    source: propio
    figure: FIG-FIG-CLAS-06
    stem: "¿Cuál de los polígonos de la figura es regular?"
    options:
      - {label: A, body: "El polígono C", misconception: FIG-CLAS-NOMBRE}
      - {label: B, body: "El polígono A", correct: true}
      - {label: C, body: "El polígono D", misconception: FIG-CLAS-ORIENTA}
      - {label: D, body: "El polígono B", misconception: FIG-CLAS-REGULAR}

  # B PARALELOS: tener lados paralelos le basta
  # C EXCLUYE: nombres excluyentes
  # D REGULAR: ángulos iguales le bastan
  - code: M1-FIG-019
    node: GEO-FIG-CLAS
    pool: curated
    difficulty: 3
    source: propio
    stem: >-
      Un carpintero corta una tabla con forma de cuadrilátero: sus lados
      opuestos son paralelos, sus cuatro ángulos son rectos, dos lados miden
      $80$ cm y los otros dos $50$ cm. ¿Cuál afirmación es correcta?
    options:
      - {label: A, body: "Es un rectángulo y no es un polígono regular.", correct: true}
      - {label: B, body: "Es un trapecio y no es un polígono regular.", misconception: FIG-CLAS-PARALELOS}
      - {label: C, body: "Es un rectángulo, así que no es un paralelogramo.", misconception: FIG-CLAS-EXCLUYE}
      - {label: D, body: "Es un rectángulo y es un polígono regular, porque sus ángulos son iguales.", misconception: FIG-CLAS-REGULAR}

  # A ORIENTA: la posición cambia la figura
  # B EXCLUYE: cree que el cuadrado no es paralelogramo
  # D NOMBRE: confunde romboide con trapezoide
  - code: M1-FIG-020
    node: GEO-FIG-CLAS
    pool: curated
    difficulty: 3
    source: propio
    stem: "¿Cuál de las siguientes figuras **no** es un paralelogramo?"
    options:
      - {label: A, body: "Un rombo apoyado sobre un vértice", misconception: FIG-CLAS-ORIENTA}
      - {label: B, body: "Un cuadrado", misconception: FIG-CLAS-EXCLUYE}
      - {label: C, body: "Un trapecio", correct: true}
      - {label: D, body: "Un romboide", misconception: FIG-CLAS-NOMBRE}

  # A PARALELOS: acepta III
  # C EXCLUYE: rechaza I
  # D REGULAR: acepta II
  - code: M1-FIG-021
    node: GEO-FIG-CLAS
    pool: curated
    difficulty: 3
    source: propio
    stem: |-
      Considera las siguientes afirmaciones:

      I. Un rombo puede ser un rectángulo.

      II. Un polígono con todos sus lados iguales siempre es regular.

      III. Un paralelogramo tiene un solo par de lados paralelos.

      ¿Cuál o cuáles son correctas?
    options:
      - {label: A, body: "Solo I y III", misconception: FIG-CLAS-PARALELOS}
      - {label: B, body: "Solo I", correct: true}
      - {label: C, body: "Ninguna de ellas", misconception: FIG-CLAS-EXCLUYE}
      - {label: D, body: "Solo I y II", misconception: FIG-CLAS-REGULAR}

  # B ORIENTA: la posición decide
  # C REGULAR: ángulos iguales le bastan
  # D EXCLUYE: nombres excluyentes
  - code: M1-FIG-022
    node: GEO-FIG-CLAS
    pool: curated
    difficulty: 3
    source: propio
    stem: >-
      Un cuadrilátero tiene sus cuatro ángulos rectos. ¿Qué se puede
      asegurar?
    options:
      - {label: A, body: "Es un rectángulo, y podría ser un cuadrado.", correct: true}
      - {label: B, body: "Es un rectángulo solo si está apoyado sobre uno de sus lados.", misconception: FIG-CLAS-ORIENTA}
      - {label: C, body: "Es un polígono regular.", misconception: FIG-CLAS-REGULAR}
      - {label: D, body: "Es un rectángulo, así que no puede ser un cuadrado.", misconception: FIG-CLAS-EXCLUYE}

  # A EXCLUYE: nombres de una clase no pasan a otra
  # B PARALELOS: tener lados paralelos le basta
  # C NOMBRE: confunde trapecio con trapezoide
  - code: M1-FIG-023
    node: GEO-FIG-CLAS
    pool: curated
    difficulty: 3
    source: propio
    stem: >-
      Una plaza tiene forma de cuadrilátero con dos lados paralelos de $40$
      m y $60$ m, y los otros dos lados de $25$ m cada uno. ¿Qué figura es?
    options:
      - {label: A, body: "Un trapecio, pero no isósceles: isósceles es solo para triángulos", misconception: FIG-CLAS-EXCLUYE}
      - {label: B, body: "Un paralelogramo", misconception: FIG-CLAS-PARALELOS}
      - {label: C, body: "Un trapezoide isósceles", misconception: FIG-CLAS-NOMBRE}
      - {label: D, body: "Un trapecio isósceles", correct: true}

  # A NOMBRE: confunde isósceles con equilátero
  # B EXCLUYE: nombres excluyentes
  # D CRITERIOS: lados y ángulos se excluyen
  - code: M1-FIG-024
    node: GEO-FIG-CLAS
    pool: curated
    difficulty: 3
    source: propio
    stem: "¿Cuál de las siguientes afirmaciones es correcta?"
    options:
      - {label: A, body: "Todo triángulo isósceles es regular.", misconception: FIG-CLAS-NOMBRE}
      - {label: B, body: "Un triángulo equilátero no es isósceles.", misconception: FIG-CLAS-EXCLUYE}
      - {label: C, body: "Un triángulo equilátero es regular, y un triángulo isósceles no siempre lo es.", correct: true}
      - {label: D, body: "Un triángulo equilátero no puede ser acutángulo.", misconception: FIG-CLAS-CRITERIOS}

  # ===== GEO-FIG-ELEM · nivel 1 ================================

  # A ALTVERTICAL: el segmento vertical
  # B ALTLADO: un lado
  # D ALTMEDIANA: el que llega al punto medio
  - code: M1-FIG-025
    node: GEO-FIG-ELEM
    pool: curated
    difficulty: 1
    source: propio
    figure: FIG-FIG-ELEM-01
    stem: >-
      ¿Cuál de los segmentos es la altura del triángulo trazada desde $C$
      sobre el lado $AB$?
    options:
      - {label: A, body: "$CV$", misconception: FIG-ELEM-ALTVERTICAL}
      - {label: B, body: "$CB$", misconception: FIG-ELEM-ALTLADO}
      - {label: C, body: "$CD$", correct: true}
      - {label: D, body: "$CM$", misconception: FIG-ELEM-ALTMEDIANA}

  # B ALTVERTICAL: vertical respecto de la hoja
  # C ALTDENTRO: no acepta alturas fuera
  # D ALTMEDIANA: la confunde con la mediana
  - code: M1-FIG-026
    node: GEO-FIG-ELEM
    pool: curated
    difficulty: 1
    source: propio
    stem: >-
      ¿Cuál de las siguientes afirmaciones sobre la altura de un triángulo
      es correcta?
