# =====================================================================
# LES-EST-DAT-01 — Variables y tablas de frecuencia
# Cubre EST-DAT-VAR, EST-TAB-ABS, EST-TAB-ACUM
# =====================================================================
# Cadena VAR -> ABS -> ACUM. VAR es `pre` y raíz del grafo; ABS y ACUM
# son M1. Primera clase del eje EST.
#
# Alcance (propuesto, sin control 1):
#   VAR  entra   variable, individuo y población en un estudio; cualitativa
#                y cuantitativa; discreta y continua; categorías con orden
#                siguen siendo cualitativas (sin exigir "nominal" y
#                "ordinal" como nombres); números que solo identifican
#                (camiseta, RUT) son cualitativos.
#        fuera   muestra y población como técnica de muestreo (no hay
#                nodo); gráficos (EST-GRA-*).
#   ABS  entra   frecuencia absoluta de un valor, contar desde datos
#                sueltos, total de datos n = suma de frecuencias, total de
#                la variable (suma de valor · frecuencia), frecuencia que
#                falta, datos agrupados en intervalos [a, b).
#        fuera   frecuencia relativa y porcentual (EST-TAB-REL); moda y
#                promedio como conceptos (EST-PRO-*): el total de la
#                variable se pide, el promedio no.
#   ACUM entra   construir F, leer F, "a lo sumo", "menos de", "más de",
#                "al menos", "entre", recuperar f desde F, F del último
#                valor = n, intervalos.
#        fuera   mediana desde F (EST-POS-MEDIANA).
#   formato  las tablas van como arreglo de KaTeX ($$\begin{array}...$$):
#            el front no tiene remark-gfm y una tabla markdown no se
#            dibuja.
#
# Niveles:
#   1  una lectura o una clasificación
#   2  dos pasos, tablas con F, datos sueltos que hay que agrupar
#   3  I/II/III, contexto, errores de otro para detectar
# ---------------------------------------------------------------------

unit: EST-DAT

lesson:
  code: LES-EST-DAT-01
  title: Variables y tablas de frecuencia
  position: 1
  nodes:
    - node: EST-DAT-VAR
      anchor: tipos-de-variables
    - node: EST-TAB-ABS
      anchor: frecuencia-absoluta
    - node: EST-TAB-ACUM
