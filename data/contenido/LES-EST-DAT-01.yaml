items:

  # ===== EST-DAT-VAR · nivel 1 =================================

  # B NUMERO: número = cantidad
  # C ORDINAL: ordenada = cantidad
  # D DISCATEG: categorías separadas = discreta
  - code: M1-DAT-001
    node: EST-DAT-VAR
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuál de las siguientes afirmaciones es correcta?"
    options:
      - {label: A, body: "La cantidad de mascotas de una familia es una variable cuantitativa discreta.", correct: true}
      - {label: B, body: "El número de RUT de una persona es una variable cuantitativa.", misconception: DAT-VAR-NUMERO}
      - {label: C, body: "El nivel de inglés de una persona (básico, intermedio o avanzado) es una variable cuantitativa.", misconception: DAT-VAR-ORDINAL}
      - {label: D, body: "El color de un auto es una variable discreta.", misconception: DAT-VAR-DISCATEG}

  # A ORDINAL: ordenada = cantidad
  # B ENTERO: sin decimales = discreta
  # D NUMERO: número = cantidad
  - code: M1-DAT-002
    node: EST-DAT-VAR
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuál de las siguientes variables es cuantitativa discreta?"
    options:
      - {label: A, body: "La talla de polera (S, M, L o XL).", misconception: DAT-VAR-ORDINAL}
      - {label: B, body: "La estatura de una persona, anotada en centímetros enteros.", misconception: DAT-VAR-ENTERO}
      - {label: C, body: "La cantidad de hermanos de una persona.", correct: true}
      - {label: D, body: "El número de camiseta de un jugador.", misconception: DAT-VAR-NUMERO}

  # A NUMERO: número = cantidad
  # C CANTIDAD: «cantidad» = discreta
  # D ENTERO: sin decimales = discreta
  - code: M1-DAT-003
    node: EST-DAT-VAR
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuál de las siguientes afirmaciones es correcta?"
    options:
      - {label: A, body: "El código postal de una casa es una variable cuantitativa.", misconception: DAT-VAR-NUMERO}
      - {label: B, body: "El tiempo que tarda un corredor en recorrer $100$ metros es una variable continua.", correct: true}
      - {label: C, body: "La cantidad de lluvia caída en un día es una variable discreta.", misconception: DAT-VAR-CANTIDAD}
      - {label: D, body: "La masa de una persona, anotada en kilogramos enteros, es una variable discreta.", misconception: DAT-VAR-ENTERO}

  # A DISCATEG: categorías = discreta
  # B ORDINAL: ordenada = cantidad
  # C NUMERO: codificada con números = cantidad
  - code: M1-DAT-004
    node: EST-DAT-VAR
    pool: curated
    difficulty: 1
    source: propio
    stem: >-
      ¿Qué tipo de variable es el nivel educacional de una persona (básica,
      media o superior)?
    options:
      - {label: A, body: "Discreta, porque tiene categorías separadas.", misconception: DAT-VAR-DISCATEG}
      - {label: B, body: "Cuantitativa, porque sus categorías se pueden ordenar.", misconception: DAT-VAR-ORDINAL}
      - {label: C, body: "Cuantitativa, porque se puede codificar como $1$, $2$ y $3$.", misconception: DAT-VAR-NUMERO}
      - {label: D, body: "Cualitativa, aunque sus categorías tengan un orden.", correct: true}

  # A NUMERO: número = cantidad
  # C ORDINAL: ordenable = cantidad
  # D DISCATEG: aplica «discreta» a una cualitativa
  - code: M1-DAT-005
    node: EST-DAT-VAR
    pool: curated
    difficulty: 1
    source: propio
    stem: >-
      ¿Qué tipo de variable es el número de camiseta de un jugador de
      fútbol?
    options:
      - {label: A, body: "Cuantitativa discreta, porque sus valores son números enteros.", misconception: DAT-VAR-NUMERO}
      - {label: B, body: "Cualitativa, porque el número solo identifica al jugador.", correct: true}
      - {label: C, body: "Cuantitativa, porque los números se pueden ordenar.", misconception: DAT-VAR-ORDINAL}
      - {label: D, body: "Cualitativa y discreta, porque cada jugador tiene un número distinto.", misconception: DAT-VAR-DISCATEG}

  # B ORDINAL: rechaza I
  # C CANTIDAD: acepta III
  # D NUMERO: acepta II
  - code: M1-DAT-006
    node: EST-DAT-VAR
    pool: curated
    difficulty: 1
    source: propio
    stem: |-
      Considera las siguientes afirmaciones:

      I. La talla de polera (S, M, L) es una variable cualitativa.

      II. El número de teléfono de una persona es una variable cuantitativa.

      III. La cantidad de azúcar de un queque, en gramos, es una variable discreta.

      ¿Cuál o cuáles son correctas?
    options:
      - {label: A, body: "Solo I", correct: true}
      - {label: B, body: "Ninguna de ellas", misconception: DAT-VAR-ORDINAL}
      - {label: C, body: "Solo I y III", misconception: DAT-VAR-CANTIDAD}
      - {label: D, body: "Solo I y II", misconception: DAT-VAR-NUMERO}

  # A NUMERO: número = cantidad
  # B DISCATEG: categorías = discreta
  # D ENTERO: sin decimales = discreta
  - code: M1-DAT-007
    node: EST-DAT-VAR
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuál de las siguientes afirmaciones es correcta?"
    options:
      - {label: A, body: "El número de la sala donde estudia un curso es una variable cuantitativa.", misconception: DAT-VAR-NUMERO}
      - {label: B, body: "La marca de celular que usa una persona es una variable discreta.", misconception: DAT-VAR-DISCATEG}
      - {label: C, body: "La marca de celular que usa una persona es una variable cualitativa.", correct: true}
      - {label: D, body: "La duración de una canción, en segundos enteros, es una variable discreta.", misconception: DAT-VAR-ENTERO}

  # A NUMERO: número = cantidad
  # B ORDINAL: ordenada = cantidad
  # C CANTIDAD: «cantidad» = discreta
  - code: M1-DAT-008
    node: EST-DAT-VAR
    pool: curated
    difficulty: 1
    source: propio
    stem: "¿Cuál de las siguientes afirmaciones es correcta?"
    options:
      - {label: A, body: "El número de serie de un computador es una variable cuantitativa.", misconception: DAT-VAR-NUMERO}
      - {label: B, body: "El nivel de picante de una salsa (suave, medio o fuerte) es una variable cuantitativa.", misconception: DAT-VAR-ORDINAL}
      - {label: C, body: "La cantidad de leche que produce una vaca en un día es una variable discreta.", misconception: DAT-VAR-CANTIDAD}
      - {label: D, body: "El tiempo que demora un bus entre dos paraderos es una variable continua.", correct: true}

  # ===== EST-DAT-VAR · nivel 2 =================================

  # A ENTERO: sin decimales = discreta
  # B VALOR: responde con un valor
  # C POBLACION: responde con los individuos
  - code: M1-DAT-009
    node: EST-DAT-VAR
    pool: curated
    difficulty: 2
    source: propio
    stem: >-
      En un colegio se midió la estatura de $40$ estudiantes y se anotó en
      centímetros, redondeada al entero. La estatura más repetida fue $165$
      cm. ¿Cuál afirmación es correcta?
    options:
      - {label: A, body: "La variable es la estatura, y es cuantitativa discreta, porque se anotó en centímetros enteros.", misconception: DAT-VAR-ENTERO}
      - {label: B, body: "La variable es $165$ cm, la estatura más repetida.", misconception: DAT-VAR-VALOR}
      - {label: C, body: "La variable son los $40$ estudiantes.", misconception: DAT-VAR-POBLACION}
      - {label: D, body: "La variable es la estatura, y es cuantitativa continua.", correct: true}

  # A VALOR: responde con valores
  # B POBLACION: responde con los individuos
  # D DISCATEG: aplica «discreta» a una cualitativa
  - code: M1-DAT-010
    node: EST-DAT-VAR
    pool: curated
    difficulty: 2
    source: propio
    stem: >-
      En un estudio se registró, para cada uno de los $50$ árboles de una
      plaza, su especie y su altura. ¿Cuál afirmación es correcta?
    options:
      - {label: A, body: "Las variables son «pino» y «$15$ metros».", misconception: DAT-VAR-VALOR}
      - {label: B, body: "Las variables son los $50$ árboles de la plaza.", misconception: DAT-VAR-POBLACION}
      - {label: C, body: "La especie es cualitativa y la altura es cuantitativa continua.", correct: true}
      - {label: D, body: "La especie es cualitativa discreta y la altura es cuantitativa continua.", misconception: DAT-VAR-DISCATEG}

  # B ENTERO: acepta II
  # C NUMERO: rechaza I
  # D CANTIDAD: rechaza III
  - code: M1-DAT-011
    node: EST-DAT-VAR
    pool: curated
    difficulty: 2
    source: propio
    stem: |-
      Considera las siguientes afirmaciones:

      I. El número de recorrido de un bus (por ejemplo, $210$) es una variable cualitativa.

      II. La temperatura máxima de un día, anotada en grados enteros, es una variable discreta.

      III. La cantidad de harina de una receta, en gramos, es una variable continua.

      ¿Cuál o cuáles son correctas?
    options:
      - {label: A, body: "Solo I y III", correct: true}
      - {label: B, body: "I, II y III", misconception: DAT-VAR-ENTERO}
      - {label: C, body: "Solo III", misconception: DAT-VAR-NUMERO}
      - {label: D, body: "Solo I", misconception: DAT-VAR-CANTIDAD}

  # A VALOR: responde con un valor
  # C POBLACION: responde con los individuos
  # D DISCATEG: aplica «discreta» a una cualitativa
  - code: M1-DAT-012
    node: EST-DAT-VAR
    pool: curated
    difficulty: 2
    source: propio
    stem: >-
      Se preguntó a los $28$ estudiantes de un curso por su deporte
      favorito, y $12$ respondieron fútbol. ¿Cuál es la variable y de qué
      tipo es?
    options:
      - {label: A, body: "El fútbol, que es una variable cualitativa.", misconception: DAT-VAR-VALOR}
      - {label: B, body: "El deporte favorito de cada estudiante, que es una variable cualitativa.", correct: true}
      - {label: C, body: "Los $28$ estudiantes, que son una variable cuantitativa discreta.", misconception: DAT-VAR-POBLACION}
      - {label: D, body: "El deporte favorito de cada estudiante, que es una variable cualitativa discreta.", misconception: DAT-VAR-DISCATEG}

  # A DISCATEG: aplica «discreta» a una cualitativa
  # B VALOR: responde con un valor
  # C POBLACION: responde con los individuos
  - code: M1-DAT-013
    node: EST-DAT-VAR
    pool: curated
    difficulty: 2
    source: propio
    stem: "¿Cuál de las siguientes afirmaciones es correcta?"
    options:
      - {label: A, body: "El género literario favorito de una persona es una variable discreta.", misconception: DAT-VAR-DISCATEG}
      - {label: B, body: "Si $12$ estudiantes leyeron $3$ libros, la variable es «$3$ libros».", misconception: DAT-VAR-VALOR}
      - {label: C, body: "Si se registra cuántos libros leyó cada estudiante de un curso, la variable son los estudiantes.", misconception: DAT-VAR-POBLACION}
      - {label: D, body: "Si se registra cuántos libros leyó cada estudiante de un curso, la variable es cuantitativa discreta.", correct: true}

  # B DISCATEG: acepta III
  # C NUMERO: acepta II
  # D ORDINAL: rechaza I
  - code: M1-DAT-014
    node: EST-DAT-VAR
    pool: curated
    difficulty: 2
    source: propio
    stem: |-
      Considera las siguientes afirmaciones:

      I. Una variable cualitativa puede tener categorías ordenadas.

      II. Toda variable cuyos valores son números es cuantitativa.

      III. Una variable cualitativa puede ser discreta o continua.

      ¿Cuál o cuáles son correctas?
    options:
      - {label: A, body: "Solo I", correct: true}
      - {label: B, body: "Solo I y III", misconception: DAT-VAR-DISCATEG}
      - {label: C, body: "Solo I y II", misconception: DAT-VAR-NUMERO}
      - {label: D, body: "Ninguna de ellas", misconception: DAT-VAR-ORDINAL}

  # A NUMERO: los dos le parecen cuantitativos discretos
  # B ORDINAL: los dos le parecen cuantitativos
  # D CANTIDAD: los dos le parecen discretos por la palabra «cantidad»
  - code: M1-DAT-015
    node: EST-DAT-VAR
    pool: curated
    difficulty: 2
    source: propio
    stem: >-
      ¿En cuál de los siguientes pares las dos variables son del mismo tipo?
    options:
      - {label: A, body: "Número de camiseta y cantidad de goles en un partido.", misconception: DAT-VAR-NUMERO}
      - {label: B, body: "Nivel de inglés y cantidad de idiomas que habla una persona.", misconception: DAT-VAR-ORDINAL}
      - {label: C, body: "Cantidad de hermanos y cantidad de goles en un partido.", correct: true}
      - {label: D, body: "Cantidad de lluvia caída y cantidad de hermanos.", misconception: DAT-VAR-CANTIDAD}

  # A NUMERO: número = cantidad
  # C DISCATEG: categorías = discreta
  # D ENTERO: sin decimales = discreta
  - code: M1-DAT-016
    node: EST-DAT-VAR
    pool: curated
    difficulty: 2
    source: propio
    stem: "¿Cuál de las siguientes afirmaciones es correcta?"
    options:
      - {label: A, body: "El número de pasaporte de una persona es una variable cuantitativa.", misconception: DAT-VAR-NUMERO}
      - {label: B, body: "El puntaje obtenido en una prueba de $60$ preguntas es una variable cuantitativa discreta.", correct: true}
      - {label: C, body: "El sabor de helado favorito de una persona es una variable discreta.", misconception: DAT-VAR-DISCATEG}
      - {label: D, body: "La duración de una llamada, anotada en minutos enteros, es una variable discreta.", misconception: DAT-VAR-ENTERO}

  # ===== EST-DAT-VAR · nivel 3 =================================

  # B DISCATEG: aplica «discreta» a una cualitativa
  # C POBLACION: responde con los individuos
  # D ENTERO: la masa sin decimales le parece discreta
  - code: M1-DAT-017
    node: EST-DAT-VAR
    pool: curated
    difficulty: 3
    source: propio
    stem: >-
      Una nutricionista registra, para cada uno de sus $60$ pacientes, el
      sexo, la masa en kilogramos redondeada al entero y la cantidad de
      comidas que hace al día. ¿Cuál afirmación es correcta?
    options:
      - {label: A, body: "La masa es cuantitativa continua y la cantidad de comidas es cuantitativa discreta.", correct: true}
      - {label: B, body: "El sexo es discreto, la masa es continua y la cantidad de comidas es discreta.", misconception: DAT-VAR-DISCATEG}
      - {label: C, body: "Las variables del estudio son los $60$ pacientes.", misconception: DAT-VAR-POBLACION}
      - {label: D, body: "La masa y la cantidad de comidas son cuantitativas discretas.", misconception: DAT-VAR-ENTERO}

  # A ENTERO: rechaza I
  # C POBLACION: rechaza III
  # D NUMERO: acepta II
  - code: M1-DAT-018
    node: EST-DAT-VAR
    pool: curated
    difficulty: 3
    source: propio
    stem: |-
      De cada uno de los $30$ estudiantes de un curso se registró su
      estatura (en centímetros enteros) y su número de lista. Considera
      las siguientes afirmaciones:

      I. La estatura es continua, aunque se haya anotado en centímetros enteros.

      II. El número de lista es una variable cuantitativa discreta.

      III. Los $30$ estudiantes no son una variable: son los individuos del estudio.

      ¿Cuál o cuáles son correctas?
    options:
      - {label: A, body: "Solo III", misconception: DAT-VAR-ENTERO}
      - {label: B, body: "Solo I y III", correct: true}
      - {label: C, body: "Solo I", misconception: DAT-VAR-POBLACION}
      - {label: D, body: "I, II y III", misconception: DAT-VAR-NUMERO}

  # A DISCATEG: el estado del cielo le parece discreto
  # B POBLACION: responde con los individuos
  # C CANTIDAD: la lluvia, por ser «cantidad», le parece discreta
  - code: M1-DAT-019
    node: EST-DAT-VAR
    pool: curated
    difficulty: 3
    source: propio
    stem: >-
      Una estación meteorológica registra cada día la temperatura mínima (en
      °C, con un decimal), la cantidad de lluvia caída (en mm) y el estado
      del cielo (despejado, nublado o lluvioso). ¿Cuál afirmación es
      correcta?
    options:
      - {label: A, body: "Hay dos variables continuas y una discreta.", misconception: DAT-VAR-DISCATEG}
      - {label: B, body: "Las variables son los días del año en que se midió.", misconception: DAT-VAR-POBLACION}
      - {label: C, body: "Hay una variable continua, una discreta y una cualitativa.", misconception: DAT-VAR-CANTIDAD}
      - {label: D, body: "Hay dos variables cuantitativas continuas y una cualitativa.", correct: true}

  # A ENTERO: cree que esta es la incorrecta: la ve discreta
  # B ORDINAL: cree que esta es la incorrecta: la ve cuantitativa
  # D CANTIDAD: cree que esta es la incorrecta: la ve discreta
  - code: M1-DAT-020
    node: EST-DAT-VAR
    pool: curated
    difficulty: 3
    source: propio
    stem: >-
      Tomás clasificó cuatro variables y se equivocó en una sola. ¿En cuál
      se equivocó?
    options:
      - {label: A, body: "Estatura, anotada en centímetros enteros: cuantitativa continua.", misconception: DAT-VAR-ENTERO}
      - {label: B, body: "Nivel educacional de una persona: cualitativa.", misconception: DAT-VAR-ORDINAL}
      - {label: C, body: "Código postal de una casa: cuantitativa discreta.", correct: true}
      - {label: D, body: "Cantidad de lluvia caída en un día: cuantitativa continua.", misconception: DAT-VAR-CANTIDAD}

  # A CANTIDAD: rechaza I
  # B DISCATEG: acepta II
  # C POBLACION: rechaza III: la variable serían las 40 personas
  - code: M1-DAT-021
    node: EST-DAT-VAR
    pool: curated
    difficulty: 3
    source: propio
    stem: |-
      Considera las siguientes afirmaciones:

      I. La cantidad de agua de un estanque es una variable continua.

      II. El color de ojos es una variable discreta.

      III. Si se pregunta a $40$ personas en qué comuna viven, la variable es la comuna.

      ¿Cuál o cuáles son correctas?
    options:
      - {label: A, body: "Solo III", misconception: DAT-VAR-CANTIDAD}
      - {label: B, body: "I, II y III", misconception: DAT-VAR-DISCATEG}
      - {label: C, body: "Solo I", misconception: DAT-VAR-POBLACION}
      - {label: D, body: "Solo I y III", correct: true}

  # A FRECUENCIA: confunde la variable con su frecuencia
  # B ENTERO: sin decimales = discreta
  # D POBLACION: responde con los individuos
  - code: M1-DAT-022
    node: EST-DAT-VAR
    pool: curated
    difficulty: 3
    source: propio
    stem: >-
      Una profesora registró el tiempo que tardó cada estudiante en resolver
      un ejercicio, redondeado al segundo, y después contó cuántos
      estudiantes tardaron cada tiempo. ¿Cuál afirmación es correcta?
    options:
      - {label: A, body: "La variable es cuántos estudiantes tardaron cada tiempo.", misconception: DAT-VAR-FRECUENCIA}
      - {label: B, body: "La variable es el tiempo, y es cuantitativa discreta, porque se anotó en segundos enteros.", misconception: DAT-VAR-ENTERO}
      - {label: C, body: "La variable es el tiempo, y es cuantitativa continua.", correct: true}
      - {label: D, body: "La variable son los estudiantes del curso.", misconception: DAT-VAR-POBLACION}

  # B FRECUENCIA: confunde la variable con su frecuencia
  # C DISCATEG: el medio de transporte le parece discreto
  # D POBLACION: confunde variables con individuos
  - code: M1-DAT-023
    node: EST-DAT-VAR
    pool: curated
    difficulty: 3
    source: propio
    stem: >-
      En un estudio sobre transporte se pregunta a $200$ personas por su
      medio de transporte principal, el tiempo de viaje y la cantidad de
      transbordos que hacen. ¿Cuál afirmación es correcta?
    options:
      - {label: A, body: "Hay una variable cualitativa, una cuantitativa continua y una cuantitativa discreta.", correct: true}
      - {label: B, body: "La variable es cuántas personas usan cada medio de transporte.", misconception: DAT-VAR-FRECUENCIA}
      - {label: C, body: "Hay dos variables discretas y una continua.", misconception: DAT-VAR-DISCATEG}
      - {label: D, body: "Hay $200$ variables, una por cada persona.", misconception: DAT-VAR-POBLACION}

  # A ENTERO: sin decimales = discreta
  # C NUMERO: número = cantidad
  # D FRECUENCIA: confunde la variable con una frecuencia
  - code: M1-DAT-024
    node: EST-DAT-VAR
    pool: curated
    difficulty: 3
    source: propio
    stem: "¿Cuál de las siguientes afirmaciones es correcta?"
    options:
      - {label: A, body: "La distancia de la casa al colegio, anotada en kilómetros enteros, es una variable discreta.", misconception: DAT-VAR-ENTERO}
      - {label: B, body: "La cantidad de estudiantes presentes en una clase es una variable discreta.", correct: true}
      - {label: C, body: "El número de la línea de metro que usa una persona es una variable cuantitativa.", misconception: DAT-VAR-NUMERO}
