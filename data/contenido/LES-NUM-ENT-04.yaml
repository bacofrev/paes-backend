# =====================================================================
# LES-NUM-ENT-04 — Prioridad de operaciones
# Cubre NUM-ENT-PRIOR
# =====================================================================
# Clase sola. Prerrequisito: NUM-ENT-MUL (LES-NUM-ENT-03). La piden
# NUM-DEC-OPER y ALG-EXP-VAL.
#
# Alcance (propuesto, sin control 1):
#   entra   orden: paréntesis (y corchetes), después multiplicaciones y
#           divisiones de izquierda a derecha, después sumas y restas de
#           izquierda a derecha; signo menos delante de un paréntesis; un
#           número delante de un paréntesis; la raya de fracción como
#           agrupación (numerador y denominador se calculan primero);
#           contexto de varios pasos con enteros.
#   fuera   potencias (NUM-POT-CONC no es ancestro: sin «PAPOMUDAS»
#           completo, la «PO» llega con ALG-EXP-VAL); letras y
#           valorización (ALG-EXP-VAL); suprimir paréntesis con letras
#           (ALG-EXP-ADI); fracciones no enteras y decimales (NUM-FRA,
#           NUM-DEC-OPER). Toda raya de fracción da un cociente entero.
#   decisión el signo delante del paréntesis se enseña como «calcula
#           primero lo de adentro». Suprimir paréntesis cambiando signos
#           es ALG-EXP-ADI; acá solo aparece como error (SIGNOPAR).
#
# Niveles:
#   1  dos o tres operaciones, una sola decisión de prioridad
#   2  cuatro operaciones, corchetes, raya con varias operaciones,
#      contexto de varios pasos
#   3  I/II/III, desarrollos completos para elegir el correcto, anidados
# ---------------------------------------------------------------------

