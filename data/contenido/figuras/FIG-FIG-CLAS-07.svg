<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 528 296" width="528" height="296" role="img" aria-label="Esquema: los cuadriláteros se dividen en trapezoides (ningún par de lados paralelos), trapecios (un par) y paralelogramos (dos pares). Los paralelogramos incluyen romboides, rectángulos y rombos. El cuadrado es a la vez rectángulo y rombo." fill="currentColor" font-family="Manrope, Verdana, sans-serif" stroke="currentColor" stroke-linecap="round">
  <line x1="264" y1="58" x2="88" y2="106" stroke-width="1.1"/>
  <line x1="264" y1="58" x2="208" y2="106" stroke-width="1.1"/>
  <line x1="264" y1="58" x2="380" y2="106" stroke-width="1.1"/>
  <line x1="380" y1="126" x2="272" y2="174" stroke-width="1.1"/>
  <line x1="380" y1="126" x2="380" y2="174" stroke-width="1.1"/>
  <line x1="380" y1="126" x2="472" y2="174" stroke-width="1.1"/>
